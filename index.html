<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bounce Duel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bounce Duel">
<style>
  :root {
    --bg: #000; --panel: #0e0e12; --panel-2: #16161c; --line: #2a2a33; --text: #fff; --muted: #a3a3b0;
    --p1: #ff4d5e; --p2: #4da6ff; --good: #4ade80; --bad: #ff4d5e; --coin: #ffcf3f; --event: #c084fc;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; touch-action: manipulation; -webkit-text-size-adjust: 100%;
  }
  canvas#c { display: block; touch-action: none; position: fixed; inset: 0; }
  .hidden { display: none !important; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--muted); line-height: 1.5; }

  button {
    font: inherit; background: #fff; color: #000; border: 0; border-radius: 10px; padding: 13px 22px;
    font-size: 17px; font-weight: 700; cursor: pointer;
  }
  button:hover { background: #e4e4e4; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--p2); outline-offset: 2px; }
  button.ghost { background: transparent; color: #fff; border: 2px solid var(--line); }
  button.ghost:hover { border-color: #fff; }
  button.small { padding: 8px 14px; font-size: 14px; border-radius: 8px; }
  button.coin-btn { background: var(--coin); color: #1a1200; }
  button.event-btn { background: var(--event); color: #12001f; }
  button.link { background: none; color: var(--p2); padding: 0; font-size: inherit; font-weight: 600; text-decoration: underline; border-radius: 0; }

  input {
    font: inherit; background: #111; color: #fff; border: 2px solid #3a3a44; border-radius: 10px;
    padding: 10px 12px; font-size: 17px; width: 100%; outline: none; -webkit-user-select: text; user-select: text;
  }
  input:focus { border-color: #fff; }
  label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }

  .coin { display: inline-block; width: .9em; height: .9em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, var(--coin) 55%, #b88700); vertical-align: -0.1em; margin-right: .25em; box-shadow: 0 0 0 1px #7a5a00 inset; }
  .err { color: var(--bad); font-size: 14px; min-height: 1.4em; }
  .ok { color: var(--good); }
  .fine { font-size: 12px; color: var(--muted); }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }

  /* ---------- App shell with tabs ---------- */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 900; letter-spacing: 3px; font-size: 18px; white-space: nowrap; }
  .wallet { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 0; }
  .pill { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
  #tabBody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  .tab-inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: #08080b;
    padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  }
  .tabbar button {
    background: none; color: var(--muted); padding: 6px 2px; border-radius: 8px; font-size: 11px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative;
  }
  .tabbar button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .tabbar button.on { color: #fff; }
  .tabbar button:hover { background: var(--panel-2); }
  .badge { position: absolute; top: 2px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--coin); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card.event { border-color: #4b2a6e; background: linear-gradient(160deg, #1b0f2b, var(--panel) 60%); }
  .card.reward { border-color: #5c4a10; background: linear-gradient(160deg, #241c05, var(--panel) 60%); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  button.tower-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; text-align: left; padding: 16px 18px; font-size: 19px; font-weight: 800;
    color: #0b0b10; background: linear-gradient(100deg, #4ade80, #38bdf8 30%, #c084fc 55%, #fb7185 78%, #facc15); }
  button.tower-btn small { display: block; font-size: 13px; font-weight: 600; opacity: .8; }
  .tower-flag { background: linear-gradient(100deg, #4ade80, #38bdf8, #c084fc, #fb7185, #facc15); color: #0b0b10; font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 999px; }
  .tower-eyebrow { background: linear-gradient(100deg, #4ade80, #38bdf8, #c084fc, #fb7185, #facc15); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tower-info p { margin: 0 0 10px; }
  .tower-time { font-size: 44px; font-weight: 900; letter-spacing: 1px; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
  .big-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .big-buttons button { padding: 18px 12px; font-size: 18px; }
  .hero { text-align: center; display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
  .demo { width: 100%; height: 170px; display: block; border-radius: 16px; border: 1px solid var(--line); background: #050507; }
  .streak { align-self: center; background: linear-gradient(90deg, #ff6a00, #ffcf3f); color: #1a0d00; font-weight: 900; padding: 6px 14px; border-radius: 999px; font-size: 14px; }
  .hero h1 { font-size: clamp(34px, 9vw, 60px); letter-spacing: 3px; line-height: 1; font-weight: 900; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; color: #fff; }

  .challenge { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  .challenge:first-of-type { border-top: 0; padding-top: 0; }
  .bar { height: 8px; border-radius: 999px; background: #22222a; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }

  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .skin-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; position: relative; }
  .skin-card canvas { width: 72px; height: 72px; }
  .skin-card .tag { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 800; letter-spacing: 1px; background: var(--event); color: #12001f; padding: 3px 6px; border-radius: 6px; }
  .skin-card button { width: 100%; }
  .price s { color: var(--muted); font-weight: 400; margin-right: 4px; }

  .lb { display: flex; flex-direction: column; }
  .lb-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .lb-row:first-child { border-top: 0; }
  .lb-row .rank { color: var(--muted); font-weight: 700; text-align: right; }
  .lb-row .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-row .meta { font-size: 12px; color: var(--muted); }
  .lb-row.me .name { color: var(--coin); }
  .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 22px; font-weight: 800; letter-spacing: 4px; -webkit-user-select: text; user-select: text; }
  .group-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--line); color: #fff; text-align: left; padding: 12px 14px; }
  .group-item:hover { background: #1e1e26; }

  .stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 15px; margin: 0; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .big-num { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; }
  form { display: flex; flex-direction: column; gap: 10px; }
  form.row { flex-direction: row; flex-wrap: nowrap; }

  /* ---------- Setup and game over ---------- */
  .overlay {
    position: fixed; inset: 0; display: flex; overflow-y: auto; background: rgba(0,0,0,.9);
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .inner { margin: auto; width: 100%; max-width: 780px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .menu { display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%); }
  #panels { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .panel {
    flex: 1 1 320px; max-width: 370px; min-width: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; text-align: left;
  }
  .panel-head { display: flex; align-items: center; gap: 12px; }
  .preview { width: 120px; height: 120px; flex: none; background: #000; border-radius: 10px; border: 1px solid var(--line); }
  .panel-head .who { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
  .acct { font-size: 13px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
  .acct b { color: #fff; }
  .acct details summary { cursor: pointer; color: var(--p2); font-weight: 600; }
  .mini-form { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .mini-form input { font-size: 16px; padding: 8px 10px; }
  .pick > span { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: #17171d; color: #fff; border: 2px solid #2c2c35; border-radius: 999px; padding: 6px 12px;
    font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { background: #22222b; }
  .chip.on { border-color: #fff; background: #fff; color: #000; }
  .chip canvas { width: 16px; height: 16px; border-radius: 3px; }
  .desc { font-size: 13px; margin-top: 6px; min-height: 1.5em; }
  .event-flag { background: var(--event); color: #12001f; font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 999px; }
  /* Match setup: big, easy pickers */
  .setup-top { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .setup-card { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 18px; text-align: left; }
  .big-preview { width: 150px; height: 150px; align-self: center; background: #000; border-radius: 16px; border: 1px solid var(--line); }
  .name-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 17px; }
  .name-row b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name-row form { display: flex; gap: 8px; flex: 1; flex-direction: row; }
  .section-label { font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .tile {
    background: #17171d; color: #fff; border: 2px solid #2c2c35; border-radius: 14px; padding: 12px 8px; min-height: 68px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font-size: 16px; font-weight: 800; text-align: center; line-height: 1.2;
  }
  .tile:hover { background: #22222b; }
  .tile small { font-size: 12px; font-weight: 500; color: var(--muted); }
  .tile.on { border-color: #fff; background: #fff; color: #000; }
  .tile.on small { color: #444; }
  .tile canvas { width: 36px; height: 36px; border-radius: 6px; }
  .sticky-go { position: sticky; bottom: 0; width: min(560px, 100%); display: flex; flex-direction: column; gap: 8px;
    padding: 14px 0 4px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.95) 25%); }
  .sticky-go #startBtn { padding: 18px; font-size: 20px; }
  .vs-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 560px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; text-align: left; }
  .vs-card .who { min-width: 0; }
  .vs-card .who b { display: block; font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vs-card .clock { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .spinner { width: 72px; height: 72px; border: 7px solid #2a2a33; border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
  .mm-title { font-size: clamp(32px, 9vw, 52px) !important; }
  .mm-timer { font-size: 44px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #winText { font-size: clamp(36px, 9vw, 64px); font-weight: 900; }
  #results { display: flex; flex-direction: column; gap: 8px; font-size: 16px; width: min(420px, 100%); }
  #results .line { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; text-align: left; }
  .up { color: var(--good); }
  .down { color: var(--bad); }

  #hint {
    position: fixed; top: calc(48px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 18px;
    pointer-events: none; text-shadow: 0 0 6px #000, 0 0 6px #000; padding: 0 16px;
  }
  #quitBtn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: 34px; height: 34px; padding: 0; border-radius: 50%; font-size: 16px; background: #1a1a1f; color: #fff; border: 1px solid #333;
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #fff; color: #000; font-weight: 700; padding: 10px 16px; border-radius: 999px; z-index: 50;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center;
  }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

  /* ---------- Phones: one column. Computers: sidebar, two columns, bigger previews ---------- */
  .split, .col-main, .col-side, .setup-left, .setup-right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .setup-left, .setup-right { gap: 18px; }
  .desk-only { display: none; }
  @media (min-width: 900px) {
    #app { display: grid; grid-template-columns: 230px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .topbar { grid-column: 1 / -1; padding: 14px 28px; }
    .brand { font-size: 22px; }
    .tabbar {
      grid-row: 2; grid-column: 1; display: flex; flex-direction: column; gap: 4px;
      border-top: 0; border-right: 1px solid var(--line); padding: 18px 12px;
    }
    .tabbar button { flex-direction: row; justify-content: flex-start; gap: 14px; font-size: 16px; padding: 12px 14px; border-radius: 10px; }
    .tabbar button.on { background: var(--panel-2); }
    .badge { position: static; margin-left: auto; }
    #tabBody { grid-row: 2; grid-column: 2; padding: 32px 36px 48px; }
    .tab-inner { max-width: 1100px; gap: 22px; }
    .split { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; }
    .hero { text-align: left; gap: 12px; }
    .hero h1 { font-size: 64px; }
    .streak { align-self: flex-start; }
    .demo { height: 360px; }
    .big-buttons button { padding: 24px 12px; font-size: 20px; }
    .shop-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .desk-only { display: block; }
    /* Character select */
    #setup .inner { max-width: 1060px; }
    #setup .setup-card { max-width: 1040px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
    .setup-left { position: sticky; top: 0; }
    .big-preview { width: 260px; height: 260px; }
    .picker { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .sticky-go { width: min(1040px, 100%); flex-direction: row-reverse; justify-content: flex-start; }
    .sticky-go button { width: 260px; }
    .vs-card { max-width: 1040px; }
    canvas#c.placing { cursor: crosshair; }
  }
  @media (hover: hover) {
    .tile:hover, .chip:hover { border-color: #55555f; }
    .skin-card:hover { border-color: #44444e; transform: translateY(-2px); }
    .skin-card { transition: transform .15s, border-color .15s; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint" class="hidden"></div>
<button id="quitBtn" class="hidden" aria-label="Leave the match" title="Leave the match (Esc)">✕</button>
<div id="toast" class="hidden"></div>

<!-- Main app with tabs -->
<div id="app" class="screen">
  <header class="topbar">
    <div class="brand">BOUNCE DUEL</div>
    <div class="wallet" id="wallet"></div>
  </header>
  <main id="tabBody"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="play"><svg viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"/></svg>Play</button>
    <button data-tab="events"><svg viewBox="0 0 24 24"><polygon points="12 3 14.8 8.8 21 9.6 16.5 13.9 17.6 20.1 12 17.1 6.4 20.1 7.5 13.9 3 9.6 9.2 8.8 12 3"/></svg>Events</button>
    <button data-tab="shop"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Shop</button>
    <button data-tab="groups"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/></svg>Groups</button>
    <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>Profile</button>
  </nav>
</div>

<!-- Match setup -->
<div id="setup" class="overlay hidden">
  <div class="inner">
    <h2 id="setupTitle"></h2>
    <div id="setupTop" class="setup-top"></div>
    <div id="setupBody" class="setup-card"></div>
    <div class="sticky-go">
      <button id="startBtn">Start</button>
      <button class="ghost" id="setupBack">Back</button>
    </div>
  </div>
</div>

<!-- Online matchmaking -->
<div id="mm" class="overlay hidden">
  <div class="inner">
    <div class="spinner" id="mmSpin" aria-hidden="true"></div>
    <h1 class="mm-title" id="mmTitle">Matchmaking…</h1>
    <p id="mmText">Looking for another player</p>
    <div class="mm-timer" id="mmTimer"></div>
    <div class="menu"><button class="ghost" id="mmCancel">Cancel</button></div>
  </div>
</div>

<!-- Pick a username (accounts made before usernames existed) -->
<div id="unameScreen" class="overlay hidden">
  <div class="inner">
    <h2>Pick your username</h2>
    <p>This is the name other players see in your battles. You can change it later in Profile.</p>
    <form id="unameForm" class="card" style="width:min(380px,100%);text-align:left" novalidate>
      <label class="field">Username <input id="unameInput" maxlength="16" autocapitalize="off" autocomplete="username" spellcheck="false"></label>
      <p class="fine">3–16 letters, numbers, dots or underscores.</p>
      <p class="err" id="unameErr"></p>
      <button type="submit">Save username</button>
    </form>
    <button class="link" id="unameLogout">Log out</button>
  </div>
</div>

<!-- Game over -->
<div id="over" class="overlay hidden">
  <div class="inner">
    <div id="winText"></div>
    <div id="results"></div>

const AUTH_ERRORS = {
  EMAIL_EXISTS: 'An account with this email already exists. Log in instead.',

class GameError extends Error {}

const authBase = svc => (cfg.authHost ? `${cfg.authHost}/` : 'https://') + svc;
const docsBase = () => `${cfg.firestoreHost || 'https://firestore.googleapis.com'}/v1/projects/${cfg.projectId}/databases/(default)/documents`;
const docName = path => `projects/${cfg.projectId}/databases/(default)/documents/${path}`;

async function request(url, opts) {
  let res;
  try { res = await fetch(url, opts); }
  catch { throw new GameError("Can't reach the account server. Check your internet connection."); }
  const body = await res.json().catch(() => ({}));
  return { res, body };
}

async function authPost(path, payload) {
  const { res, body } = await request(`${authBase('identitytoolkit.googleapis.com')}/v1/${path}?key=${cfg.apiKey}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
  });
  if (!res.ok) {
    const code = String(body.error?.message || '').split(/[\s:]/)[0];
    if (/API key/i.test(body.error?.message || '')) throw new GameError("The game's Firebase key isn't valid.");
    throw new GameError(AUTH_ERRORS[code] || 'Something went wrong. Try again.');
  }
  return body;
}

function makeSession(b) {
  return { uid: b.localId || b.user_id, email: b.email, idToken: b.idToken || b.id_token, refreshToken: b.refreshToken || b.refresh_token,
           expires: Date.now() + Number(b.expiresIn || b.expires_in || 3600) * 1000 };
}
async function signUp(email, password) {
  return makeSession(await authPost('accounts:signUp', { email: email.trim(), password, returnSecureToken: true }));
}
async function signIn(email, password) {
  return makeSession(await authPost('accounts:signInWithPassword', { email: email.trim(), password, returnSecureToken: true }));
}
async function sendReset(email) {
  await authPost('accounts:sendOobCode', { requestType: 'PASSWORD_RESET', email: email.trim() });
}
async function idToken(sess) {
  if (Date.now() > sess.expires - 60000) {
    const { res, body } = await request(`${authBase('securetoken.googleapis.com')}/v1/token?key=${cfg.apiKey}`, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(sess.refreshToken),
    });
    if (!res.ok) throw new GameError(AUTH_ERRORS[body.error?.message] || 'You were signed out. Log in again.');
    Object.assign(sess, makeSession({ ...body, email: sess.email }));
    if (sess === auth1) store.set('bd.auth', { uid: sess.uid, email: sess.email, refreshToken: sess.refreshToken });
  }
  return sess.idToken;
}

// Firestore values <-> plain JS
function toValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (typeof v === 'string') return { stringValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(toValue) } };
  return { mapValue: { fields: toFields(v) } };
}
function toFields(o) { const f = {}; for (const k of Object.keys(o)) f[k] = toValue(o[k]); return f; }
function fromValue(v) {
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return Number(v.doubleValue);
  if ('stringValue' in v) return v.stringValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fromValue);
  if ('mapValue' in v) return fromFields(v.mapValue.fields || {});
  if ('timestampValue' in v) return v.timestampValue;
  return null;
}
function fromFields(f) { const o = {}; for (const k of Object.keys(f || {})) o[k] = fromValue(f[k]); return o; }

async function fs(sess, method, path, { body, query = '' } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (sess) headers.Authorization = 'Bearer ' + await idToken(sess);
  const { res, body: out } = await request(`${docsBase()}${path}${query}`, { method, headers, body: body && JSON.stringify(body) });
  if (res.status === 404 && method === 'GET') return null;
  if (!res.ok) {
    const st = out.error?.status;
    if (st === 'PERMISSION_DENIED') throw new GameError('The server refused that change.');
    if (st === 'FAILED_PRECONDITION' || st === 'ALREADY_EXISTS') throw new GameError('EXISTS');
    if (st === 'NOT_FOUND') throw new GameError('The game database is not set up yet.');
    throw new GameError('Something went wrong saving. Try again.');
  }
  return out;
}
async function getDoc(sess, path) {
  const d = await fs(sess, 'GET', '/' + path);
  return d && d.fields !== undefined ? fromFields(d.fields) : d ? {} : null;
}
async function createDoc(sess, path, data) {
  await fs(sess, 'PATCH', '/' + path, { body: { fields: toFields(data) }, query: '?currentDocument.exists=false' });
}
async function updateDoc(sess, path, data) {
  const mask = Object.keys(data).map(k => 'updateMask.fieldPaths=' + encodeURIComponent(k)).join('&');
  await fs(sess, 'PATCH', '/' + path, { body: { fields: toFields(data) }, query: '?currentDocument.exists=true&' + mask });
}
async function deleteDoc(sess, path) { await fs(sess, 'DELETE', '/' + path); }
async function getMany(sess, paths) {
  if (!paths.length) return [];
  const out = await fs(sess, 'POST', ':batchGet', { body: { documents: paths.map(docName) } });
  return out.filter(r => r.found).map(r => ({ id: r.found.name.split('/').pop(), ...fromFields(r.found.fields) }));
}

    from: [{ collectionId: 'users' }], orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }], limit,
  } } });
  return out.filter(r => r.document).map(r => ({ id: r.document.name.split('/').pop(), ...fromFields(r.document.fields) }));
}

function rtdbUrl(path, token) {
  const ns = cfg.databaseNs ? `ns=${cfg.databaseNs}&` : '';
  return `${cfg.databaseURL}/${path}.json?${ns}auth=${encodeURIComponent(token)}`;
}
async function rtdb(method, path, body) {
  const url = rtdbUrl(path, await idToken(auth1));
  let res, out;
  try {
    res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
    out = await res.json().catch(() => null);
  } catch { throw new GameError("Couldn't reach the match server. Check your internet connection."); }
  if (res.status === 401 || res.status === 403) throw new GameError('DENIED');
  if (!res.ok) throw new GameError("Couldn't reach the match server. Check your internet connection.");
  return out;
}
// Put `data` at a slash path inside a plain object, returning a new object
function setAt(root, path, data) {
  const keys = path.split('/').filter(Boolean);
  if (!keys.length) return data;
  const out = root && typeof root === 'object' ? { ...root } : {};
  let node = out;
  for (const k of keys.slice(0, -1)) {
    node[k] = node[k] && typeof node[k] === 'object' ? { ...node[k] } : {};
    node = node[k];
  }
  const last = keys[keys.length - 1];
  if (data === null) delete node[last]; else node[last] = data;
  return out;
}
// Live copy of a database path. Firebase streams every change over Server-Sent Events.
function rtdbStream(path, onData, onError) {
  let mirror = null, es = null, closed = false;
  idToken(auth1).then(token => {
    if (closed) return;
    es = new EventSource(rtdbUrl(path, token));
    es.addEventListener('put', e => { const m = JSON.parse(e.data); mirror = setAt(mirror, m.path, m.data); onData(mirror); });
    es.addEventListener('patch', e => {
      const m = JSON.parse(e.data);
      for (const [k, v] of Object.entries(m.data || {})) mirror = setAt(mirror, `${m.path}/${k}`, v);
      onData(mirror);
    });
    es.addEventListener('cancel', () => onError?.('denied'));
    es.addEventListener('auth_revoked', () => onError?.('auth'));
  }).catch(e => onError?.(e));
  return () => { closed = true; es?.close(); };
}

// Sharp copies of the photo for each size it's drawn at (shrinking in halves keeps it crisp)
const championSizes = new Map();
function championAt(px) {
  px = Math.max(8, Math.min(512, Math.round(px)));
  let cv = championSizes.get(px);
  if (cv) return cv;
  let src = championImg, size = 512;
  while (size / 2 >= px) {
    const half = document.createElement('canvas'); half.width = half.height = size / 2;
    const c = half.getContext('2d'); c.imageSmoothingQuality = 'high'; c.drawImage(src, 0, 0, size / 2, size / 2);
    src = half; size /= 2;
  }
  cv = document.createElement('canvas'); cv.width = cv.height = px;
  const c = cv.getContext('2d'); c.imageSmoothingQuality = 'high'; c.drawImage(src, 0, 0, px, px);
  championSizes.set(px, cv);
  return cv;
}

function weekInfo(now = new Date()) {
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  const idx = Math.round((monday - new Date(2024, 0, 1)) / (7 * 864e5));
  const n = EVENTS.length;
  return { event: EVENTS[((idx % n) + n) % n], next: EVENTS[(((idx + 1) % n) + n) % n],
           ends: new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 7).getTime() };
}

// Daily challenges: three picked from the pool by date, the same for everyone
const CHALLENGE_POOL = [
  { id: 'play5', text: 'Play 5 matches', metric: 'play', target: 5, reward: 30 },
  { id: 'win1p2', text: 'Win 2 single-player games', metric: 'win1p', target: 2, reward: 40 },
  { id: 'winHard', text: 'Beat the CPU on Hard', metric: 'winHard', target: 1, reward: 60 },
  { id: 'dmg300', text: 'Deal 300 damage', metric: 'damage', target: 300, reward: 40 },
  { id: 'power15', text: 'Use your power 15 times', metric: 'power', target: 15, reward: 30 },
  { id: 'win2p', text: 'Win a two-player match', metric: 'win2p', target: 1, reward: 50 },
  { id: 'bigwin', text: 'Win with 50 HP or more left', metric: 'bigwin', target: 1, reward: 50 },

  { id: 'spike', text: '', metric: '', target: 1, reward: 40 },
];
function seeded(str) {
  let h = 2166136261;
  for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
function dailyChallenges(day = dayKey()) {
  const rnd = seeded(day);
  // Fisher-Yates shuffle, so every phone and browser picks the same three
  const pool = CHALLENGE_POOL.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  pool.length = 3;
  return pool.map(c => {
    if (c.id !== 'spike') return c;
    const ids = Object.keys(SPIKES), sp = ids[Math.floor(rnd() * ids.length)];
    return { ...c, id: 'win_' + sp, text: `Win a game with the ${SPIKES[sp].name} spike`, metric: 'win_' + sp };
  });
}
const streakReward = count => 20 + 10 * Math.min(Math.max(count, 1) - 1, 6);
const msToMidnight = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1) - n; };

// ---------- Usernames: unique, claimed in the usernames collection ----------
const USERNAME_RE = /^[A-Za-z0-9_.]{3,16}$/;
function checkUsername(name) {
  name = name.trim();
  if (!USERNAME_RE.test(name)) throw new GameError('Usernames are 3–16 letters, numbers, dots or underscores (no spaces).');
  if (isRude(name)) throw new GameError('Please pick a different username.');
  return name;
}
async function usernameOwner(name) {
  const d = await getDoc(null, 'usernames/' + name.toLowerCase());
  return d ? d.uid : null;
}
async function claimUsername(sess, name) {
  try { await createDoc(sess, 'usernames/' + name.toLowerCase(), { uid: sess.uid }); }
  catch (e) {
    if (e.message !== 'EXISTS') throw e;
    if (await usernameOwner(name) !== sess.uid) throw new GameError('That username is taken. Try another one.');
  }
}

function newUserDoc(name) {
  return {
    name, score: START_SCORE, coins: START_COINS,
    skins: FREE_SKINS.slice(), wins1p: 0, losses1p: 0, wins2p: 0, losses2p: 0, groups: [],
    daily: { day: '', progress: {}, claimed: [] }, streak: { last: '', count: 0 },
  };
}
function normalizeUser(d) {
  d.skins = d.skins || FREE_SKINS.slice(); d.groups = d.groups || [];
  d.daily = d.daily || { day: '', progress: {}, claimed: [] };
  d.daily.progress = d.daily.progress || {}; d.daily.claimed = d.daily.claimed || [];
  d.streak = d.streak || { last: '', count: 0 };
  d.tower = { week: -1, cleared: false, prize: -1, ...(d.tower || {}) };
  for (const k of ['score', 'coins', 'wins1p', 'losses1p', 'wins2p', 'losses2p']) d[k] = d[k] || 0;
  return d;
}
// Returns the player's saved data, or null for an account that hasn't picked a username yet
async function loadUser(sess) {
  const d = await getDoc(sess, 'users/' + sess.uid);
  return d ? normalizeUser(d) : null;
}
async function createUser(sess, username) {
  const d = newUserDoc(username);
  try { await createDoc(sess, 'users/' + sess.uid, d); return normalizeUser(d); }
  catch (e) { if (e.message !== 'EXISTS') throw e; return loadUser(sess); }
}
// True when the account's name is a username it owns (older accounts may not have one yet)
async function hasUsername(sess, doc) {
  return !!doc && USERNAME_RE.test(doc.name) && await usernameOwner(doc.name) === sess.uid;
}
// Read the latest copy, change it, save it back (keeps two devices from overwriting each other)
async function mutateUser(sess, fn) {
  const d = await loadUser(sess);
  if (!d) throw new GameError('Pick a username first.');
  const towerBefore = JSON.stringify(d.tower);
  fn(d);
  const { name, score, coins, skins, wins1p, losses1p, wins2p, losses2p, groups, daily, streak, tower } = d;
  const data = { name, score, coins, skins, wins1p, losses1p, wins2p, losses2p, groups, daily, streak };
  if (JSON.stringify(tower) !== towerBefore) data.tower = tower;   // only saved when Tower progress changes
  await updateDoc(sess, 'users/' + sess.uid, data);
  if (sess === auth1) me = d;
  return d;
}
function rollDaily(d) {
  const today = dayKey();
  if (d.daily.day !== today) d.daily = { day: today, progress: {}, claimed: [] };
}
function login1(sess, doc) {
  auth1 = sess; me = doc;
  store.set('bd.auth', { uid: sess.uid, email: sess.email, refreshToken: sess.refreshToken });
}
function logout1() { auth1 = null; me = null; needsUsername = false; store.set('bd.auth', null); }

let needsUsername = false;   // signed in, but the account has no username yet
async function finishLogin(sess) {
  const doc = await loadUser(sess);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const oAX = AX, oAY = AY, oAS = AS;
  // Half the screen's area, as a square in the middle (leaving room for the HP bars)
  const room = Math.min(Math.sqrt(W * H / 2), W - 32, H - 120);
  // Everything is sized relative to the room, so every phone sees the same match
  U = room / 600;
  AS = room * mods.room;
  AX = (W - AS) / 2;
  AY = (H - AS) / 2;
  if (oAS) rescaleCubes?.(oAX, oAY, oAS);
  const r = Math.max(30, 44 * U);
  buttons = [{ x: 16 + r, y: H - 16 - r, r }, { x: W - 16 - r, y: H - 16 - r, r }];
}
window.addEventListener('resize', resize);
resize();

const unit = p => p.unit || U;

let audio = null, lastHitSound = 0;
function sfx(freq, dur = 0.07, type = 'square', vol = 0.04, slide = 0) {
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state !== 'running') audio.resume().catch(() => {});
    const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch {}
}

// Runs an async action with the button disabled, showing errors in a toast or an error line
async function busy(btn, fn, errEl) {
  if (btn.disabled) return;
  btn.disabled = true;
  if (errEl) errEl.textContent = '';
  try { await fn(); }
  catch (e) { if (errEl && document.contains(errEl)) errEl.textContent = e.message; else toast(e.message); }

const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
async function createGroup(name) {
  if (!name.trim()) throw new GameError('Give your group a name.');
  name = cleanName(name, 24);
  if (me.groups.length >= 10) throw new GameError('You can be in up to 10 groups.');
  for (let tries = 0; tries < 5; tries++) {
    const code = Array.from({ length: 6 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
    try { await createDoc(auth1, 'groups/' + code, { name, owner: auth1.uid, members: [auth1.uid] }); }
    catch (e) { if (e.message === 'EXISTS') continue; throw e; }
    await mutateUser(auth1, d => { if (!d.groups.includes(code)) d.groups.push(code); });
    groupView = code; toast('Group created'); renderApp();
    return;
  }
  throw new GameError('Could not make a group code. Try again.');
}
async function joinGroup(code) {
  code = code.trim().toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(code)) throw new GameError('Group codes are 6 letters and numbers.');
  const g = await getDoc(auth1, 'groups/' + code);
  if (!g) throw new GameError('No group has that code.');
  const members = g.members || [];
  if (!members.includes(auth1.uid)) {
    if (members.length >= 30) throw new GameError('That group is full.');
    if (me.groups.length >= 10) throw new GameError('You can be in up to 10 groups.');
    await updateDoc(auth1, 'groups/' + code, { members: [...members, auth1.uid] });
  }
  await mutateUser(auth1, d => { if (!d.groups.includes(code)) d.groups.push(code); });
  groupView = code; toast(`Joined ${g.name}`); renderApp();
}
async function removeFromGroup(code) {
  const g = await getDoc(auth1, 'groups/' + code);
  if (!g) return;
  const rest = (g.members || []).filter(id => id !== auth1.uid);
  if (!rest.length && g.owner === auth1.uid) await deleteDoc(auth1, 'groups/' + code);
  else if (rest.length !== (g.members || []).length) await updateDoc(auth1, 'groups/' + code, { members: rest });
}
async function leaveGroup(code) {
  await removeFromGroup(code);
  await mutateUser(auth1, d => { d.groups = d.groups.filter(c => c !== code); });
  groupView = null; toast('Left the group'); renderApp();
}

function wireProfile() {
  document.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => { profileMode = b.dataset.pm; renderApp(); });
  const form = $('authForm');
  if (!form) return;
  form.onsubmit = e => {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    const email = $('authEmail').value, pass = $('authPass') ? $('authPass').value : '';
    busy(btn, async () => {
      if (profileMode === 'reset') { await sendReset(email); $('authErr').innerHTML = '<span class="ok">Check your email for a link to reset your password.</span>'; return; }
      if (profileMode === 'create') {
        // Check the username before making the account, so a taken name doesn't leave a half-made account
        const name = checkUsername($('authUser').value);
        if (await usernameOwner(name)) throw new GameError('That username is taken. Try another one.');
        const sess = await signUp(email, pass);
        login1(sess, null);
        try { await claimUsername(sess, name); }
        catch (e) { needsUsername = true; showUsernamePicker(name); throw new GameError('That username was just taken. Pick another one.'); }
        me = await createUser(sess, name);
        toast(`Welcome, ${name}! You got ${START_COINS} coins.`);
      } else {
        const sess = await signIn(email, pass);
        const doc = await finishLogin(sess);
        if (needsUsername) return;
        toast(`Welcome back, ${doc.name}!`);
      }
      profileNotice = '';
      tab = 'play'; renderApp();
    }, $('authErr'));
  };
}
async function deleteAccount(password) {
  // Logging in again gives a fresh token, which Firebase requires before deleting an account
  const sess = await signIn(auth1.email, password);
  if (sess.uid !== auth1.uid) throw new GameError('Wrong email or password.');
  auth1 = sess;
  for (const code of me.groups) { try { await removeFromGroup(code); } catch {} }
  if (await usernameOwner(me.name).catch(() => null) === sess.uid) await deleteDoc(sess, 'usernames/' + me.name.toLowerCase());
  await deleteDoc(sess, `tower/${towerWeek()}/runs/${sess.uid}`).catch(() => {});
  await deleteDoc(sess, 'users/' + sess.uid);
  await authPost('accounts:delete', { idToken: sess.idToken });
  logout1(); confirmDelete = false;
  toast('Your account was deleted'); renderApp();
}
async function changeName(name) {
  name = checkUsername(name);
  const old = me.name;
  if (name === old) return;
  const sameName = name.toLowerCase() === old.toLowerCase();   // only the capital letters changed
  if (!sameName) await claimUsername(auth1, name);
  await mutateUser(auth1, d => { d.name = name; });
  if (!sameName && await usernameOwner(old).catch(() => null) === auth1.uid) await deleteDoc(auth1, 'usernames/' + old.toLowerCase()).catch(() => {});
  toast(`Your username is now ${name}`); renderApp();
}

// ---------- Coins: daily reward, challenges, shop ----------
async function claimDailyReward() {
  let got = 0;
  await mutateUser(auth1, d => {
    const today = dayKey(), yesterday = dayKey(new Date(Date.now() - 864e5));
    if (d.streak.last === today) throw new GameError('You already claimed today. Come back tomorrow!');
    const count = d.streak.last === yesterday ? d.streak.count + 1 : 1;
    got = streakReward(count);
    d.streak = { last: today, count };
    d.coins += got;
  });
  sfx(880, 0.15, 'square', 0.04, 1.5); buzz('success');
  toast(`+${got} coins!`); renderApp();
}
async function claimChallenge(id) {
  const c = dailyChallenges().find(x => x.id === id);
  if (!c) return;
  await mutateUser(auth1, d => {
    rollDaily(d);
    if (d.daily.claimed.includes(id)) throw new GameError('Already claimed.');
    if ((d.daily.progress[c.metric] || 0) < c.target) throw new GameError('Not finished yet.');
    d.daily.claimed.push(id);
    d.coins += c.reward;
  });
  sfx(880, 0.15, 'square', 0.04, 1.5); buzz('success');
  toast(`+${c.reward} coins!`); renderApp();
}
async function buySkin(id) {
  const s = SKINS.find(x => x.id === id), price = salePrice(s);
  await mutateUser(auth1, d => {
    if (d.skins.includes(id)) throw new GameError('You already own this skin.');
    if (d.coins < price) throw new GameError('Not enough coins yet.');
    d.coins -= price; d.skins.push(id);
  });
  loadouts[0].skin = id; store.set('bd.loadouts', loadouts);
  sfx(660, 0.2, 'square', 0.04, 2); buzz('success');
  toast(`${s.name} skin unlocked and equipped!`); renderApp();
}
