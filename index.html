<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bounce Duel</title>
<style>
  :root {
    --bg: #000; --panel: #0d0d10; --line: #2a2a31; --text: #fff; --muted: #a3a3ad;
    --p1: #ff4d5e; --p2: #4da6ff; --good: #4ade80; --bad: #ff4d5e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas#c { display: block; touch-action: none; position: fixed; inset: 0; }
  .hidden { display: none !important; }

  .overlay {
    position: fixed; inset: 0; display: flex; overflow-y: auto; background: rgba(0,0,0,.88);
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .inner { margin: auto; width: 100%; max-width: 760px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  h1 { margin: 0; font-size: clamp(36px, 9vw, 72px); letter-spacing: 3px; line-height: 1; text-wrap: balance; }
  h2 { margin: 0; font-size: 20px; }
  p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 560px; }
  .tagline { font-size: 15px; }
  .menu { display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%); }

  button {
    font: inherit; background: #fff; color: #000; border: 0; border-radius: 8px; padding: 13px 24px;
    font-size: 18px; font-weight: 700; cursor: pointer;
  }
  button:hover { background: #ddd; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--p2); outline-offset: 2px; }
  button.ghost { background: transparent; color: #fff; border: 2px solid var(--line); }
  button.ghost:hover { border-color: #fff; }
  button.small { padding: 8px 14px; font-size: 14px; }
  button.link { background: none; color: var(--p2); padding: 0; font-size: inherit; font-weight: 600; text-decoration: underline; border-radius: 0; }

  .acct-line { font-size: 14px; color: var(--muted); }
  .acct-line b { color: #fff; }

  input {
    font: inherit; background: #111; color: #fff; border: 2px solid #3a3a42; border-radius: 8px;
    padding: 10px 12px; font-size: 17px; width: 100%; outline: none; -webkit-user-select: text; user-select: text;
  }
  input:focus { border-color: #fff; }

  /* Setup screen */
  #panels { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .panel {
    flex: 1 1 320px; max-width: 370px; min-width: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; text-align: left;
  }
  .panel-head { display: flex; align-items: center; gap: 12px; }
  .preview { width: 120px; height: 120px; flex: none; background: #000; border-radius: 8px; border: 1px solid var(--line); }
  .panel-head .who { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
  .acct { font-size: 13px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
  .acct b { color: #fff; }
  .acct details summary { cursor: pointer; color: var(--p2); font-weight: 600; }
  .acct .mini-form { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .acct .mini-form input { font-size: 16px; padding: 8px 10px; }
  .acct .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .pick > span { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: #17171c; color: #fff; border: 2px solid #2c2c34; border-radius: 999px; padding: 6px 12px;
    font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { background: #22222a; }
  .chip.on { border-color: #fff; background: #fff; color: #000; }
  .chip.locked { opacity: .45; cursor: not-allowed; }
  .chip canvas { width: 16px; height: 16px; border-radius: 3px; }
  .desc { font-size: 13px; margin-top: 6px; min-height: 1.5em; }
  .err { color: var(--bad); font-size: 14px; min-height: 1.4em; }
  .ok { color: var(--good); }

  /* Account screen */
  .card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { flex: 1; }
  form { display: flex; flex-direction: column; gap: 10px; }
  form label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 15px; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .big-score { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .fine { font-size: 12px; color: var(--muted); }

  #results { display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
  #results .up { color: var(--good); }
  #results .down { color: var(--bad); }

  #hint {
    position: fixed; top: calc(48px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 18px;
    pointer-events: none; text-shadow: 0 0 6px #000, 0 0 6px #000; padding: 0 16px;
  }
  #quitBtn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: 34px; height: 34px; padding: 0; border-radius: 50%; font-size: 16px; background: #1a1a1f; color: #fff; border: 1px solid #333;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint" class="hidden"></div>
<button id="quitBtn" class="hidden" aria-label="Back to menu">✕</button>

<!-- Home -->
<div id="home" class="overlay">
  <div class="inner">
    <h1>BOUNCE DUEL</h1>
    <p class="tagline">Two cubes bounce around a square room. Spikes orbit each cube and every hit does 1 damage. Use your power at the right moment. First to 0 HP loses.</p>
    <div class="acct-line" id="homeAcct"></div>
    <div class="menu">
      <button data-go="setup1p">Single player</button>
      <button data-go="setup2p">Two players</button>
      <button class="ghost" data-go="account">Account</button>
      <button class="ghost" id="soundBtn"></button>
    </div>
  </div>
</div>

<!-- Setup -->
<div id="setup" class="overlay hidden">
  <div class="inner">
    <h2 id="setupTitle"></h2>
    <div id="panels"></div>
    <div class="menu">
      <button id="startBtn">Start</button>
      <button class="ghost" data-go="home">Back</button>
    </div>
  </div>
</div>

<!-- Account -->
<div id="account" class="overlay hidden">
  <div class="inner">
    <h2>Account</h2>
    <div class="card" id="accountCard"></div>
    <button class="ghost" data-go="home">Back</button>
  </div>
</div>

<!-- Game over -->
<div id="over" class="overlay hidden">
  <div class="inner">
    <h1 id="winText"></h1>
    <div id="results"></div>
    <div class="menu">
      <button id="againBtn">Rematch</button>
      <button class="ghost" data-go="home">Menu</button>
    </div>
  </div>
</div>

<script>
// ---------- Storage (falls back to memory if localStorage is blocked) ----------
const store = (() => {
  const mem = {};
  return {
    get(k, d) {
      try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }
      catch { return k in mem ? mem[k] : d; }
    },
    set(k, v) {
      mem[k] = v;
      try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
    },
  };
})();

// ---------- SHA-256 (for hashing passwords before they're saved) ----------
const sha256 = (() => {
  const isPrime = n => { for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
  const primes = []; for (let n = 2; primes.length < 64; n++) if (isPrime(n)) primes.push(n);
  const K = primes.map(p => (Math.cbrt(p) % 1) * 2 ** 32 | 0);
  const H0 = primes.slice(0, 8).map(p => (Math.sqrt(p) % 1) * 2 ** 32 | 0);
  const ror = (x, n) => (x >>> n) | (x << (32 - n));
  return str => {
    const bytes = new TextEncoder().encode(str);
    const buf = new Uint8Array(((bytes.length + 9 + 63) >> 6) << 6);
    buf.set(bytes); buf[bytes.length] = 0x80;
    const dv = new DataView(buf.buffer);
    const bits = bytes.length * 8;
    dv.setUint32(buf.length - 8, Math.floor(bits / 2 ** 32));
    dv.setUint32(buf.length - 4, bits >>> 0);
    const H = H0.slice(), w = new Uint32Array(64);
    for (let i = 0; i < buf.length; i += 64) {
      for (let t = 0; t < 16; t++) w[t] = dv.getUint32(i + t * 4);
      for (let t = 16; t < 64; t++) {
        const x = w[t - 15], y = w[t - 2];
        w[t] = (w[t - 16] + (ror(x, 7) ^ ror(x, 18) ^ (x >>> 3)) + w[t - 7] + (ror(y, 17) ^ ror(y, 19) ^ (y >>> 10))) | 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let t = 0; t < 64; t++) {
        const t1 = (h + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + w[t]) | 0;
        const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      [a, b, c, d, e, f, g, h].forEach((v, j) => { H[j] = (H[j] + v) | 0; });
    }
    return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
  };
})();

// ---------- Accounts (saved on this device) ----------
const START_SCORE = 100;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function hashPassword(password, salt) {
  let h = salt + ':' + password;
  for (let i = 0; i < 500; i++) h = sha256(h + salt);
  return h;
}
function accounts() { return store.get('bd.accounts', {}); }
function saveAccount(email, data) { const all = accounts(); all[email] = data; store.set('bd.accounts', all); }
function getAccount(email) { return email ? accounts()[email] || null : null; }

function validate(email, password) {
  if (!EMAIL_RE.test(email)) return 'Enter a valid email address.';
  if (password.length < 6) return 'Password must be at least 6 characters.';
  return null;
}
function createAccount(email, password) {
  email = email.trim().toLowerCase();
  const err = validate(email, password);
  if (err) return { err };
  if (getAccount(email)) return { err: 'An account with this email already exists. Log in instead.' };
  const salt = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  saveAccount(email, { salt, hash: hashPassword(password, salt), score: START_SCORE, wins1p: 0, losses1p: 0, wins2p: 0, losses2p: 0 });
  return { email };
}
function checkLogin(email, password) {
  email = email.trim().toLowerCase();
  const acct = getAccount(email);
  if (!acct || hashPassword(password, acct.salt) !== acct.hash) return { err: 'Wrong email or password.' };
  return { email };
}

let session = store.get('bd.session', null);   // Player 1's account
if (session && !getAccount(session)) session = null;
let p2Account = null;                           // Player 2 signs in per visit
let guestWins = 0;                              // single-player wins for guests (not saved)

function winsFor(email) { const a = getAccount(email); return a ? a.wins1p : guestWins; }

// ---------- Game data ----------
const COLORS = ['#ff4d5e', '#4da6ff'];
const MAX_HP = 100;
const HIT_COOLDOWN = 0.02;

const SKINS = [
  { id: 'classic', name: 'Classic', wins: 0 },
  { id: 'checker', name: 'Checker', wins: 0 },
  { id: 'neon', name: 'Neon', wins: 1 },
  { id: 'ice', name: 'Ice', wins: 2 },
  { id: 'lava', name: 'Lava', wins: 3 },
  { id: 'gold', name: 'Gold', wins: 5 },
  { id: 'galaxy', name: 'Galaxy', wins: 8 },
  { id: 'rainbow', name: 'Rainbow', wins: 12 },
];
const SPIKES = {
  classic: { name: 'Classic', desc: 'One sharp spike. Balanced.', count: 1, kind: 'tri', len: 36, w: 18, spin: 4.5, orbit: 1 },
  twin:    { name: 'Twin', desc: 'Two smaller spikes on opposite sides, spinning slower.', count: 2, kind: 'tri', len: 22, w: 12, spin: 2.6, orbit: 1, hitCd: 0.03 },
  saw:     { name: 'Saw', desc: 'A spinning saw blade. Big hitbox, slower orbit.', count: 1, kind: 'saw', r: 15, spin: 3.0, orbit: 0.95 },
  lance:   { name: 'Lance', desc: 'A long, thin blade that spins fast.', count: 1, kind: 'tri', len: 62, w: 11, spin: 4.8, orbit: 0.88 },
  comet:   { name: 'Comet', desc: 'A fireball whose orbit swings in and out.', count: 1, kind: 'ball', r: 16, spin: 5.4, orbit: 1, pulse: true },
};
const POWERS = {
  dash:   { name: 'Dash', desc: 'Move twice as fast for 2.5 seconds.', cd: 5, color: '#ffd23f' },
  shield: { name: 'Shield', desc: 'Take no damage for 1.5 seconds.', cd: 10, color: '#29f0ff' },
  freeze: { name: 'Freeze', desc: 'Freeze the other cube and its spike for 2.5 seconds.', cd: 10, color: '#9fe3ff' },
  rage:   { name: 'Rage', desc: 'Your spike grows and spins faster for 3 seconds.', cd: 9, color: '#ff6a00' },
  heal:   { name: 'Heal', desc: 'Get back 4 HP.', cd: 18, color: '#4ade80' },
  blink:  { name: 'Blink', desc: 'Teleport right next to the other cube.', cd: 6, color: '#c084fc' },
};
const DIFFICULTIES = {
  easy:   { name: 'Easy', desc: 'Uses its power at random.', think: 0.6, smart: 0.35 },
  normal: { name: 'Normal', desc: 'Uses its power when it makes sense.', think: 0.3, smart: 0.8 },
  hard:   { name: 'Hard', desc: 'Reacts instantly and never wastes its power.', think: 0, smart: 1 },
};

// ---------- Canvas & layout ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const $ = id => document.getElementById(id);

let W = 0, H = 0, DPR = 1;
let U = 1;                       // size scale for the current screen
let AX = 0, AY = 0, AS = 0;      // the square room: left, top, side
let buttons = [];                // power buttons: {x, y, r}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  U = Math.max(0.55, Math.min(1, Math.min(W, H) / 720));
  // Half the screen's area, as a square in the middle (leaving room for the HP bars)
  AS = Math.min(Math.sqrt(W * H / 2), W - 32, H - 120);
  AX = (W - AS) / 2;
  AY = (H - AS) / 2;
  const r = Math.max(30, 44 * U);
  buttons = [{ x: 16 + r, y: H - 16 - r, r }, { x: W - 16 - r, y: H - 16 - r, r }];
}
window.addEventListener('resize', resize);
resize();

const unit = p => p.unit || U;
const sizeOf = p => 64 * unit(p);
const orbitOf = p => 130 * unit(p);
const baseSpeed = () => 320 * U;

// ---------- State ----------
let mode = '1p';            // 1p | 2p
let difficulty = store.get('bd.difficulty', 'normal');
let loadouts = store.get('bd.loadouts', [
  { skin: 'classic', spike: 'classic', power: 'dash' },
  { skin: 'classic', spike: 'classic', power: 'shield' },
]);
let names = store.get('bd.names', ['', '']);
let players = [];
let state = 'menu';         // menu | place | aim | countdown | play | over
let placing = 0;
let mouse = { x: W / 2, y: H / 2 };
let aimPress = false;       // pointer went down while aiming (so the placing tap doesn't also launch)
let elapsed = 0, countdown = 0, clock = 0, shake = 0;
let particles = [], popups = [];
let muted = store.get('bd.muted', false);

// ---------- Sound ----------
let audio = null, lastHitSound = 0;
function sfx(freq, dur = 0.07, type = 'square', vol = 0.04, slide = 0) {
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch {}
}

// ---------- Screens ----------
const screens = ['home', 'setup', 'account', 'over'];
function show(name) {
  screens.forEach(s => $(s).classList.toggle('hidden', s !== name));
  if (name === 'home') renderHome();
  if (name === 'account') renderAccount();
  if (name !== 'over') { state = 'menu'; players = []; }
  $('quitBtn').classList.add('hidden');
  updateHint();
}
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (!go) return;
  const to = go.dataset.go;
  if (to === 'setup1p' || to === 'setup2p') { mode = to === 'setup1p' ? '1p' : '2p'; show('setup'); renderSetup(); }
  else show(to);
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderHome() {
  const a = getAccount(session);
  $('homeAcct').innerHTML = a
    ? `Signed in as <b>${escapeHtml(session)}</b> · Score <b>${a.score}</b>`
    : `Playing as a guest · <button class="link" data-go="account">Create an account</button> to save your score`;
  $('soundBtn').textContent = muted ? 'Sound: off' : 'Sound: on';
}
$('soundBtn').onclick = () => { muted = !muted; store.set('bd.muted', muted); renderHome(); sfx(660); };

// ---------- Account screen ----------
let accountTab = 'create';
function renderAccount(msg = '') {
  const card = $('accountCard');
  const a = getAccount(session);
  if (a) {
    card.innerHTML = `
      <div class="fine">Signed in as</div>
      <div style="font-weight:700; overflow-wrap:anywhere">${escapeHtml(session)}</div>
      <div><div class="fine">Two-player score</div><div class="big-score">${a.score}</div></div>
      <dl class="stats">
        <dt>Two-player wins</dt><dd>${a.wins2p}</dd>
        <dt>Two-player losses</dt><dd>${a.losses2p}</dd>
        <dt>Single-player wins</dt><dd>${a.wins1p}</dd>
        <dt>Single-player losses</dt><dd>${a.losses1p}</dd>
        <dt>Skins unlocked</dt><dd>${SKINS.filter(s => s.wins <= a.wins1p).length} / ${SKINS.length}</dd>
      </dl>
      ${msg ? `<p class="ok">${escapeHtml(msg)}</p>` : ''}
      <button class="ghost" id="logoutBtn">Log out</button>
      <p class="fine">Your account is saved on this device.</p>`;
    $('logoutBtn').onclick = () => { session = null; store.set('bd.session', null); renderAccount(); };
    return;
  }
  const creating = accountTab === 'create';
  card.innerHTML = `
    <div class="tabs">
      <button class="${creating ? '' : 'ghost'} small" data-tab="create">Create account</button>
      <button class="${creating ? 'ghost' : ''} small" data-tab="login">Log in</button>
    </div>
    <form id="acctForm" novalidate>
      <label>Email <input id="acctEmail" type="email" autocomplete="email" autocapitalize="off" required></label>
      <label>Password <input id="acctPass" type="password" autocomplete="${creating ? 'new-password' : 'current-password'}" required></label>
      <p class="err" id="acctErr"></p>
      <button type="submit">${creating ? 'Create account' : 'Log in'}</button>
    </form>
    <p class="fine">${creating ? 'New accounts start with a two-player score of 100.' : ''} Accounts are saved on this device.</p>`;
  card.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { accountTab = b.dataset.tab; renderAccount(); });
  $('acctForm').onsubmit = e => {
    e.preventDefault();
    const email = $('acctEmail').value, pass = $('acctPass').value;
    const res = creating ? createAccount(email, pass) : checkLogin(email, pass);
    if (res.err) { $('acctErr').textContent = res.err; return; }
    if (res.email === p2Account) p2Account = null;
    session = res.email; store.set('bd.session', session);
    renderAccount(creating ? 'Account created. Your score starts at 100.' : 'Logged in.');
  };
}

// ---------- Setup screen ----------
function defaultName(i, email) {
  if (mode === '1p' && i === 1) return 'CPU';
  return email ? email.split('@')[0].slice(0, 16) : `Player ${i + 1}`;
}
function accountFor(i) { return i === 0 ? session : p2Account; }

function renderSetup() {
  $('setupTitle').textContent = mode === '1p' ? 'Single player' : 'Two players';
  const wrap = $('panels');
  wrap.innerHTML = '';
  const humans = mode === '1p' ? 1 : 2;
  for (let i = 0; i < humans; i++) wrap.appendChild(playerPanel(i));
  if (mode === '1p') wrap.appendChild(cpuPanel());
}

function acctHtml(i) {
  const email = accountFor(i), a = getAccount(email);
  if (a) {
    return `Signed in as <b>${escapeHtml(email)}</b><br>Score <b>${a.score}</b>` +
      (i === 1 ? ` · <button class="link" data-act="p2out">Sign out</button>` : '');
  }
  if (i === 0) {
    return `Guest · <button class="link" data-go="account">Create an account</button>` +
      (mode === '2p' ? ' to get a score' : ' to save your wins');
  }
  return `<details><summary>Sign in to get a score</summary>
    <div class="mini-form">
      <input type="email" id="p2email" placeholder="Email" autocomplete="off" autocapitalize="off">
      <input type="password" id="p2pass" placeholder="Password" autocomplete="off">
      <div class="row"><button class="small" data-act="p2in">Log in</button><button class="small ghost" data-act="p2new">Create account</button></div>
      <div class="err" id="p2err"></div>
    </div></details>`;
}

function playerPanel(i) {
  const el = document.createElement('section');
  el.className = 'panel';
  el.dataset.i = i;
  el.innerHTML = `
    <div class="panel-head">
      <canvas class="preview" data-i="${i}"></canvas>
      <div class="who">
        <h2 style="color:${COLORS[i]}">Player ${i + 1}</h2>
        <div class="acct">${acctHtml(i)}</div>
      </div>
    </div>
    <label class="pick"><span>Name</span><input id="name${i}" maxlength="16"></label>
    <div class="pick"><span>Skin</span><div class="chips" data-kind="skin"></div><p class="desc" data-desc="skin"></p></div>
    <div class="pick"><span>Spike</span><div class="chips" data-kind="spike"></div><p class="desc" data-desc="spike"></p></div>
    <div class="pick"><span>Power</span><div class="chips" data-kind="power"></div><p class="desc" data-desc="power"></p></div>`;
  const nameInput = el.querySelector('input[id^=name]');
  nameInput.value = names[i] || defaultName(i, accountFor(i));
  nameInput.oninput = () => { names[i] = nameInput.value; store.set('bd.names', names); };
  fillChips(el, i);
  el.addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) return panelAction(act.dataset.act, el);
    const chip = e.target.closest('.chip');
    if (!chip || chip.classList.contains('locked')) return;
    loadouts[i][chip.dataset.kind] = chip.dataset.id;
    store.set('bd.loadouts', loadouts);
    fillChips(el, i);
  });
  return el;
}

function panelAction(act, el) {
  if (act === 'p2out') { p2Account = null; names[1] = ''; return renderSetup(); }
  const email = $('p2email').value, pass = $('p2pass').value;
  if (email.trim().toLowerCase() === session) { $('p2err').textContent = 'Player 1 is already signed in with this account.'; return; }
  const res = act === 'p2new' ? createAccount(email, pass) : checkLogin(email, pass);
  if (res.err) { $('p2err').textContent = res.err; return; }
  p2Account = res.email; names[1] = '';
  renderSetup();
}

function fillChips(el, i) {
  const lo = loadouts[i];
  const wins = winsFor(accountFor(i));
  if (!SKINS.some(s => s.id === lo.skin && s.wins <= wins)) lo.skin = 'classic';
  const skinBox = el.querySelector('[data-kind=skin]');
  skinBox.innerHTML = SKINS.map(s => {
    const locked = s.wins > wins;
    return `<button class="chip ${lo.skin === s.id ? 'on' : ''} ${locked ? 'locked' : ''}" data-kind="skin" data-id="${s.id}"
      title="${locked ? `Win ${s.wins} single-player games to unlock` : s.name}"><canvas width="32" height="32" data-skin="${s.id}"></canvas>${s.name}${locked ? ' 🔒' : ''}</button>`;
  }).join('');
  skinBox.querySelectorAll('canvas').forEach(cv => {
    const c = cv.getContext('2d');
    drawSkin(c, 16, 16, 32, cv.dataset.skin, 0);
  });
  const next = SKINS.find(s => s.wins > wins);
  el.querySelector('[data-desc=skin]').textContent = next
    ? `${wins} single-player win${wins === 1 ? '' : 's'}. Next skin (${next.name}) at ${next.wins}.`
    : 'All skins unlocked!';
  el.querySelector('[data-kind=spike]').innerHTML = Object.entries(SPIKES).map(([id, s]) =>
    `<button class="chip ${lo.spike === id ? 'on' : ''}" data-kind="spike" data-id="${id}">${s.name}</button>`).join('');
  el.querySelector('[data-desc=spike]').textContent = SPIKES[lo.spike].desc;
  el.querySelector('[data-kind=power]').innerHTML = Object.entries(POWERS).map(([id, p]) =>
    `<button class="chip ${lo.power === id ? 'on' : ''}" data-kind="power" data-id="${id}">${p.name}</button>`).join('');
  el.querySelector('[data-desc=power]').textContent = `${POWERS[lo.power].desc} Recharges in ${POWERS[lo.power].cd}s.`;
}

function cpuPanel() {
  const el = document.createElement('section');
  el.className = 'panel';
  const draw = () => {
    el.innerHTML = `
      <div class="panel-head">
        <canvas class="preview" data-i="cpu"></canvas>
        <div class="who"><h2 style="color:${COLORS[1]}">CPU</h2>
        <div class="acct">Picks a random skin, spike and power every match.</div></div>
      </div>
      <div class="pick"><span>Difficulty</span><div class="chips">${Object.entries(DIFFICULTIES).map(([id, d]) =>
        `<button class="chip ${difficulty === id ? 'on' : ''}" data-id="${id}">${d.name}</button>`).join('')}</div>
      <p class="desc">${DIFFICULTIES[difficulty].desc}</p></div>`;
  };
  draw();
  el.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    difficulty = chip.dataset.id; store.set('bd.difficulty', difficulty); draw();
  });
  return el;
}

// ---------- Match ----------
function makePlayer(i, name, lo, isCpu) {
  return {
    i, name, color: COLORS[i], isCpu, account: isCpu ? null : accountFor(i),
    skin: lo.skin, spike: lo.spike, power: lo.power,
    hp: MAX_HP, x: 0, y: 0, vx: 0, vy: 0,
    angle: i * Math.PI, spin: i === 0 ? 1 : -1,
    hitCd: 0, flash: 0, placed: false,
    powerCd: 2, dash: 0, shield: 0, frozen: 0, rage: 0, aiTimer: 0,
  };
}

function randomLoadout() {
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  return { skin: pick(SKINS).id, spike: pick(Object.keys(SPIKES)), power: pick(Object.keys(POWERS)) };
}

function startMatch() {
  const n = i => ($('name' + i) ? $('name' + i).value.trim() : '') || defaultName(i, accountFor(i));
  if (mode === '1p') {
    players = [makePlayer(0, n(0), loadouts[0], false),
               makePlayer(1, `CPU (${DIFFICULTIES[difficulty].name})`, randomLoadout(), true)];
  } else {
    players = [makePlayer(0, n(0), loadouts[0], false), makePlayer(1, n(1), loadouts[1], false)];
  }
  particles = []; popups = [];
  elapsed = 0; placing = 0; aimPress = false;
  state = 'place';
  screens.forEach(s => $(s).classList.add('hidden'));
  $('quitBtn').classList.remove('hidden');
  updateHint();
}
$('startBtn').onclick = () => { sfx(520, 0.1, 'square', 0.04, 1.5); startMatch(); };
$('againBtn').onclick = startMatch;
$('quitBtn').onclick = () => show('home');

function updateHint() {
  if ((state === 'place' || state === 'aim') && players[placing]) {
    const p = players[placing];
    hint.innerHTML = `<b style="color:${p.color}">${escapeHtml(p.name)}</b>: ` +
      (state === 'place' ? 'tap inside the room to place your cube' : 'drag or tap to choose the bounce direction');
    hint.classList.remove('hidden');
  } else {
    hint.classList.add('hidden');
  }
}

function clampPos(x, y, s = 64 * U) {
  const h = s / 2;
  return { x: Math.min(AX + AS - h, Math.max(AX + h, x)), y: Math.min(AY + AS - h, Math.max(AY + h, y)) };
}
function overlaps(a, x, y) { const s = sizeOf(a); return a.placed && Math.abs(a.x - x) < s && Math.abs(a.y - y) < s; }

function launch(p, dx, dy) {
  const l = Math.hypot(dx, dy) || 1;
  p.vx = dx / l * baseSpeed(); p.vy = dy / l * baseSpeed();
}

function placeCpu(p) {
  const other = players[1 - p.i];
  for (let tries = 0; tries < 50; tries++) {
    const pos = clampPos(AX + Math.random() * AS, AY + Math.random() * AS);
    const far = Math.hypot(pos.x - other.x, pos.y - other.y) >= orbitOf(p) * 1.4;
    // Prefer a spot away from the player; otherwise take any spot that doesn't overlap
    if (far || (tries === 49 && !overlaps(other, pos.x, pos.y))) { p.x = pos.x; p.y = pos.y; break; }
    if (tries === 49) { p.x = AX + AS - sizeOf(p); p.y = AY + AS - sizeOf(p); }
  }
  p.placed = true;
  const a = (Math.floor(Math.random() * 4) + 0.25 + Math.random() * 0.5) * Math.PI / 2;
  launch(p, Math.cos(a), Math.sin(a));
}

function finishPlacing() {
  if (placing === 0) {
    if (players[1].isCpu) { placeCpu(players[1]); startCountdown(); }
    else { placing = 1; state = 'place'; }
  } else startCountdown();
}
function startCountdown() { state = 'countdown'; countdown = 2.4; sfx(440, 0.12); }

canvas.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('pointerdown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (state === 'play') {
    buttons.forEach((b, i) => {
      if (players[i] && !players[i].isCpu && Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r + 10) usePower(players[i]);
    });
    return;
  }
  const p = players[placing];
  if (state === 'place') {
    const pos = clampPos(e.clientX, e.clientY);
    if (overlaps(players[1 - placing], pos.x, pos.y)) return;
    p.x = pos.x; p.y = pos.y; p.placed = true;
    state = 'aim';
    sfx(330, 0.05);
    updateHint();
  } else if (state === 'aim') {
    aimPress = true;
  }
});
canvas.addEventListener('pointerup', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  const p = players[placing];
  if (state === 'aim' && aimPress) {
    aimPress = false;
    let dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.hypot(dx, dy) < 5) { dx = 1; dy = 1; }
    launch(p, dx, dy);
    sfx(500, 0.06);
    finishPlacing();
  }
  updateHint();
});

document.addEventListener('keydown', e => {
  if (state !== 'play' || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'a' || (mode === '1p' && k === ' ')) { usePower(players[0]); e.preventDefault(); }
  if (k === 'l' && mode === '2p') usePower(players[1]);
});

// ---------- Spikes ----------
// Returns each spike's current position and shape
function getSpikes(p) {
  const def = SPIKES[p.spike], u = unit(p);
  const grow = p.rage > 0 ? 1.7 : 1;
  const out = [];
  for (let i = 0; i < def.count; i++) {
    const a = p.angle + i * Math.PI * 2 / def.count;
    out.push({ ...spikeAt(p, a), a, kind: def.kind, len: (def.len || 0) * u * grow, w: (def.w || 0) * u * grow, r: (def.r || 0) * u * grow });
  }
  return out;
}
function spikeAt(p, a) {
  const def = SPIKES[p.spike];
  let R = orbitOf(p) * def.orbit;
  if (def.pulse) R *= 1 + 0.3 * Math.sin(a * 1.5);
  return { x: p.x + Math.cos(a) * R, y: p.y + Math.sin(a) * R, R };
}
function triPoints(s) {
  const c = Math.cos(s.a), n = Math.sin(s.a);
  const bx = s.x - c * s.len / 2, by = s.y - n * s.len / 2;
  return [
    { x: s.x + c * s.len / 2, y: s.y + n * s.len / 2 },
    { x: bx - n * s.w / 2, y: by + c * s.w / 2 },
    { x: bx + n * s.w / 2, y: by - c * s.w / 2 },
  ];
}
function spikeHitsBox(s, b) {
  const h = sizeOf(b) / 2;
  if (s.kind === 'tri') {
    const pts = triPoints(s);
    // Sample along the spike's center line too, so long blades hit properly
    for (let t = -0.5; t <= 0.5; t += 0.25) pts.push({ x: s.x + Math.cos(s.a) * s.len * t, y: s.y + Math.sin(s.a) * s.len * t });
    return pts.some(pt => Math.abs(pt.x - b.x) < h && Math.abs(pt.y - b.y) < h);
  }
  const dx = Math.max(Math.abs(s.x - b.x) - h, 0), dy = Math.max(Math.abs(s.y - b.y) - h, 0);
  return dx * dx + dy * dy < s.r * s.r;
}

// ---------- Powers ----------
function usePower(p) {
  if (!p || state !== 'play' || p.powerCd > 0 || p.frozen > 0) return;
  const opp = players[1 - p.i], def = POWERS[p.power];
  p.powerCd = def.cd;
  if (p.power === 'dash') p.dash = 2.5;
  if (p.power === 'shield') p.shield = 1.5;
  if (p.power === 'freeze') { opp.frozen = 2.5; burst(opp.x, opp.y, def.color, 18); }
  if (p.power === 'rage') p.rage = 3;
  if (p.power === 'heal') { p.hp = Math.min(MAX_HP, p.hp + 4); burst(p.x, p.y, def.color, 14); }
  if (p.power === 'blink') {
    burst(p.x, p.y, def.color, 14);
    for (let t = 0; t < 12; t++) {
      const a = Math.random() * Math.PI * 2;
      const pos = clampPos(opp.x + Math.cos(a) * orbitOf(p) * 0.9, opp.y + Math.sin(a) * orbitOf(p) * 0.9);
      if (!overlaps(opp, pos.x, pos.y)) { p.x = pos.x; p.y = pos.y; break; }
    }
    burst(p.x, p.y, def.color, 14);
  }
  popups.push({ x: p.x, y: p.y - sizeOf(p), text: def.name.toUpperCase() + '!', color: def.color, life: 0.9 });
  sfx(300, 0.25, 'sawtooth', 0.04, 3);
}

function cpuThink(p, dt) {
  const d = DIFFICULTIES[difficulty];
  p.aiTimer -= dt;
  if (p.powerCd > 0 || p.frozen > 0 || p.aiTimer > 0) return;
  p.aiTimer = d.think;
  const opp = players[1 - p.i];
  if (Math.random() > d.smart) { if (Math.random() < 0.15) usePower(p); return; }
  const dist = Math.hypot(opp.x - p.x, opp.y - p.y), R = orbitOf(p);
  const near = (spikes, target, k) => spikes.some(s => Math.hypot(s.x - target.x, s.y - target.y) < sizeOf(target) * k);
  const want = {
    dash: dist < R * 2.5 && ((opp.x - p.x) * p.vx + (opp.y - p.y) * p.vy) > 0,
    shield: near(getSpikes(opp), p, 1.6),
    freeze: near(getSpikes(p), opp, 1.4),
    rage: dist < R * 1.6,
    heal: p.hp <= MAX_HP - 10,
    blink: dist > R * 1.5,
  };
  if (want[p.power]) usePower(p);
}

// ---------- Update ----------
function burst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (60 + Math.random() * 180) * U;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.3, color });
  }
}

function update(dt) {
  clock += dt;
  for (const pt of particles) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; }
  particles = particles.filter(pt => pt.life > 0);
  for (const pp of popups) { pp.y -= 30 * dt; pp.life -= dt; }
  popups = popups.filter(pp => pp.life > 0);
  shake = Math.max(0, shake - dt * 30);

  if (state === 'countdown') {
    const before = Math.ceil(countdown);
    countdown -= dt;
    if (Math.ceil(countdown) !== before && countdown > 0) sfx(440, 0.12);
    if (countdown <= 0) { state = 'play'; sfx(880, 0.2); }
    return;
  }
  if (state !== 'play') return;
  elapsed += dt;
  // Gets faster over time so matches don't drag on
  const speedMul = Math.min(4, 1 + elapsed / 25);

  for (const p of players) {
    const h = sizeOf(p) / 2;
    for (const k of ['powerCd', 'dash', 'shield', 'frozen', 'rage', 'hitCd', 'flash']) p[k] = Math.max(0, p[k] - dt);
    if (p.isCpu) cpuThink(p, dt);
    if (p.frozen > 0) continue;
    const m = speedMul * (p.dash > 0 ? 2 : 1);
    p.x += p.vx * m * dt;
    p.y += p.vy * m * dt;
    if (p.x < AX + h) { p.x = AX + h; p.vx = Math.abs(p.vx); }
    if (p.x > AX + AS - h) { p.x = AX + AS - h; p.vx = -Math.abs(p.vx); }
    if (p.y < AY + h) { p.y = AY + h; p.vy = Math.abs(p.vy); }
    if (p.y > AY + AS - h) { p.y = AY + AS - h; p.vy = -Math.abs(p.vy); }
    p.angle += SPIKES[p.spike].spin * p.spin * speedMul * (p.rage > 0 ? 1.6 : 1) * dt;
  }

  // Cube vs cube bounce. A frozen cube acts like a wall.
  const [a, b] = players;
  const S = sizeOf(a);
  const ox = S - Math.abs(a.x - b.x), oy = S - Math.abs(a.y - b.y);
  if (ox > 0 && oy > 0) {
    const aF = a.frozen > 0, bF = b.frozen > 0;
    const shareA = aF && !bF ? 0 : bF && !aF ? 1 : 0.5;
    const axis = ox < oy ? 'x' : 'y', v = 'v' + axis, over = ox < oy ? ox : oy;
    const dir = a[axis] < b[axis] ? -1 : 1;
    a[axis] += dir * over * shareA; b[axis] -= dir * over * (1 - shareA);
    if ((b[axis] - a[axis]) * (b[v] - a[v]) < 0) {
      if (aF && !bF) b[v] = -b[v];
      else if (bF && !aF) a[v] = -a[v];
      else [a[v], b[v]] = [b[v], a[v]];
      sfx(180, 0.05, 'triangle', 0.05);
    }
  }

  // Spikes deal 1 damage to the other cube
  for (const atk of players) {
    const tgt = players[1 - atk.i];
    if (atk.hitCd > 0) continue;
    const hit = getSpikes(atk).find(s => spikeHitsBox(s, tgt));
    if (!hit) continue;
    atk.hitCd = SPIKES[atk.spike].hitCd || HIT_COOLDOWN;
    if (tgt.shield > 0) { burst(hit.x, hit.y, '#29f0ff', 3); continue; }
    tgt.hp = Math.max(0, tgt.hp - 1);
    tgt.flash = 0.15;
    shake = Math.min(8, shake + 1.5);
    burst(hit.x, hit.y, atk.color);
    if (clock - lastHitSound > 0.06) { lastHitSound = clock; sfx(120 + Math.random() * 60, 0.06, 'square', 0.035); }
  }

  const dead = players.filter(p => p.hp <= 0);
  if (dead.length) endMatch(dead);
}

// ---------- End of match: wins, unlocks and scores ----------
function endMatch(dead) {
  state = 'over';
  $('quitBtn').classList.add('hidden');
  const text = $('winText');
  const winner = dead.length === 2 ? null : players.find(p => p.hp > 0);
  text.textContent = winner ? `${winner.name} wins!` : 'Draw!';
  text.style.color = winner ? winner.color : '#fff';
  const lines = [];

  if (mode === '1p') {
    const me = players[0], won = winner === me;
    const before = winsFor(me.account);
    if (me.account) {
      const acct = getAccount(me.account);
      if (won) acct.wins1p++; else if (winner) acct.losses1p++;
      saveAccount(me.account, acct);
    } else if (won) guestWins++;
    const after = winsFor(me.account);
    SKINS.filter(s => s.wins > before && s.wins <= after).forEach(s => lines.push(`<div class="up">New skin unlocked: ${s.name}!</div>`));
    if (!me.account && won) lines.push(`<div>Create an account to keep your wins and skins.</div>`);
  } else if (winner) {
    // Winner gains their remaining HP; loser loses the same amount
    const amount = winner.hp;
    for (const p of players) {
      if (!p.account) { lines.push(`<div style="color:${p.color}">${escapeHtml(p.name)}: guest, no score</div>`); continue; }
      const acct = getAccount(p.account);
      const old = acct.score, won = p === winner;
      acct.score = Math.max(0, old + (won ? amount : -amount));
      if (won) acct.wins2p++; else acct.losses2p++;
      saveAccount(p.account, acct);
      const diff = acct.score - old;
      lines.push(`<div style="color:${p.color}">${escapeHtml(p.name)}: ${old} → <b>${acct.score}</b>
        <span class="${diff >= 0 ? 'up' : 'down'}">(${diff >= 0 ? '+' : ''}${diff})</span></div>`);
    }
    lines.unshift(`<div class="fine">${escapeHtml(winner.name)} won with ${winner.hp} HP left</div>`);
  }
  $('results').innerHTML = lines.join('');
  [523, 659, 784].forEach((f, i) => setTimeout(() => sfx(f, 0.15, 'square', 0.04), i * 110));
  setTimeout(() => { if (state === 'over') $('over').classList.remove('hidden'); }, 700);
}

// ---------- Drawing ----------
const STARS = Array.from({ length: 9 }, (_, i) => ({ x: ((i * 37) % 100) / 100 - 0.5, y: ((i * 61 + 17) % 100) / 100 - 0.5, p: i }));

function drawSkin(c, x, y, s, skin, t) {
  const h = s / 2, l = x - h, top = y - h;
  c.save();
  if (skin === 'classic') { c.fillStyle = '#fff'; c.fillRect(l, top, s, s); }
  else if (skin === 'checker') {
    const n = 4, q = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { c.fillStyle = (i + j) % 2 ? '#111' : '#fff'; c.fillRect(l + i * q, top + j * q, q + 0.5, q + 0.5); }
    c.strokeStyle = '#fff'; c.lineWidth = Math.max(1, s * 0.04); c.strokeRect(l, top, s, s);
  } else if (skin === 'neon') {
    c.fillStyle = '#0b0b14'; c.fillRect(l, top, s, s);
    c.shadowColor = '#ff2bd6'; c.shadowBlur = s * 0.35;
    c.strokeStyle = '#ff2bd6'; c.lineWidth = s * 0.1; c.strokeRect(l + s * 0.05, top + s * 0.05, s * 0.9, s * 0.9);
    c.shadowColor = '#29f0ff'; c.strokeStyle = '#29f0ff'; c.lineWidth = s * 0.05; c.strokeRect(l + s * 0.25, top + s * 0.25, s * 0.5, s * 0.5);
  } else if (skin === 'ice') {
    const g = c.createLinearGradient(l, top, l + s, top + s);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#a6e6ff'); g.addColorStop(1, '#4fb3e8');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    c.fillStyle = 'rgba(255,255,255,.6)';
    c.beginPath(); c.moveTo(l, top); c.lineTo(l + s * 0.55, top); c.lineTo(l, top + s * 0.55); c.fill();
  } else if (skin === 'lava') {
    const off = Math.sin(t * 2) * s * 0.4;
    const g = c.createLinearGradient(l, top + off, l + s, top + s + off);
    g.addColorStop(0, '#ffd23f'); g.addColorStop(0.5, '#ff5a00'); g.addColorStop(1, '#a00d00');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    c.strokeStyle = 'rgba(60,0,0,.7)'; c.lineWidth = Math.max(1, s * 0.05);
    c.beginPath(); c.moveTo(l + s * 0.15, top + s * 0.3); c.lineTo(l + s * 0.45, top + s * 0.45); c.lineTo(l + s * 0.4, top + s * 0.8);
    c.moveTo(l + s * 0.45, top + s * 0.45); c.lineTo(l + s * 0.85, top + s * 0.35); c.stroke();
  } else if (skin === 'gold') {
    const g = c.createLinearGradient(l, top, l + s, top + s);
    g.addColorStop(0, '#fff6c2'); g.addColorStop(0.45, '#f2c94c'); g.addColorStop(1, '#9a6f00');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    c.beginPath(); c.rect(l, top, s, s); c.clip();
    const sx = l + (((t * 0.6) % 1.6) - 0.3) * s * 2;
    c.fillStyle = 'rgba(255,255,255,.55)';
    c.beginPath(); c.moveTo(sx, top); c.lineTo(sx + s * 0.2, top); c.lineTo(sx - s * 0.3, top + s); c.lineTo(sx - s * 0.5, top + s); c.fill();
  } else if (skin === 'galaxy') {
    const g = c.createRadialGradient(x, y, 0, x, y, s * 0.75);
    g.addColorStop(0, '#7b3fe4'); g.addColorStop(1, '#120526');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    for (const st of STARS) {
      c.globalAlpha = 0.5 + 0.5 * Math.sin(t * 3 + st.p);
      c.fillStyle = '#fff';
      c.fillRect(x + st.x * s * 0.85, y + st.y * s * 0.85, Math.max(1, s * 0.05), Math.max(1, s * 0.05));
    }
  } else if (skin === 'rainbow') {
    const g = c.createLinearGradient(l, top, l + s, top + s);
    for (let i = 0; i <= 4; i++) g.addColorStop(i / 4, `hsl(${(t * 120 + i * 70) % 360}, 90%, 60%)`);
    c.fillStyle = g; c.fillRect(l, top, s, s);
  }
  c.restore();
}

function drawCube(p, ghost) {
  const s = sizeOf(p), h = s / 2;
  ctx.save();
  if (ghost) ctx.globalAlpha = 0.5;
  if (p.dash > 0) {
    for (let k = 3; k >= 1; k--) {
      ctx.globalAlpha = 0.12 * (4 - k);
      drawSkin(ctx, p.x - p.vx * 0.02 * k, p.y - p.vy * 0.02 * k, s, p.skin, clock);
    }
    ctx.globalAlpha = 1;
  }
  drawSkin(ctx, p.x, p.y, s, p.skin, clock);
  if (p.flash > 0) { ctx.fillStyle = `rgba(255,60,60,${p.flash / 0.15 * 0.6})`; ctx.fillRect(p.x - h, p.y - h, s, s); }
  if (p.frozen > 0) {
    ctx.fillStyle = 'rgba(160,225,255,.55)'; ctx.fillRect(p.x - h, p.y - h, s, s);
    ctx.strokeStyle = '#dff6ff'; ctx.lineWidth = 2; ctx.strokeRect(p.x - h - 3, p.y - h - 3, s + 6, s + 6);
  }
  if (p.shield > 0) {
    ctx.strokeStyle = POWERS.shield.color; ctx.lineWidth = 3;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 12);
    ctx.beginPath(); ctx.arc(p.x, p.y, s * 0.95, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (p.unit) return; // preview: no name tag
  ctx.font = `bold ${Math.round(15 * Math.max(U, 0.8))}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = p.color;
  ctx.fillText(p.name, p.x, p.y - h - 12);
  const bw = s + 10;
  ctx.fillStyle = '#333'; ctx.fillRect(p.x - bw / 2, p.y - h - 9, bw, 5);
  ctx.fillStyle = p.color; ctx.fillRect(p.x - bw / 2, p.y - h - 9, bw * p.hp / MAX_HP, 5);
}

function drawSpikes(c, p) {
  const spikes = getSpikes(p), def = SPIKES[p.spike];
  c.save();
  if (p.rage > 0) { c.shadowColor = POWERS.rage.color; c.shadowBlur = 16; }
  for (const s of spikes) {
    if (s.kind === 'tri') {
      const [t, l, r] = triPoints(s);
      c.fillStyle = p.color;
      c.beginPath(); c.moveTo(t.x, t.y); c.lineTo(l.x, l.y); c.lineTo(r.x, r.y); c.closePath(); c.fill();
    } else if (s.kind === 'saw') {
      const teeth = 10, rot = p.angle * 3;
      c.fillStyle = p.color;
      c.beginPath();
      for (let i = 0; i < teeth * 2; i++) {
        const a = rot + i * Math.PI / teeth, rr = i % 2 ? s.r * 0.7 : s.r;
        c.lineTo(s.x + Math.cos(a) * rr, s.y + Math.sin(a) * rr);
      }
      c.closePath(); c.fill();
      c.fillStyle = '#000'; c.beginPath(); c.arc(s.x, s.y, s.r * 0.25, 0, Math.PI * 2); c.fill();
    } else {
      // Comet: fading trail behind the fireball
      for (let k = 6; k >= 1; k--) {
        const tp = spikeAt(p, s.a - p.spin * k * 0.07);
        c.globalAlpha = 0.5 * (1 - k / 7);
        c.fillStyle = p.color;
        c.beginPath(); c.arc(tp.x, tp.y, s.r * (1 - k / 9), 0, Math.PI * 2); c.fill();
      }
      c.globalAlpha = 1;
      const g = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
      g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ffd23f'); g.addColorStop(1, p.color);
      c.fillStyle = g; c.beginPath(); c.arc(s.x, s.y, s.r, 0, Math.PI * 2); c.fill();
    }
  }
  c.restore();
  c.strokeStyle = 'rgba(255,255,255,0.08)'; c.lineWidth = 1;
  c.beginPath(); c.arc(p.x, p.y, orbitOf(p) * def.orbit, 0, Math.PI * 2); c.stroke();
}

function drawHud() {
  const bw = Math.min(320, W / 2 - 40);
  const top = 12 + safeTop;
  players.forEach((p, i) => {
    const x = i === 0 ? 16 : W - 16 - bw;
    ctx.fillStyle = '#222'; ctx.fillRect(x, top, bw, 22);
    ctx.fillStyle = p.color;
    const w = bw * p.hp / MAX_HP;
    ctx.fillRect(i === 0 ? x : x + bw - w, top, w, 22);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = i === 0 ? 'left' : 'right';
    ctx.fillText(`${p.name}  ${p.hp}`, i === 0 ? x + 6 : x + bw - 6, top + 11);
  });
}

const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
function drawPowerButtons() {
  players.forEach((p, i) => {
    const b = buttons[i], def = POWERS[p.power];
    const ready = p.powerCd <= 0 && p.frozen <= 0;
    ctx.save();
    ctx.globalAlpha = p.isCpu ? 0.55 : 1;
    ctx.fillStyle = '#121216';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    // Recharge ring
    const frac = 1 - p.powerCd / def.cd;
    ctx.strokeStyle = ready ? def.color : '#555'; ctx.lineWidth = 5;
    if (ready) { ctx.shadowColor = def.color; ctx.shadowBlur = 10 + 6 * Math.sin(clock * 6); }
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = ready ? '#fff' : '#888';
    ctx.font = `bold ${Math.round(b.r * 0.36)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(def.name, b.x, b.y - (ready ? 0 : b.r * 0.15));
    if (!ready) { ctx.font = `${Math.round(b.r * 0.3)}px system-ui, sans-serif`; ctx.fillText(Math.ceil(Math.max(p.powerCd, p.frozen)) + 's', b.x, b.y + b.r * 0.28); }
    ctx.fillStyle = p.color; ctx.font = 'bold 11px system-ui, sans-serif';
    const label = p.isCpu ? 'CPU' : coarse ? '' : (i === 0 ? (mode === '1p' ? 'A / Space' : 'Key A') : 'Key L');
    if (label) ctx.fillText(label, b.x, b.y - b.r - 10);
    ctx.restore();
  });
}

function drawAimArrow(p) {
  const dx = mouse.x - p.x, dy = mouse.y - p.y;
  const l = Math.hypot(dx, dy) || 1;
  const ex = p.x + dx / l * 110 * U, ey = p.y + dy / l * 110 * U;
  ctx.strokeStyle = p.color; ctx.fillStyle = p.color; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(ex, ey); ctx.stroke();
  const a = Math.atan2(dy, dx);
  ctx.beginPath();
  ctx.moveTo(ex + Math.cos(a) * 14, ey + Math.sin(a) * 14);
  ctx.lineTo(ex + Math.cos(a + 2.5) * 14, ey + Math.sin(a + 2.5) * 14);
  ctx.lineTo(ex + Math.cos(a - 2.5) * 14, ey + Math.sin(a - 2.5) * 14);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 1;
}

function drawPreviews() {
  document.querySelectorAll('canvas.preview').forEach(cv => {
    const size = 120;
    if (cv.width !== size * DPR) { cv.width = size * DPR; cv.height = size * DPR; }
    const c = cv.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = '#000'; c.fillRect(0, 0, size, size);
    const isCpu = cv.dataset.i === 'cpu';
    const i = isCpu ? 1 : +cv.dataset.i;
    if (isCpu) {
      c.fillStyle = '#555'; c.font = 'bold 44px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('?', 60, 60);
      return;
    }
    const lo = loadouts[i];
    const fake = { x: 60, y: 60, unit: 0.34, spike: lo.spike, skin: lo.skin, color: COLORS[i], angle: clock * SPIKES[lo.spike].spin * (i ? -1 : 1), spin: i ? -1 : 1, rage: 0 };
    drawSpikes(c, fake);
    drawSkin(c, 60, 60, sizeOf(fake), lo.skin, clock);
  });
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (!$('setup').classList.contains('hidden')) drawPreviews();
  if (!players.length) return;

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  ctx.strokeRect(AX - 1, AY - 1, AS + 2, AS + 2);
  ctx.lineWidth = 1;

  for (const p of players) if (p.placed) drawSpikes(ctx, p);
  for (const p of players) if (p.placed) drawCube(p);

  if (state === 'place') {
    const pos = clampPos(mouse.x, mouse.y);
    drawCube({ ...players[placing], x: pos.x, y: pos.y }, true);
  }
  if (state === 'aim') drawAimArrow(players[placing]);

  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life * 2);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  for (const pp of popups) {
    ctx.globalAlpha = Math.min(1, pp.life * 2);
    ctx.fillStyle = pp.color; ctx.font = 'bold 18px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHud();
  if (state === 'play' || state === 'countdown') drawPowerButtons();
  if (state === 'countdown') {
    const n = Math.ceil(countdown / 0.8);
    ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(90 * U)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.9;
    ctx.fillText(n > 0 ? n : 'GO!', W / 2, H / 2);
    ctx.globalAlpha = 1;
  }
}

// Safe-area inset so the HP bars clear a phone's notch
let safeTop = 0;
(() => {
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top, 0px);visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);
  const set = () => { safeTop = probe.offsetHeight; };
  set(); window.addEventListener('resize', set);
})();

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  // Sub-step so fast cubes and spikes don't skip through each other
  for (let i = 0; i < 4; i++) update(dt / 4);
  draw();
  requestAnimationFrame(loop);
}
show('home');
requestAnimationFrame(loop);
</script>
</body>
</html>
