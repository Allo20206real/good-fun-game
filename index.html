    : `<div class="name-row"><span style="min-width:0">Name: <b>${escapeHtml(myMatchName())}</b></span><button class="small ghost" data-set="rename">Change name</button></div>`;
  const section = (label, tiles) => `<div><div class="section-label">${label}</div><div class="picker">${tiles}</div></div>`;
  const tile = (kind, id, on, body) => `<button class="tile ${on ? 'on' : ''}" data-kind="${kind}" data-id="${id}">${body}</button>`;
  const skins = SKINS.filter(x => owned.includes(x.id)).map(x => tile('skin', x.id, lo.skin === x.id, `<canvas width="72" height="72" data-skin="${x.id}"></canvas>${x.name}`)).join('');
  const spikes = Object.entries(SPIKES).map(([id, x]) => tile('spike', id, lo.spike === id, `${x.name}<small>${SPIKE_SHORT[id]}</small>`)).join('');
  const powers = Object.entries(POWERS).map(([id, x]) => tile('power', id, lo.power === id, `${x.name}<small>${POWER_SHORT[id]}</small>`)).join('');
  const cpu = online ? '' : section('CPU difficulty', Object.entries(DIFFICULTIES).map(([id, d]) =>
    tile('difficulty', id, difficulty === id, `${d.name}<small>Win: ${d.coins}${isEvent ? ' +50%' : ''} coins · +${d.score} score</small>`)).join(''));
  $('setupBody').innerHTML = `<div class="setup-left"><canvas class="big-preview" id="bigPreview"></canvas>${nameRow}
    <p class="fine desk-only">Press <b>Enter</b> to ${online ? 'get ready' : 'start'}.</p></div>
    <div class="setup-right">${section('Skin', skins)}${owned.length < SKINS.length ? '<p class="fine" style="margin-top:-12px">Get more skins in the Shop.</p>' : ''}
    ${section('Spike', spikes)}${section('Power', powers)}${cpu}</div>`;
  drawStaticSkins($('setupBody'));
  const go = $('startBtn');
  if (online) {
    go.textContent = online.ready ? `Waiting for ${online.oppName}…` : 'Ready!';
    go.disabled = online.ready;
    $('setupBack').textContent = 'Leave match';
  } else {
    go.textContent = 'Start'; go.disabled = false;
    $('setupBack').textContent = 'Back';
  }
  if (renaming) { const i = $('renameInput'); i.focus(); i.select(); }
}

$('setupBody').addEventListener('click', e => {
  const t = e.target.closest('[data-kind], [data-set]');
  if (!t) return;
  if (t.dataset.set === 'rename') { renaming = true; return renderSetup(); }
  if (online?.ready) return toast("You're locked in!");
  const kind = t.dataset.kind;
  if (kind === 'difficulty') { difficulty = t.dataset.id; store.set('bd.difficulty', difficulty); }
  else { myLoadout()[kind] = t.dataset.id; store.set('bd.loadouts', loadouts); }
  sfx(600, 0.03, 'square', 0.02);
  renderSetup();
  if (online) sendChoice();
});
$('setupBody').addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id !== 'renameForm') return;
  const v = $('renameInput').value.trim().slice(0, 16);
  if (v && isRude(v)) return toast('Please pick a different name.');
  matchName = v; renaming = false;
  renderSetup();
  if (online) sendChoice();
});

// ============================================================================
// Match
// ============================================================================
function makePlayer(i, name, lo, isCpu) {
  return {
    i, name, color: COLORS[i], isCpu,
    skin: lo.skin, spike: lo.spike, power: lo.power,
    hp: mods.hp, maxHp: mods.hp, x: 0, y: 0, vx: 0, vy: 0,
    angle: i * Math.PI, spin: i === 0 ? 1 : -1,
    hitCd: 0, flash: 0, placed: false,
    powerCd: 2, dash: 0, shield: 0, frozen: 0, rage: 0, aiTimer: 0, aiPlan: null, ai: isCpu ? DIFFICULTIES[difficulty] : null,
    dealt: 0, powersUsed: 0, hpLag: mods.hp, lastRing: 0,
  };
}

function randomLoadout(strong = false) {
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  return {
    skin: pick(SKINS.filter(s => !s.prize)).id,
    // Hard CPUs pick from the spikes and powers that win most often
    spike: pick(strong ? ['saw', 'lance', 'twin'] : Object.keys(SPIKES)),
    power: pick(strong ? ['shield', 'heal', 'rage'] : Object.keys(POWERS)),
  };
}

function startMatch() {
  mods = { ...BASE_MODS, ...(isEvent ? weekInfo().event.mods : {}) };
  resize();
  mode = '1p';
  const level = DIFFICULTIES[difficulty];
  players = [makePlayer(0, myMatchName(), myLoadout(), false), makePlayer(1, `CPU (${level.name})`, randomLoadout(level.strong), true)];
  // Easy CPUs start with less HP (event rules that lower everyone's HP still apply)
  const cpu = players[1];
  cpu.hp = cpu.maxHp = cpu.hpLag = Math.round(mods.hp * level.hp / 100);
  particles = []; popups = [];
  elapsed = 0; placing = 0; aimPress = false;
  state = 'place';
  native({ type: 'awake', on: true });
  screens.forEach(s => $(s).classList.add('hidden'));
  $('quitBtn').classList.remove('hidden');
  updateHint();
}
$('startBtn').onclick = () => {
  sfx(520, 0.1, 'square', 0.04, 1.5);
  if (towerSetup) startTower(); else if (online) setReady(); else startMatch();
};
$('againBtn').onclick = () => (mode === 'tower' ? startTower() : mode === 'online' ? startMatchmaking() : startMatch());
$('overMenu').onclick = () => show('app');
$('quitBtn').onclick = () => {
  if (tower && state === 'tower') {
    // A long climb isn't thrown away by one stray tap
    if (tower.clock > 15 && Date.now() - tower.quitAsk > 3000) { tower.quitAsk = Date.now(); return toast('Give up this climb? Press ✕ again to leave.'); }
    return show('app');
  }
  if (online) return leaveOnline('You left the match.');
  mods = { ...BASE_MODS }; resize(); show('app');
};
// The cube controlled on this device
const myIdx = () => (online ? online.myIdx : 0);
const myPlayer = () => players[myIdx()];
function pressPower() {
  if (online && online.role === 'guest') sendPower(); else usePower(myPlayer());
}

function updateHint() {
  canvas.classList.toggle('placing', state === 'place' || state === 'aim');
  if ((state === 'place' || state === 'aim') && players[placing]) {
    const p = players[placing];
    const left = online ? ` <span class="fine">(${Math.max(0, Math.ceil(PLACE_SECONDS - (Date.now() - online.phaseAt) / 1000))}s)</span>` : '';
    hint.innerHTML = `<b style="color:${p.color}">${escapeHtml(online ? 'You' : p.name)}</b>: ` +
      (state === 'place' ? 'tap inside the room to place your cube' : 'drag or tap to choose the bounce direction') + left;
    hint.classList.remove('hidden');
  } else if (state === 'wait' && online) {
    hint.innerHTML = `Waiting for <b>${escapeHtml(online.oppName)}</b> to place their cube…`;
    hint.classList.remove('hidden');
  } else {
    hint.classList.add('hidden');
  }
}

function clampPos(x, y, s = 64 * U) {
  const h = s / 2;
  return { x: Math.min(AX + AS - h, Math.max(AX + h, x)), y: Math.min(AY + AS - h, Math.max(AY + h, y)) };
}
function overlaps(a, x, y) { const s = sizeOf(a); return a.placed && Math.abs(a.x - x) < s && Math.abs(a.y - y) < s; }

function launch(p, dx, dy) {
  const l = Math.hypot(dx, dy) || 1;
  p.vx = dx / l * baseSpeed(); p.vy = dy / l * baseSpeed();
}

// The CPU picks a random spot and direction. It doesn't aim away from (or at) your cube;
// it only re-rolls if the spot would put the two cubes on top of each other.
function placeCpu(p) {
  const other = players[1 - p.i];
  for (let tries = 0; tries < 50; tries++) {
    const pos = clampPos(AX + Math.random() * AS, AY + Math.random() * AS);
    if (!overlaps(other, pos.x, pos.y)) { p.x = pos.x; p.y = pos.y; break; }
    if (tries === 49) { p.x = AX + AS / 2; p.y = other.y < AY + AS / 2 ? AY + AS - sizeOf(p) : AY + sizeOf(p); }
  }
  p.placed = true;
  const a = (Math.floor(Math.random() * 4) + 0.25 + Math.random() * 0.5) * Math.PI / 2;
  launch(p, Math.cos(a), Math.sin(a));
}

function finishPlacing() {
  if (online) return onlinePlaced(players[placing]);
  if (placing === 0) {
    if (players[1].isCpu) { placeCpu(players[1]); startCountdown(); }
    else { placing = 1; state = 'place'; }
  } else startCountdown();
}
function startCountdown() { state = 'countdown'; countdown = 2.4; sfx(440, 0.12); }

canvas.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('pointerdown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (state === 'play') {
    const b = buttons[0];
    if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r + 10) pressPower();
    return;
  }
  const p = players[placing];
  if (state === 'place') {
    const pos = clampPos(e.clientX, e.clientY);
    if (overlaps(players[1 - placing], pos.x, pos.y)) return;
    p.x = pos.x; p.y = pos.y; p.placed = true;
    state = 'aim';
    sfx(330, 0.05);
    updateHint();
  } else if (state === 'aim') {
    aimPress = true;
  }
});
canvas.addEventListener('pointerup', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  const p = players[placing];
  if (state === 'aim' && aimPress) {
    aimPress = false;
    let dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.hypot(dx, dy) < 5) { dx = 1; dy = 1; }
    launch(p, dx, dy);
    sfx(500, 0.06);
    finishPlacing();
  }
  updateHint();
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const visible = id => !$(id).classList.contains('hidden');
  if (e.key === 'Escape') {
    if (['place', 'aim', 'wait', 'countdown', 'play', 'tower'].includes(state)) $('quitBtn').click();
    else if (visible('setup')) $('setupBack').click();
    else if (visible('mm') || visible('over')) (visible('mm') ? $('mmCancel') : $('overMenu')).click();
    return;
  }
  if (e.key === 'Enter') {
    if (visible('setup') && !$('startBtn').disabled) { e.preventDefault(); $('startBtn').click(); }
    else if (visible('over') && !$('againBtn').disabled) { e.preventDefault(); $('againBtn').click(); }
    return;
  }
  if (state === 'tower') { towerKey(e, true); return; }
  if (state !== 'play') return;
  const k = e.key.toLowerCase();
  if (k === 'a' || k === ' ') { pressPower(); e.preventDefault(); }
});

// ---------- Spikes ----------
// Returns each spike's current position and shape
function getSpikes(p) {
  const def = SPIKES[p.spike], u = unit(p);
  const grow = (p.rage > 0 ? 1.7 : 1) * (p.unit ? 1 : mods.spikeScale);
  const out = [];
  for (let i = 0; i < def.count; i++) {
    const a = p.angle + i * Math.PI * 2 / def.count;
    out.push({ ...spikeAt(p, a), a, kind: def.kind, len: (def.len || 0) * u * grow, w: (def.w || 0) * u * grow, r: (def.r || 0) * u * grow });
  }
  return out;
}
function spikeAt(p, a) {
  const def = SPIKES[p.spike];
  let R = orbitOf(p) * def.orbit;
  if (def.pulse) R *= 1 + 0.3 * Math.sin(a * 1.5);
  return { x: p.x + Math.cos(a) * R, y: p.y + Math.sin(a) * R, R };
}
function triPoints(s) {
  const c = Math.cos(s.a), n = Math.sin(s.a);
  const bx = s.x - c * s.len / 2, by = s.y - n * s.len / 2;
  return [
    { x: s.x + c * s.len / 2, y: s.y + n * s.len / 2 },
    { x: bx - n * s.w / 2, y: by + c * s.w / 2 },
    { x: bx + n * s.w / 2, y: by - c * s.w / 2 },
  ];
}
function spikeHitsBox(s, b) {
  const h = sizeOf(b) / 2;
  if (s.kind === 'tri') {
    const pts = triPoints(s);
    // Sample along the spike's center line too, so long blades hit properly
    for (let t = -0.5; t <= 0.5; t += 0.25) pts.push({ x: s.x + Math.cos(s.a) * s.len * t, y: s.y + Math.sin(s.a) * s.len * t });
    return pts.some(pt => Math.abs(pt.x - b.x) < h && Math.abs(pt.y - b.y) < h);
  }
  const dx = Math.max(Math.abs(s.x - b.x) - h, 0), dy = Math.max(Math.abs(s.y - b.y) - h, 0);
  return dx * dx + dy * dy < s.r * s.r;
}

// ---------- Powers ----------
function usePower(p) {
  if (!p || state !== 'play' || p.powerCd > 0 || p.frozen > 0) return;
  const opp = players[1 - p.i], def = POWERS[p.power];
  p.powerCd = def.cd;
  p.powersUsed++;
  if (p.power === 'dash') p.dash = 2.5;
  if (p.power === 'shield') p.shield = 1.5;
  if (p.power === 'freeze') { opp.frozen = 2.5; burst(opp.x, opp.y, def.color, 18); }
  if (p.power === 'rage') p.rage = 3;
  if (p.power === 'heal') { p.hp = Math.min(p.maxHp, p.hp + 4); burst(p.x, p.y, def.color, 14); }
  if (p.power === 'blink') {
    burst(p.x, p.y, def.color, 14);
    for (let t = 0; t < 12; t++) {
      const a = Math.random() * Math.PI * 2;
      const pos = clampPos(opp.x + Math.cos(a) * orbitOf(p) * 0.9, opp.y + Math.sin(a) * orbitOf(p) * 0.9);
      if (!overlaps(opp, pos.x, pos.y)) { p.x = pos.x; p.y = pos.y; break; }
    }
    burst(p.x, p.y, def.color, 14);
  }
  popups.push({ x: p.x, y: p.y - sizeOf(p), text: def.name.toUpperCase() + '!', color: def.color, life: 0.9 });
  if (p === myPlayer()) buzz('medium');
  cpuAnswer(opp);
  sfx(300, 0.25, 'sawtooth', 0.04, 3);
}

// The CPU plays like a person: it looks at the game a few times a second, sometimes spots a good moment
// to use its power, and presses it after a reaction time. By then the moment may have passed.
function cpuPlan(p) {
  p.aiPlan = elapsed + p.ai.react * (0.7 + Math.random() * 0.6);
}
function cpuThink(p, dt) {
  if (p.aiPlan !== null) {
    if (elapsed >= p.aiPlan) { p.aiPlan = null; usePower(p); }
    return;
  }
  p.aiTimer -= dt;
  if (p.powerCd > 0 || p.frozen > 0 || p.aiTimer > 0) return;
  p.aiTimer = 0.25;
  if (Math.random() < p.ai.random * 0.25) return cpuPlan(p);
  if (cpuWants(p) && Math.random() < p.ai.skill * 0.5) cpuPlan(p);
}
// When you use your power, the CPU may answer with its own
function cpuAnswer(cpu) {
  if (cpu?.isCpu && cpu.aiPlan === null && cpu.powerCd <= 0 && cpu.frozen <= 0 && Math.random() < cpu.ai.counter) cpuPlan(cpu);
}
function cpuWants(p) {
  const opp = players[1 - p.i];
  const dist = Math.hypot(opp.x - p.x, opp.y - p.y), R = orbitOf(p);
  const near = (spikes, target, k) => spikes.some(s => Math.hypot(s.x - target.x, s.y - target.y) < sizeOf(target) * k);
  const want = {
    dash: dist < R * 2.5 && ((opp.x - p.x) * p.vx + (opp.y - p.y) * p.vy) > 0,
    shield: near(getSpikes(opp), p, 1.6),
    freeze: near(getSpikes(p), opp, 1.4),
    rage: dist < R * 1.6,
    heal: p.hp <= p.maxHp - 10,
    blink: dist > R * 1.5,
  };
  return want[p.power];
}

// ---------- Update ----------
const MAX_PARTICLES = 160;
function burst(x, y, color, n = 10) {
  n = Math.min(n, MAX_PARTICLES - particles.length);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (60 + Math.random() * 180) * U;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.3, color });
  }
}

// A hit: a damage number that counts up while the spike keeps hitting, plus an impact ring
function hitFx(q, x, y, color) {
  const pp = popups.find(o => o.dmgOf === q && o.life > 0.45);
  if (pp) { pp.n++; pp.text = '-' + pp.n; pp.life = 0.9; pp.pop = 1; }
  else popups.push({ dmgOf: q, n: 1, text: '-1', x: q.x + sizeOf(q) * 0.55, y: q.y - sizeOf(q) * 0.2, color: '#ff9a9a', life: 0.9, pop: 1 });
  if (clock - q.lastRing > 0.15) { q.lastRing = clock; rings.push({ x, y, r: 6 * U, life: 0.35, color }); }
}
// Small spark when a cube bounces off the wall
function wallHit(p, x, y) {
  for (let i = 0; i < 3; i++) {
    const a = Math.random() * Math.PI * 2, sp = (40 + Math.random() * 80) * U;
    if (particles.length < MAX_PARTICLES) particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.25, color: 'rgba(255,255,255,.8)' });
  }
  if (clock - lastWallSound > 0.12) { lastWallSound = clock; sfx(700 + Math.random() * 200, 0.03, 'triangle', 0.015); }
}

// Sparks, pop-up text and screen shake only need updating once per frame
function updateEffects(dt) {
  let n = 0;
  for (const pt of particles) {
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
    if (pt.life > 0) particles[n++] = pt;
  }
  particles.length = n;
  for (const pp of popups) { pp.y -= 30 * dt; pp.life -= dt; if (pp.pop) pp.pop = Math.max(0, pp.pop - dt * 6); }
  if (popups.length) popups = popups.filter(pp => pp.life > 0);
  for (const r of rings) { r.r += 160 * U * dt; r.life -= dt; }
  if (rings.length) rings = rings.filter(r => r.life > 0);
  // The white "damage trail" on the HP bars catches up with the real HP
  for (const q of players) if (q.hpLag > q.hp) q.hpLag = Math.max(q.hp, q.hpLag - dt * 22);
  koT = Math.max(0, koT - dt);
  shake = Math.max(0, shake - dt * 30);
  goFlash = Math.max(0, goFlash - dt);
}

function update(dt) {
  clock += dt;

  if (state === 'countdown') {
    const before = Math.ceil(countdown / 0.8);
    countdown -= dt;
    if (Math.ceil(countdown / 0.8) !== before && countdown > 0) { sfx(440, 0.12); buzz('selection'); }
    if (countdown <= 0) { state = 'play'; goFlash = 0.6; sfx(880, 0.2); buzz('heavy'); }
    return;
  }
  if (state !== 'play') return;
  if (online && online.role === 'guest') return;
  if (elapsed < OVERTIME_AT && elapsed + dt >= OVERTIME_AT) {
    popups.push({ x: W / 2, y: AY + AS / 2, text: 'OVERTIME! Spikes are growing', color: '#ffcf3f', life: 2, big: true });
    sfx(220, 0.4, 'sawtooth', 0.05, 2); buzz('heavy');
  }
  elapsed += dt;
  // Gets faster over time so matches don't drag on
  const speedMul = Math.min(4, 1 + elapsed / 25);

  for (const p of players) {
    const h = sizeOf(p) / 2;
    p.powerCd = Math.max(0, p.powerCd - dt * mods.powerRate);
    for (const k of ['dash', 'shield', 'frozen', 'rage', 'hitCd', 'flash']) p[k] = Math.max(0, p[k] - dt);
    if (p.isCpu) cpuThink(p, dt);
    if (p.frozen > 0) continue;
    const m = speedMul * (p.dash > 0 ? 2 : 1);
    p.x += p.vx * m * dt;
    p.y += p.vy * m * dt;
    if (p.x < AX + h) { p.x = AX + h; p.vx = Math.abs(p.vx); wallHit(p, AX, p.y); }
    if (p.x > AX + AS - h) { p.x = AX + AS - h; p.vx = -Math.abs(p.vx); wallHit(p, AX + AS, p.y); }
    if (p.y < AY + h) { p.y = AY + h; p.vy = Math.abs(p.vy); wallHit(p, p.x, AY); }
    if (p.y > AY + AS - h) { p.y = AY + AS - h; p.vy = -Math.abs(p.vy); wallHit(p, p.x, AY + AS); }
    p.angle += SPIKES[p.spike].spin * p.spin * speedMul * (p.rage > 0 ? 1.6 : 1) * dt;
  }

  // Cube vs cube bounce. A frozen cube acts like a wall.
  const [a, b] = players;
  const S = sizeOf(a);
  const ox = S - Math.abs(a.x - b.x), oy = S - Math.abs(a.y - b.y);
  if (ox > 0 && oy > 0) {
    const aF = a.frozen > 0, bF = b.frozen > 0;
    const shareA = aF && !bF ? 0 : bF && !aF ? 1 : 0.5;
    const axis = ox < oy ? 'x' : 'y', v = 'v' + axis, over = ox < oy ? ox : oy;
    const dir = a[axis] < b[axis] ? -1 : 1;
    a[axis] += dir * over * shareA; b[axis] -= dir * over * (1 - shareA);
    if ((b[axis] - a[axis]) * (b[v] - a[v]) < 0) {
      if (aF && !bF) b[v] = -b[v];
      else if (bF && !aF) a[v] = -a[v];
      else [a[v], b[v]] = [b[v], a[v]];
      sfx(180, 0.05, 'triangle', 0.05);
    }
    // A bump next to a wall can push a cube into it; keep both inside the room
    for (const p of players) {
      const h = sizeOf(p) / 2;
      p.x = Math.min(AX + AS - h, Math.max(AX + h, p.x));
      p.y = Math.min(AY + AS - h, Math.max(AY + h, p.y));
    }
  }

  // Spikes deal 1 damage to the other cube
  for (const atk of players) {
    const tgt = players[1 - atk.i];
    if (atk.hitCd > 0) continue;
    const hit = getSpikes(atk).find(s => spikeHitsBox(s, tgt));
    if (!hit) continue;
    atk.hitCd = SPIKES[atk.spike].hitCd || HIT_COOLDOWN;
    if (tgt.shield > 0) { burst(hit.x, hit.y, '#29f0ff', 3); continue; }
    tgt.hp = Math.max(0, tgt.hp - 1);
    atk.dealt++;
    if (tgt === myPlayer()) buzz('light');
    tgt.flash = 0.15;
    shake = Math.min(8, shake + 1.5);
    burst(hit.x, hit.y, atk.color, 4);
    hitFx(tgt, hit.x, hit.y, atk.color);
    if (clock - lastHitSound > 0.06) { lastHitSound = clock; sfx(120 + Math.random() * 60, 0.06, 'square', 0.035); }
  }

  const dead = players.filter(p => p.hp <= 0);
  if (dead.length) endMatch(dead);
}

// ============================================================================
// Online matches: matchmaking, choosing fighters, placing cubes, live play
// ============================================================================
// One phone (the "host") runs the match and sends its state 15 times a second; the other
// phone (the "guest") shows it smoothly and sends its power button presses back.
const MATCH_VERSION = 1;
const SEARCH_SECONDS = window.BD_SEARCH_SECONDS || 30;
const SELECT_SECONDS = window.BD_SELECT_SECONDS || 20;
const PLACE_SECONDS = 10;
const SEND_EVERY = 1 / 15;
const MAX_IN_FLIGHT = 3;      // updates the host can have on the way at once
const GUEST_DELAY = 0.12;     // the guest shows the match at least this far behind, to smooth out the network
let mmSession = null;         // matchmaking search in progress
let online = null;            // online match in progress

function mmShow(title, text, { spin = true, button = 'Cancel', onButton } = {}) {
  screens.forEach(x => $(x).classList.toggle('hidden', x !== 'mm'));
  $('mmTitle').textContent = title;
  $('mmText').textContent = text;
  $('mmSpin').classList.toggle('hidden', !spin);
  if (!spin) $('mmTimer').textContent = '';
  $('mmCancel').textContent = button;
  $('mmCancel').onclick = onButton || (() => show('app'));
}

async function startMatchmaking() {
  if (mmSession || online) return;
  const myId = auth1.uid;
  const sess = mmSession = { cancelled: false, found: false, stops: [], offset: 0 };
  state = 'menu'; players = [];
  mmShow('Matchmaking…', 'Looking for another player', { onButton: () => cancelMatchmaking(null) });
  const ends = Date.now() + SEARCH_SECONDS * 1000;
  const tick = () => { if (mmSession === sess) $('mmTimer').textContent = Math.max(0, Math.ceil((ends - Date.now()) / 1000)) + 's'; };
  tick(); sess.timer = setInterval(tick, 250);
  try {
    await rtdb('DELETE', `queue/${myId}`);
    await rtdb('PUT', `queue/${myId}`, { t: SERVER_TIME, name: me.name, v: MATCH_VERSION });
    const mine = await rtdb('GET', `queue/${myId}`);
    sess.offset = (mine?.t || Date.now()) - Date.now();
    if (sess.cancelled) return;
    // Another player may pair with us: watch our spot in the queue
    sess.stops.push(rtdbStream(`queue/${myId}/match`, m => {
      if (m && m.id && m.by !== myId && !sess.found && !sess.cancelled) { sess.found = true; foundMatch(sess, m.id, 'guest'); }
    }));
    while (!sess.cancelled && !sess.found && Date.now() < ends) {
      await tryPair(sess, myId);
      if (sess.found || sess.cancelled) return;
      await sleep(800 + Math.random() * 700);
    }
    if (sess.found || sess.cancelled) return;
    // Time's up. Last check that nobody paired with us at the final second
    const last = await rtdb('GET', `queue/${myId}/match`).catch(() => null);
    if (last?.id && last.by !== myId && !sess.found) { sess.found = true; return foundMatch(sess, last.id, 'guest'); }
    cancelMatchmaking('No other players are searching right now. Try again in a bit!');
  } catch (e) {
    cancelMatchmaking(e.message === 'DENIED' ? 'Online matches are not set up on the server yet.' : e.message);
  }
}

async function tryPair(sess, myId) {
  const q = await rtdb('GET', 'queue') || {};
  const now = Date.now() + sess.offset;
  // Only start a match with players whose id sorts after ours, so two players never grab each other at once.
  // With three or more searching, the partner is picked at random.
  const free = Object.entries(q).filter(([uid, e]) => uid > myId && e && !e.match && e.v === MATCH_VERSION && now - e.t < (SEARCH_SECONDS + 5) * 1000);
  if (!free.length || sess.cancelled || sess.found) return;
  const [other, entry] = free[Math.floor(Math.random() * free.length)];
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  // Lock ourselves first; if this fails, someone just paired with us and the watcher takes over
  try { await rtdb('PUT', `queue/${myId}/match`, { id, by: myId }); } catch { return; }
  if (sess.cancelled) { await rtdb('DELETE', `queue/${myId}/match`).catch(() => {}); return; }
  try {
    await rtdb('PUT', `matches/${id}`, { players: { a: myId, b: other }, names: { a: me.name, b: safeName(entry.name) }, v: MATCH_VERSION, phase: 'select', created: SERVER_TIME });
    await rtdb('PUT', `queue/${other}/match`, { id, by: myId });
  } catch {
    // They were paired with someone else a moment ago: undo and keep looking
    await rtdb('DELETE', `matches/${id}`).catch(() => {});
    await rtdb('DELETE', `queue/${myId}/match`).catch(() => {});
    return;
  }
  sess.found = true;
  foundMatch(sess, id, 'host');
}

function stopSearch(sess) {
  sess.cancelled = true;
  clearInterval(sess.timer);
  sess.stops.forEach(f => f());
  if (mmSession === sess) mmSession = null;
  rtdb('DELETE', `queue/${auth1.uid}`).catch(() => {});
}
function cancelMatchmaking(msg) {
  const sess = mmSession;
  if (!sess) return;
  stopSearch(sess);
  if (!msg) { toast('Matchmaking cancelled'); return show('app'); }
  mmShow('No match found', msg, { spin: false, button: 'Back to menu' });
}
function foundMatch(sess, id, role) {
  stopSearch(sess);
  mmShow('Player found!', 'Getting ready…', { spin: true, button: 'Leave', onButton: () => leaveOnline('You left the match.') });
  joinMatch(id, role);
}

function joinMatch(id, role) {
  online = {
    id, role, myIdx: role === 'host' ? 0 : 1, myId: auth1.uid, oppId: null, oppName: 'your opponent',
    mirror: null, phase: 'select', joinedAt: Date.now(), phaseAt: Date.now(), ready: false, placed: false,
    presses: 0, seenPresses: 0, snaps: [], renderT: 0, lastSend: 0, inFlight: 0, gap: 0.1, lastArrival: 0, timers: [],
  };
  mode = 'online'; isEvent = false; matchName = ''; renaming = false;
  mods = { ...BASE_MODS }; resize();
  const o = online;
  o.stop = rtdbStream(`matches/${id}`, m => { if (online === o) onMatchData(m); },
    () => { if (online === o && o.phase !== 'over') leaveOnline('Lost the connection to the match.', true); });
  sendChoice();
  o.timers.push(setInterval(() => rtdb('PATCH', `matches/${id}/p/${o.myId}`, { hb: SERVER_TIME }).catch(() => {}), 2000));
  o.timers.push(setInterval(checkOnline, 500));
  show('setup'); renderSetup();
}

function sendChoice() {
  if (!online) return;
  const lo = myLoadout();
  rtdb('PATCH', `matches/${online.id}/p/${online.myId}`, {
    name: myMatchName(), skin: lo.skin, spike: lo.spike, power: lo.power, ready: online.ready, hb: SERVER_TIME,
  }).catch(() => {});
}
function setReady() {
  if (!online || online.ready) return;
  online.ready = true;
  renaming = false;
  sendChoice();
  renderSetup();
}
function onlineVsCard() {
  const opp = online.mirror?.p?.[online.oppId];
  const left = Math.max(0, Math.ceil(SELECT_SECONDS - (Date.now() - online.joinedAt) / 1000));
  const status = opp?.ready ? '<span class="ok">Ready ✓</span>' : opp ? 'Choosing…' : 'Joining…';
  return `<div class="vs-card"><div class="who"><span class="fine">You're playing against</span><b>${escapeHtml(online.oppName)}</b>
    <span class="fine">${status}</span></div><div class="clock">${left}</div></div>`;
}

// A choice from the other phone: only accept known skins, spikes and powers
function safeLoadout(p) {
  return {
    skin: SKINS.some(x => x.id === p?.skin) ? p.skin : 'classic',
    spike: SPIKES[p?.spike] ? p.spike : 'classic',
    power: POWERS[p?.power] ? p.power : 'dash',
  };
}
const safeName = n => (typeof n === 'string' && n.trim() && !isRude(n) ? n.trim().slice(0, 16) : 'Player');

function onMatchData(m) {
  const o = online;
  o.mirror = m;
  if (!m) { if (o.phase !== 'over') leaveOnline('The match was closed.', true); return; }
  o.oppId = o.role === 'host' ? m.players?.b : m.players?.a;
  const opp = m.p?.[o.oppId];
  if (opp?.name) o.oppName = safeName(opp.name);
  else if (m.names) o.oppName = safeName(o.role === 'host' ? m.names.b : m.names.a);
  if (m.phase === 'cancelled') {
    if (o.phase !== 'over') leaveOnline(m.leftBy === o.myId ? 'You left the match.' : `${o.oppName} left the match.`, true);
    return;
  }
  if (m.phase !== o.phase) { o.phase = m.phase; o.phaseAt = Date.now(); onPhase(m); }
  if (!online) return;
  if (o.role === 'host') hostCheck(m);
  if (o.role === 'guest' && m.state && (m.phase === 'go' || m.phase === 'over')) guestSnapshot(m.state);
  if (m.phase === 'over' && m.result) onlineResult(m.result);
  if (o.phase === 'select' && !$('setup').classList.contains('hidden')) $('setupTop').innerHTML = onlineVsCard();
}

function onPhase(m) {
  const o = online;
  if (m.phase === 'place') {
    const ids = [m.players.a, m.players.b];
    players = ids.map((id, i) => makePlayer(i, safeName(m.p?.[id]?.name), safeLoadout(m.p?.[id]), false));
    particles = []; popups = []; elapsed = 0; aimPress = false; shake = 0;
    placing = o.myIdx; state = 'place';
    screens.forEach(x => $(x).classList.add('hidden'));
    $('quitBtn').classList.remove('hidden');
    native({ type: 'awake', on: true });
    sfx(440, 0.12);
    updateHint();
  }
  if (m.phase === 'go' && m.start) {
    ['a', 'b'].forEach((k, i) => {
      const q = m.start[k], p = players[i];
      p.x = AX + q.x * AS; p.y = AY + q.y * AS; p.placed = true;
      launch(p, q.dx, q.dy);
    });
    o.snaps = []; o.renderT = 0;
    startCountdown();
    updateHint();
  }
}

// Things only the host decides: when to move on, where the cubes start, the guest's power presses
function hostCheck(m) {
  const o = online, mine = m.p?.[o.myId], theirs = m.p?.[o.oppId];
  if (m.phase === 'select' && mine?.ready && theirs?.ready && !o.sentPlace) {
    o.sentPlace = true;
    rtdb('PATCH', `matches/${o.id}`, { phase: 'place' }).catch(() => {});
  }
  if (m.phase === 'place' && mine?.place && theirs?.place && !o.sentStart) { o.sentStart = true; hostStart(mine.place, theirs.place); }
  if (m.phase === 'go' && state === 'play' && theirs) {
    const n = Number(theirs.presses) || 0;
    while (o.seenPresses < n) { o.seenPresses++; usePower(players[1]); }
  }
}
function hostStart(pa, pb) {
  const s = 64 / 600, lo = s / 2 + 0.005, hi = 1 - s / 2 - 0.005;   // cube size in room units
  const fix = q => {
    const dx = Number(q?.dx) || 1, dy = Number(q?.dy) || 1;
    return { x: Math.min(hi, Math.max(lo, Number(q?.x) || 0.5)), y: Math.min(hi, Math.max(lo, Number(q?.y) || 0.5)), dx, dy };
  };
  const A = fix(pa), B = fix(pb);
  // Both picked almost the same spot: slide the guest's cube away
  if (Math.abs(A.x - B.x) < s * 1.3 && Math.abs(A.y - B.y) < s * 1.3) B.x = A.x < 0.5 ? Math.min(hi, A.x + 0.35) : Math.max(lo, A.x - 0.35);
  rtdb('PATCH', `matches/${online.id}`, { phase: 'go', start: { a: A, b: B } }).catch(() => {});
}

function checkOnline() {
  const o = online;
  if (!o) return;
  const now = Date.now(), m = o.mirror;
  if (o.phase === 'select') {
    if (!$('setup').classList.contains('hidden')) $('setupTop').innerHTML = onlineVsCard();
    // Time's up: go with whatever you picked
    if (!o.ready && now - o.joinedAt > SELECT_SECONDS * 1000) setReady();
  }
  if (o.phase === 'place') {
    if (!o.placed && now - o.phaseAt > PLACE_SECONDS * 1000) autoPlace();
    updateHint();
  }
  // Heartbeats are server times, so compare theirs with ours
  const mine = m?.p?.[o.myId]?.hb, theirs = m?.p?.[o.oppId]?.hb;
  if (!theirs && now - o.joinedAt > 15000) return leaveOnline(`${o.oppName === 'your opponent' ? 'The other player' : o.oppName} didn't join.`);
  if (mine && theirs && mine - theirs > 10000 && o.phase !== 'over') return leaveOnline(`${o.oppName} lost connection.`);
}

function onlinePlaced(p) {
  const o = online;
  if (!o || o.placed) return;
  o.placed = true;
  const l = Math.hypot(p.vx, p.vy) || 1;
  rtdb('PATCH', `matches/${o.id}/p/${o.myId}`, {
    place: { x: (p.x - AX) / AS, y: (p.y - AY) / AS, dx: p.vx / l, dy: p.vy / l },
  }).catch(() => {});
  state = 'wait';
  updateHint();
}
function autoPlace() {
  const p = myPlayer();
  if (!p.placed) {
    const pos = clampPos(AX + (0.2 + Math.random() * 0.6) * AS, AY + (0.2 + Math.random() * 0.6) * AS);
    p.x = pos.x; p.y = pos.y; p.placed = true;
  }
  const a = (Math.floor(Math.random() * 4) + 0.25 + Math.random() * 0.5) * Math.PI / 2;
  launch(p, Math.cos(a), Math.sin(a));
  onlinePlaced(p);
}

// ---------- Host: send the match ----------
const r4 = v => Math.round(v * 1e4) / 1e4;
function packState() {
  return {
    t: r4(elapsed),
    p: players.map(q => [r4((q.x - AX) / AS), r4((q.y - AY) / AS), r4(q.vx / AS), r4(q.vy / AS), r4(q.angle),
      q.hp, r4(q.powerCd), r4(q.dash), r4(q.shield), r4(q.frozen), r4(q.rage), q.dealt, q.powersUsed]),
  };
}
function hostSend() {
  const o = online;
  if (o.inFlight >= MAX_IN_FLIGHT || clock - o.lastSend < SEND_EVERY) return;
  o.lastSend = clock; o.inFlight++;
  rtdb('PATCH', `matches/${o.id}`, { state: packState() }).catch(() => {}).finally(() => { o.inFlight--; });
}
function hostFinish(winner) {
  const o = online;
  const result = {
    winner: winner ? (winner.i === 0 ? o.myId : o.oppId) : 'draw', hp: winner ? winner.hp : 0,
    dealt: players.map(q => q.dealt), powers: players.map(q => q.powersUsed),
  };
  rtdb('PATCH', `matches/${o.id}`, { state: packState(), result, phase: 'over' }).catch(() => {});
  onlineResult(result);
  // Tidy up the match once both phones have had time to read the result
  const id = o.id;
  setTimeout(() => rtdb('DELETE', `matches/${id}`).catch(() => {}), 30000);
}

// ---------- Guest: show the match ----------
function guestSnapshot(st) {
  const o = online, snaps = o.snaps;
  if (!st?.p || (snaps.length && st.t <= snaps[snaps.length - 1].t)) return;
  const prev = snaps[snaps.length - 1];
  const now = performance.now() / 1000;
  if (o.lastArrival) o.gap = o.gap * 0.8 + Math.min(1, now - o.lastArrival) * 0.2;
  o.lastArrival = now;
  snaps.push({ t: st.t, p: st.p });
  if (snaps.length > 40) snaps.splice(0, snaps.length - 40);
  if (!prev) return;
  // Effects the host saw: hits and powers
  players.forEach((q, i) => {
    const was = prev.p[i], now = st.p[i];
    if (now[5] < was[5]) {
      q.flash = 0.15; shake = Math.min(8, shake + 1.5);
      burst(q.x, q.y, players[1 - i].color, 4);
      for (let k = 0; k < was[5] - now[5]; k++) hitFx(q, q.x, q.y, players[1 - i].color);
      if (q === myPlayer()) buzz('light');
      if (clock - lastHitSound > 0.06) { lastHitSound = clock; sfx(120 + Math.random() * 60, 0.06, 'square', 0.035); }
    }
    if (now[12] > was[12]) {
      const def = POWERS[q.power];
      popups.push({ x: q.x, y: q.y - sizeOf(q), text: def.name.toUpperCase() + '!', color: def.color, life: 0.9 });
      sfx(300, 0.25, 'sawtooth', 0.04, 3);
      if (q === myPlayer()) buzz('medium');
    }
  });
}
function guestTick(dt) {
  const o = online, snaps = o.snaps;
  for (const q of players) q.flash = Math.max(0, q.flash - dt);
  if (!snaps.length) return;
  // Play the match a little behind the newest state, catching up gently if we drift
  const delay = Math.min(0.6, Math.max(GUEST_DELAY, o.gap * 1.6 + 0.04));
  const target = snaps[snaps.length - 1].t - delay;
  if (!o.renderT || Math.abs(o.renderT - target) > 0.5) o.renderT = target;
  else o.renderT += dt * (1 + Math.max(-0.5, Math.min(0.5, (target - o.renderT) * 2)));
  const t = o.renderT;
  let i = snaps.findIndex(x => x.t > t);
  if (i === -1) i = snaps.length - 1;
  const s1 = snaps[i], s0 = snaps[Math.max(0, i - 1)];
  const k = s1.t > s0.t ? Math.min(1, Math.max(0, (t - s0.t) / (s1.t - s0.t))) : 1;
  elapsed = Math.max(0, t);
  players.forEach((q, j) => {
    const a = s0.p[j], b = s1.p[j];
    q.x = AX + (a[0] + (b[0] - a[0]) * k) * AS;
    q.y = AY + (a[1] + (b[1] - a[1]) * k) * AS;
    q.vx = b[2] * AS; q.vy = b[3] * AS;
    q.angle = a[4] + (b[4] - a[4]) * k;
    [q.hp, q.powerCd, q.dash, q.shield, q.frozen, q.rage, q.dealt, q.powersUsed] = b.slice(5);
  });
}
function sendPower() {
  const o = online, p = myPlayer();
  if (state !== 'play' || p.powerCd > 0 || p.frozen > 0) return;
  o.presses++;
  rtdb('PATCH', `matches/${o.id}/p/${o.myId}`, { presses: o.presses }).catch(() => {});
}

function onlineResult(result) {
  const o = online;
  if (!o || o.resultShown) return;
  o.resultShown = true;
  state = 'over';
  // Use the host's final numbers on both phones
  const winner = result.winner === 'draw' ? null : players[result.winner === (o.role === 'host' ? o.myId : o.oppId) ? 0 : 1];
  players.forEach((q, i) => {
    q.dealt = Number(result.dealt?.[i]) || q.dealt;
    q.powersUsed = Number(result.powers?.[i]) || q.powersUsed;
    q.hp = q === winner ? Math.max(1, Number(result.hp) || 1) : 0;
  });
  if (!winner) players.forEach(q => { q.hp = 0; });
  closeOnline();
  showResult(winner, players[o.myIdx], o.oppName);
}
function closeOnline() {
  const o = online;
  if (!o) return;
  online = null;
  o.stop?.();
  o.timers.forEach(clearInterval);
}
function leaveOnline(msg, fromServer = false) {
  const o = online;
  if (!o) return;
  closeOnline();
  if (!fromServer) rtdb('PATCH', `matches/${o.id}`, { phase: 'cancelled', leftBy: o.myId }).catch(() => {});
  mods = { ...BASE_MODS }; resize();
  state = 'menu'; players = [];
  native({ type: 'awake', on: false });
  $('quitBtn').classList.add('hidden');
  updateHint();
  mode = '1p';
  mmShow('Match ended', `${msg} No points were won or lost.`, { spin: false, button: 'Back to menu' });
}

// ============================================================================
// End of match: coins, score, challenges
// ============================================================================
function matchCoins(won, winner) {
  let c;
  if (mode === '1p') c = won ? DIFFICULTIES[difficulty].coins : 3;
  else c = !winner ? 5 : won ? 15 : 5;
  if (isEvent) c *= 1.5;
  if (weekInfo().event.coinRush) c *= 2;
  return Math.round(c);
}
function matchStats(p, won) {
  const s = { play: 1, damage: p.dealt, power: p.powersUsed };
  if (isEvent) s.eventplay = 1;
  if (won) {
    s[mode === '1p' ? 'win1p' : 'win2p'] = 1;
    s['win_' + p.spike] = 1;
    if (p.hp >= 50) s.bigwin = 1;
    if (mode === '1p' && difficulty === 'hard') s.winHard = 1;
  }
  return s;
}

function endMatch(dead) {
  state = 'over';
  const winner = dead.length === 2 ? null : players.find(p => p.hp > 0);
  if (online) return hostFinish(winner);
  showResult(winner, players[0]);
}

// The result screen. Saves coins, wins/losses, score and challenge progress for the player on this phone.
async function showResult(winner, mine, oppName) {
  const won = winner === mine;
  $('quitBtn').classList.add('hidden');
  // K.O. moment before the results
  const loser = winner && players.find(q => q !== winner);
  koT = 1.3; koText = winner ? 'K.O.!' : 'DRAW'; koColor = winner ? winner.color : '#888';
  shake = 14;
  if (loser) { burst(loser.x, loser.y, winner.color, 28); burst(loser.x, loser.y, '#fff', 16); rings.push({ x: loser.x, y: loser.y, r: 10 * U, life: 0.35, color: '#fff' }); }
  // Win streaks (single player and online count together)
  if (won) winStreak++; else if (winner) winStreak = 0;
  store.set('bd.winStreak', winStreak);
  const streakBonus = mode === '1p' && won && winStreak >= 2 ? Math.min(12, 3 * (winStreak - 1)) : 0;
  const text = $('winText');
  text.textContent = !winner ? 'Draw!' : won ? 'You win!' : `${winner.name} wins!`;
  text.style.color = winner ? winner.color : '#fff';
  [523, 659, 784].forEach((f, i) => setTimeout(() => sfx(f, 0.15, 'square', 0.04), i * 110));
  native({ type: 'awake', on: false });
  buzz(won || !winner ? 'success' : 'error');
  $('againBtn').textContent = mode === 'online' ? 'Play again' : 'Rematch';
  const results = $('results');
  results.innerHTML = me ? '<div class="fine">Saving…</div>' : '';
  $('againBtn').disabled = true;
  setTimeout(() => { if (state === 'over') { screens.forEach(x => $(x).classList.toggle('hidden', x !== 'over')); } }, 1300);

  const lines = [];
  if (mode === 'online' && winner) lines.push(`<div class="fine">${won ? `You beat ${escapeHtml(oppName || 'your opponent')}` : `${escapeHtml(winner.name)} won`} with ${winner.hp} HP left</div>`);
  const coins = matchCoins(won, winner) + streakBonus;
  if (won && winStreak >= 2) lines.push(`<div class="line"><b>${winStreak} wins in a row!</b>${streakBonus ? ` <span class="up">+${streakBonus} streak bonus</span>` : ''}</div>`);
  if (!me) {
    lines.push(`<div class="line">${coinHtml(coins)} coins not saved. <b>Log in to save your coins and score</b>, and to play two-player online.</div>`);
  } else {
    try {
      const challenges = dailyChallenges();
      let scoreLine = '', done = [], wl = '';
      await mutateUser(auth1, d => {
        rollDaily(d);
        d.coins += coins;
        if (mode === '1p') {
          if (won) {
            // Beating the CPU adds score too, more for harder levels (losing takes none away)
            d.wins1p++;
            const old = d.score;
            d.score += DIFFICULTIES[difficulty].score;
            scoreLine = `<div class="line">Score ${old} → <b>${d.score}</b> <span class="up">(+${d.score - old} for beating ${DIFFICULTIES[difficulty].name})</span></div>`;
          } else if (winner) d.losses1p++;
        }
        else if (winner) {
          // Winner gains the HP they have left; the loser loses the same amount
          const old = d.score;
          d.score = Math.max(0, old + (won ? winner.hp : -winner.hp));
          if (won) d.wins2p++; else d.losses2p++;
          const diff = d.score - old;
          scoreLine = `<div class="line">Score ${old} → <b>${d.score}</b> <span class="${diff >= 0 ? 'up' : 'down'}">(${diff >= 0 ? '+' : ''}${diff})</span></div>`;
          wl = `<div class="line">Two-player record: <b>${d.wins2p}</b> wins · <b>${d.losses2p}</b> losses</div>`;
        }
        const before = {};
        for (const c of challenges) before[c.id] = (d.daily.progress[c.metric] || 0) >= c.target;
        for (const [key, v] of Object.entries(matchStats(mine, won))) {
          if (challenges.some(c => c.metric === key)) d.daily.progress[key] = (d.daily.progress[key] || 0) + v;
        }
        done = challenges.filter(c => !before[c.id] && (d.daily.progress[c.metric] || 0) >= c.target);
      });
      lines.push(`<div class="line"><span class="up">+${coins}</span> ${coinHtml('')} coins</div>`);
      if (scoreLine) lines.push(scoreLine, wl);
      done.forEach(c => lines.push(`<div class="line">Challenge done! “${escapeHtml(c.text)}”. Claim ${coinHtml(c.reward)} in Events.</div>`));
    } catch (e) {
      lines.push(`<div class="line down">Couldn't save this match. ${escapeHtml(e.message)}</div>`);
    }
  }
  if (isEvent) lines.push(`<div class="fine">Event match bonus: +50% coins</div>`);
  if (state === 'over') results.innerHTML = lines.join('');
  $('againBtn').disabled = false;
}

// Drawing
// ============================================================================
const STARS = Array.from({ length: 9 }, (_, i) => ({ x: ((i * 37) % 100) / 100 - 0.5, y: ((i * 61 + 17) % 100) / 100 - 0.5, p: i }));

function drawSkin(c, x, y, s, skin, t) {
  const h = s / 2, l = x - h, top = y - h;
  c.save();
  if (skin === 'checker') {
    const n = 4, q = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { c.fillStyle = (i + j) % 2 ? '#111' : '#fff'; c.fillRect(l + i * q, top + j * q, q + 0.5, q + 0.5); }
    c.strokeStyle = '#fff'; c.lineWidth = Math.max(1, s * 0.04); c.strokeRect(l, top, s, s);
  } else if (skin === 'neon') {
    c.fillStyle = '#0b0b14'; c.fillRect(l, top, s, s);
    c.shadowColor = '#ff2bd6'; c.shadowBlur = s * 0.35;
    c.strokeStyle = '#ff2bd6'; c.lineWidth = s * 0.1; c.strokeRect(l + s * 0.05, top + s * 0.05, s * 0.9, s * 0.9);
    c.shadowColor = '#29f0ff'; c.strokeStyle = '#29f0ff'; c.lineWidth = s * 0.05; c.strokeRect(l + s * 0.25, top + s * 0.25, s * 0.5, s * 0.5);
  } else if (skin === 'ice') {
    const g = c.createLinearGradient(l, top, l + s, top + s);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#a6e6ff'); g.addColorStop(1, '#4fb3e8');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    c.fillStyle = 'rgba(255,255,255,.6)';
    c.beginPath(); c.moveTo(l, top); c.lineTo(l + s * 0.55, top); c.lineTo(l, top + s * 0.55); c.fill();
  } else if (skin === 'candy') {
    c.fillStyle = '#ff7ac0'; c.fillRect(l, top, s, s);
    c.beginPath(); c.rect(l, top, s, s); c.clip();
    c.strokeStyle = '#fff'; c.lineWidth = s * 0.12;
    const off = (t * s * 0.4) % (s * 0.5);
    for (let k = -2; k < 5; k++) { const sx = l + k * s * 0.5 + off; c.beginPath(); c.moveTo(sx, top); c.lineTo(sx + s, top + s); c.stroke(); }
  } else if (skin === 'lava') {
    const off = Math.sin(t * 2) * s * 0.4;
    const g = c.createLinearGradient(l, top + off, l + s, top + s + off);
    g.addColorStop(0, '#ffd23f'); g.addColorStop(0.5, '#ff5a00'); g.addColorStop(1, '#a00d00');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    c.strokeStyle = 'rgba(60,0,0,.7)'; c.lineWidth = Math.max(1, s * 0.05);
    c.beginPath(); c.moveTo(l + s * 0.15, top + s * 0.3); c.lineTo(l + s * 0.45, top + s * 0.45); c.lineTo(l + s * 0.4, top + s * 0.8);
    c.moveTo(l + s * 0.45, top + s * 0.45); c.lineTo(l + s * 0.85, top + s * 0.35); c.stroke();
  } else if (skin === 'void') {
    c.fillStyle = '#000'; c.fillRect(l, top, s, s);
    c.shadowColor = '#8b5cf6'; c.shadowBlur = s * (0.25 + 0.15 * Math.sin(t * 3));
    c.strokeStyle = '#fff'; c.lineWidth = Math.max(1, s * 0.05); c.strokeRect(l, top, s, s);
    c.shadowBlur = 0;
    const g = c.createRadialGradient(x, y, 0, x, y, s * 0.4);
    g.addColorStop(0, 'rgba(139,92,246,.8)'); g.addColorStop(1, 'rgba(139,92,246,0)');
    c.fillStyle = g; c.fillRect(l, top, s, s);
  } else if (skin === 'gold') {
    const g = c.createLinearGradient(l, top, l + s, top + s);
    g.addColorStop(0, '#fff6c2'); g.addColorStop(0.45, '#f2c94c'); g.addColorStop(1, '#9a6f00');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    c.beginPath(); c.rect(l, top, s, s); c.clip();
    const sx = l + (((t * 0.6) % 1.6) - 0.3) * s * 2;
    c.fillStyle = 'rgba(255,255,255,.55)';
    c.beginPath(); c.moveTo(sx, top); c.lineTo(sx + s * 0.2, top); c.lineTo(sx - s * 0.3, top + s); c.lineTo(sx - s * 0.5, top + s); c.fill();
  } else if (skin === 'galaxy') {
    const g = c.createRadialGradient(x, y, 0, x, y, s * 0.75);
    g.addColorStop(0, '#7b3fe4'); g.addColorStop(1, '#120526');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    for (const st of STARS) {
      c.globalAlpha = 0.5 + 0.5 * Math.sin(t * 3 + st.p);
      c.fillStyle = '#fff';
      c.fillRect(x + st.x * s * 0.85, y + st.y * s * 0.85, Math.max(1, s * 0.05), Math.max(1, s * 0.05));
    }
  } else if (skin === 'rainbow') {
    const g = c.createLinearGradient(l, top, l + s, top + s);
    for (let i = 0; i <= 4; i++) g.addColorStop(i / 4, `hsl(${(t * 120 + i * 70) % 360}, 90%, 60%)`);
    c.fillStyle = g; c.fillRect(l, top, s, s);
  } else if (skin === 'moai') {
    // A stone head 🗿: heavy brow, deep eyes, long nose, tight lips
    const g = c.createLinearGradient(l, top, l + s, top + s);
    g.addColorStop(0, '#a3a8b0'); g.addColorStop(1, '#5c616a');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    const P = (fx, fy) => [l + fx * s, top + fy * s];
    const poly = (color, ...pts) => { c.fillStyle = color; c.beginPath(); pts.forEach(([fx, fy], i) => c[i ? 'lineTo' : 'moveTo'](...P(fx, fy))); c.fill(); };
    poly('#4a4f57', [0.1, 0.22], [0.9, 0.22], [0.86, 0.33], [0.14, 0.33]);                   // brow shadow
    poly('#b8bdc4', [0.08, 0.15], [0.92, 0.15], [0.9, 0.24], [0.1, 0.24]);                   // brow ridge
    poly('#2b2f35', [0.18, 0.3], [0.41, 0.3], [0.4, 0.38], [0.2, 0.37]);                     // eyes
    poly('#2b2f35', [0.59, 0.3], [0.82, 0.3], [0.8, 0.37], [0.6, 0.38]);
    poly('#7c818a', [0.44, 0.24], [0.56, 0.24], [0.66, 0.66], [0.34, 0.66]);                 // nose shadow side
    poly('#aeb3ba', [0.44, 0.24], [0.52, 0.24], [0.56, 0.62], [0.36, 0.64]);                 // nose lit side
    poly('#3d4148', [0.34, 0.64], [0.66, 0.64], [0.62, 0.69], [0.38, 0.69]);                 // under the nose
    poly('#8b9098', [0.3, 0.74], [0.7, 0.74], [0.68, 0.8], [0.32, 0.8]);                     // upper lip
    poly('#2b2f35', [0.31, 0.8], [0.69, 0.8], [0.68, 0.825], [0.32, 0.825]);                 // mouth
    poly('#8b9098', [0.33, 0.825], [0.67, 0.825], [0.64, 0.88], [0.36, 0.88]);               // lower lip
    poly('rgba(0,0,0,.25)', [0, 0.9], [1, 0.9], [1, 1], [0, 1]);                             // chin shadow
  } else if (skin === 'champion' && championImg.complete && championImg.naturalWidth) {
    // Pick the copy that matches the real pixels on screen
    const px = s * Math.hypot(c.getTransform().a, c.getTransform().b);
    c.imageSmoothingQuality = 'high';
    c.drawImage(championAt(px), l, top, s, s);
    // A thin gold frame just outside the photo, so none of the face is covered
    const lw = Math.max(1, s * 0.035);
    c.shadowColor = '#facc15'; c.shadowBlur = s * (0.12 + 0.08 * Math.sin(t * 3));
    c.strokeStyle = '#facc15'; c.lineWidth = lw; c.strokeRect(l - lw / 2, top - lw / 2, s + lw, s + lw);
  } else if (skin === 'champion') {
    const g = c.createLinearGradient(l, top, l + s, top + s);
    g.addColorStop(0, '#7c3aed'); g.addColorStop(1, '#1e0a3c');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    const lw = Math.max(1, s * 0.08);
    c.strokeStyle = '#facc15'; c.lineWidth = lw; c.strokeRect(l + lw / 2, top + lw / 2, s - lw, s - lw);
    // A crown
    const cw = s * 0.56, ch = s * 0.3, cl = x - cw / 2, cb = y + s * 0.14;
    c.fillStyle = '#facc15'; c.shadowColor = '#facc15'; c.shadowBlur = s * (0.1 + 0.08 * Math.sin(t * 3));
    c.beginPath(); c.moveTo(cl, cb); c.lineTo(cl, cb - ch); c.lineTo(cl + cw * 0.27, cb - ch * 0.5); c.lineTo(x, cb - ch * 1.25);
    c.lineTo(cl + cw * 0.73, cb - ch * 0.5); c.lineTo(cl + cw, cb - ch); c.lineTo(cl + cw, cb); c.closePath(); c.fill();
    c.fillRect(cl, cb + s * 0.05, cw, s * 0.08);
  } else { c.fillStyle = '#fff'; c.fillRect(l, top, s, s); }
  c.restore();
}
function drawStaticSkins(root) {
  root.querySelectorAll('canvas[data-skin]').forEach(cv => {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    drawSkin(c, cv.width / 2, cv.height / 2, cv.width, cv.dataset.skin, 0);

}

function drawCube(p, ghost) {
  const s = sizeOf(p), h = s / 2;
  ctx.save();
  if (ghost) ctx.globalAlpha = 0.5;
  if (p.dash > 0) {
    for (let k = 3; k >= 1; k--) {
      ctx.globalAlpha = 0.12 * (4 - k);
      drawSkin(ctx, p.x - p.vx * 0.02 * k, p.y - p.vy * 0.02 * k, s, p.skin, clock);
    }
    ctx.globalAlpha = 1;
  }
  drawSkin(ctx, p.x, p.y, s, p.skin, clock);
  if (p.flash > 0) { ctx.fillStyle = `rgba(255,60,60,${p.flash / 0.15 * 0.6})`; ctx.fillRect(p.x - h, p.y - h, s, s); }
  if (p.frozen > 0) {
    ctx.fillStyle = 'rgba(160,225,255,.55)'; ctx.fillRect(p.x - h, p.y - h, s, s);
    ctx.strokeStyle = '#dff6ff'; ctx.lineWidth = 2; ctx.strokeRect(p.x - h - 3, p.y - h - 3, s + 6, s + 6);
  }
  if (p.shield > 0) {
    ctx.strokeStyle = POWERS.shield.color; ctx.lineWidth = 3;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 12);
    ctx.beginPath(); ctx.arc(p.x, p.y, s * 0.95, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.font = `bold ${Math.round(15 * Math.max(U, 0.8))}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = p.color;
  ctx.fillText(fitText(p.name, Math.max(110, s * 2.4)), p.x, p.y - h - 12);
  const bw = s + 10;
  ctx.fillStyle = '#333'; ctx.fillRect(p.x - bw / 2, p.y - h - 9, bw, 5);
  ctx.fillStyle = p.color; ctx.fillRect(p.x - bw / 2, p.y - h - 9, bw * p.hp / p.maxHp, 5);
}

function drawSpikes(c, p) {
  const spikes = getSpikes(p), def = SPIKES[p.spike];
  c.save();
  if (p.rage > 0) { c.shadowColor = POWERS.rage.color; c.shadowBlur = 16; }
  for (const s of spikes) {
    if (s.kind === 'tri') {
      const [t, l, r] = triPoints(s);
      c.fillStyle = p.color;
      c.beginPath(); c.moveTo(t.x, t.y); c.lineTo(l.x, l.y); c.lineTo(r.x, r.y); c.closePath(); c.fill();
    } else if (s.kind === 'saw') {
      const teeth = 10, rot = p.angle * 3;
      c.fillStyle = p.color;
      c.beginPath();
      for (let i = 0; i < teeth * 2; i++) {
        const a = rot + i * Math.PI / teeth, rr = i % 2 ? s.r * 0.7 : s.r;
        c.lineTo(s.x + Math.cos(a) * rr, s.y + Math.sin(a) * rr);
      }
      c.closePath(); c.fill();
      c.fillStyle = '#000'; c.beginPath(); c.arc(s.x, s.y, s.r * 0.25, 0, Math.PI * 2); c.fill();
    } else {
      // Comet: fading trail behind the fireball
      for (let k = 6; k >= 1; k--) {
        const tp = spikeAt(p, s.a - p.spin * k * 0.07);
        c.globalAlpha = 0.5 * (1 - k / 7);
        c.fillStyle = p.color;
        c.beginPath(); c.arc(tp.x, tp.y, s.r * (1 - k / 9), 0, Math.PI * 2); c.fill();
      }
      c.globalAlpha = 1;
      const g = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
      g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ffd23f'); g.addColorStop(1, p.color);
      c.fillStyle = g; c.beginPath(); c.arc(s.x, s.y, s.r, 0, Math.PI * 2); c.fill();
    }
  }
  c.restore();
  c.strokeStyle = 'rgba(255,255,255,0.08)'; c.lineWidth = 1;
  c.beginPath(); c.arc(p.x, p.y, orbitOf(p) * def.orbit, 0, Math.PI * 2); c.stroke();
}

// Shorten text with "…" so it fits a width, keeping the ending (the HP number) visible
function fitText(text, width, keep = '') {
  if (ctx.measureText(text).width <= width) return text;
  let head = text.slice(0, text.length - keep.length);
  while (head.length > 1 && ctx.measureText(head + '…' + keep).width > width) head = head.slice(0, -1);
  return head + '…' + keep;
}

function drawHud() {
  const bw = Math.min(320, W / 2 - 40);
  const top = 12 + safeTop;
  players.forEach((p, i) => {
    const x = i === 0 ? 16 : W - 16 - bw;
    ctx.fillStyle = '#222'; ctx.fillRect(x, top, bw, 22);
    const w = bw * p.hp / p.maxHp, lag = bw * Math.max(p.hp, p.hpLag) / p.maxHp;
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fillRect(i === 0 ? x : x + bw - lag, top, lag, 22);
    const low = p.hp > 0 && p.hp / p.maxHp < 0.25;
    ctx.globalAlpha = low ? 0.65 + 0.35 * Math.sin(clock * 10) : 1;
    ctx.fillStyle = p.color;
    ctx.fillRect(i === 0 ? x : x + bw - w, top, w, 22);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = i === 0 ? 'left' : 'right';
    ctx.fillText(fitText(`${p.name}  ${p.hp}`, bw - 12, `  ${p.hp}`), i === 0 ? x + 6 : x + bw - 6, top + 11);
  });
}

const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
function drawPowerButtons() {
  [myIdx(), 1 - myIdx()].forEach((pi, i) => {
    const p = players[pi], def = POWERS[p.power];
    const ready = p.powerCd <= 0 && p.frozen <= 0;
    // Yours is a big button; the other player's is a small read-only indicator in the corner
    const big = buttons[i], mine = i === 0;
    const r = mine ? big.r : big.r * 0.6;
    const b = { x: mine ? big.x : big.x + big.r - r, y: big.y + big.r - r, r };
    ctx.save();
    ctx.globalAlpha = mine ? 1 : 0.6;
    ctx.fillStyle = '#121216';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    // Recharge ring
    const frac = 1 - p.powerCd / def.cd;
    ctx.strokeStyle = ready ? def.color : '#555'; ctx.lineWidth = mine ? 5 : 3;
    if (ready && mine) { ctx.shadowColor = def.color; ctx.shadowBlur = 10 + 6 * Math.sin(clock * 6); }
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = ready ? '#fff' : '#888';
    ctx.font = `bold ${Math.round(b.r * 0.36)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(def.name, b.x, b.y - (ready ? 0 : b.r * 0.15));
    if (!ready) {
      ctx.font = `${Math.round(b.r * 0.3)}px system-ui, sans-serif`;
      ctx.fillText(Math.ceil(Math.max(p.powerCd / mods.powerRate, p.frozen)) + 's', b.x, b.y + b.r * 0.28);
    }
    ctx.fillStyle = p.color; ctx.font = 'bold 11px system-ui, sans-serif';
    const label = i === 1 ? (online ? 'Their power' : 'CPU power') : coarse ? 'Your power' : 'Your power · A / Space';
    if (label) ctx.fillText(label, b.x, b.y - b.r - 10);
    ctx.restore();
  });
}

function drawAimArrow(p) {
  const dx = mouse.x - p.x, dy = mouse.y - p.y;
  const l = Math.hypot(dx, dy) || 1;
  const ex = p.x + dx / l * 110 * U, ey = p.y + dy / l * 110 * U;
  ctx.strokeStyle = p.color; ctx.fillStyle = p.color; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(ex, ey); ctx.stroke();
  const a = Math.atan2(dy, dx);
  ctx.beginPath();
  ctx.moveTo(ex + Math.cos(a) * 14, ey + Math.sin(a) * 14);
  ctx.lineTo(ex + Math.cos(a + 2.5) * 14, ey + Math.sin(a + 2.5) * 14);
  ctx.lineTo(ex + Math.cos(a - 2.5) * 14, ey + Math.sin(a - 2.5) * 14);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 1;
}

// Animated previews on the setup screen and in the shop
function drawPreviews() {
  document.querySelectorAll('#bigPreview').forEach(cv => {
    const size = cv.clientWidth || 150;
    if (cv.width !== size * DPR) { cv.width = size * DPR; cv.height = size * DPR; }
    const c = cv.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = '#000'; c.fillRect(0, 0, size, size);
    const i = myIdx(), lo = myLoadout();
    const fake = { x: size / 2, y: size / 2, unit: 0.42 * size / 150, spike: lo.spike, skin: lo.skin, color: COLORS[i], angle: clock * SPIKES[lo.spike].spin * (i ? -1 : 1), spin: i ? -1 : 1, rage: 0 };
    if (!towerSetup) drawSpikes(c, fake);
    drawSkin(c, size / 2, size / 2, sizeOf(fake), lo.skin, clock);
  });
}
// The live preview on the Play tab: your cube against a rival, bouncing on their own
let demo = null, demoClock = 0;
function drawDemo() {
  const cv = $('demo');
  if (!cv) return;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w) return;
  if (cv.width !== Math.round(w * DPR)) { cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR); demo = null; }
  const c = cv.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const unitD = Math.min(0.4, h / 440), size = 64 * unitD, sp = 150, m = 130 * unitD * 0.8;   // m: keep the spikes inside the box
  if (!demo) {
    demo = [
      { x: w * 0.3, y: h * 0.4, vx: sp, vy: sp * 0.7, angle: 0, spin: 1, color: COLORS[0], hit: 0 },
      { x: w * 0.7, y: h * 0.6, vx: -sp * 0.8, vy: -sp * 0.6, angle: Math.PI, spin: -1, color: COLORS[1], hit: 0, skin: 'neon', spike: 'comet' },
    ];
  }
  const dt = Math.min(0.033, Math.max(0, clock - demoClock)); demoClock = clock;
  demo[0].skin = myLoadout().skin; demo[0].spike = myLoadout().spike;
  for (const d of demo) {
    Object.assign(d, { unit: unitD, rage: 0 });
    d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.x < m) { d.x = m; d.vx = Math.abs(d.vx); }
    if (d.x > w - m) { d.x = w - m; d.vx = -Math.abs(d.vx); }
    if (d.y < m) { d.y = m; d.vy = Math.abs(d.vy); }
    if (d.y > h - m) { d.y = h - m; d.vy = -Math.abs(d.vy); }
    d.angle += SPIKES[d.spike].spin * d.spin * dt;
    d.hit = Math.max(0, d.hit - dt);
  }
  const [a, b] = demo;
  if (Math.abs(a.x - b.x) < size && Math.abs(a.y - b.y) < size) { [a.vx, b.vx] = [b.vx, a.vx]; [a.vy, b.vy] = [b.vy, a.vy]; }
  // Spike hits flash the other cube
  for (const [atk, tgt] of [[a, b], [b, a]]) if (getSpikes(atk).some(sk => spikeHitsBox(sk, tgt))) tgt.hit = 0.12;
  c.fillStyle = '#050507'; c.fillRect(0, 0, w, h);
  for (const d of demo) drawSpikes(c, d);
  for (const d of demo) {
    drawSkin(c, d.x, d.y, size, d.skin, clock);
    if (d.hit > 0) { c.fillStyle = `rgba(255,60,60,${d.hit / 0.12 * 0.6})`; c.fillRect(d.x - size / 2, d.y - size / 2, size, size); }
  }
}

function drawShop() {
  document.querySelectorAll('canvas[data-skin-anim]').forEach(cv => {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    drawSkin(c, cv.width / 2, cv.height / 2, cv.width * 0.6, cv.dataset.skinAnim, clock);
  });
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (!$('setup').classList.contains('hidden')) drawPreviews();
  if (!$('app').classList.contains('hidden') && tab === 'shop') drawShop();
  if (!$('app').classList.contains('hidden') && tab === 'play') drawDemo();
  if (!players.length) return;

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // The room's border heats up from white to orange as the match speeds up
  const heat = state === 'play' || state === 'over' ? Math.min(1, elapsed / 75) : 0;
  const edge = isEvent ? '192,132,252' : `255,${Math.round(255 - 120 * heat)},${Math.round(255 - 215 * heat)}`;
  ctx.strokeStyle = `rgba(${edge},${0.35 + 0.4 * heat})`;
  ctx.shadowColor = `rgb(${edge})`; ctx.shadowBlur = 4 + 14 * heat;
  ctx.lineWidth = 2;
  ctx.strokeRect(AX - 1, AY - 1, AS + 2, AS + 2);
  ctx.lineWidth = 1; ctx.shadowBlur = 0;
  for (const r of rings) {
    ctx.globalAlpha = r.life / 0.35; ctx.strokeStyle = r.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.lineWidth = 1;

  for (const p of players) if (p.placed) drawSpikes(ctx, p);
  for (const p of players) if (p.placed) drawCube(p);

  if (state === 'place') {
    const pos = clampPos(mouse.x, mouse.y);
    drawCube({ ...players[placing], x: pos.x, y: pos.y }, true);
  }
  if (state === 'aim') drawAimArrow(players[placing]);

  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life * 2);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  for (const pp of popups) {
    ctx.globalAlpha = Math.min(1, pp.life * 2);
    const size = pp.big ? 24 * Math.max(U, 0.8) : pp.dmgOf ? (15 + 4 * Math.min(pp.n, 10) / 10) * Math.max(U, 0.8) * (1 + (pp.pop || 0) * 0.35) : 18;
    ctx.fillStyle = pp.color; ctx.font = `${pp.dmgOf ? 900 : 'bold'} ${Math.round(size)}px system-ui, sans-serif`; ctx.textAlign = 'center';
    ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHud();
  if (state === 'play' || state === 'countdown') drawPowerButtons();
  if (koT > 0) {
    // K.O.! — a white flash, then the word punches in
    if (koT > 1.05) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.7, (koT - 1.05) * 4)})`; ctx.fillRect(0, 0, W, H); }
    const t = 1.3 - koT, sc = t < 0.15 ? 2 - t / 0.15 : 1;
    ctx.save();
    ctx.translate(W / 2, AY + AS / 2); ctx.scale(sc, sc);
    ctx.font = `900 ${Math.round(96 * Math.max(U, 0.7))}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = Math.min(1, koT * 3);
    ctx.lineWidth = 10; ctx.strokeStyle = koColor; ctx.strokeText(koText, 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillText(koText, 0, 0);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (state === 'countdown' || goFlash > 0) {
    const n = state === 'countdown' ? Math.ceil(countdown / 0.8) : 0;
    ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(90 * U)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = n > 0 ? 0.9 : Math.min(0.9, goFlash * 2);
    ctx.fillText(n > 0 ? n : 'GO!', W / 2, H / 2);
    ctx.globalAlpha = 1;
  }
}

// ============================================================================
// The Tower: climb a randomly built tower. Everyone gets the same tower for a week.
// ============================================================================
const TW = 420;                   // tower width in world units (y goes up)
const T_CUBE = 26, T_PLAT_H = 14;
const T_GRAV = 1500, T_JUMP = 560, T_BOUNCE = 840, T_RUN = 200;
const T_STAGE_H = 1250;
const TOWER_CLEAR_COINS = 500, TOWER_PRIZE_COINS = 2000;
const TOWER_COIN_MS = 300000;     // the 500 coins need a climb of 5:00 or less
const TOWER_HP = 100, SPIKE_DMG = 10;
const TOWER_MIN_MS = 120000;      // no real climb is faster than this (the server checks it too)
const WEEK_MS = 7 * 864e5, WEEK0 = Date.UTC(2024, 0, 1);   // tower weeks start Monday 00:00 UTC
const towerWeek = (t = Date.now()) => Math.floor((t - WEEK0) / WEEK_MS);
const towerWeekEnds = w => WEEK0 + (w + 1) * WEEK_MS;
const TOWER_STAGES = [
  { name: 'First Steps', color: '#4ade80', feats: [] },
  { name: 'On the Move', color: '#2dd4bf', feats: ['move'] },
  { name: 'Crumble', color: '#38bdf8', feats: ['crumble', 'move'] },
  { name: 'Spike Alley', color: '#60a5fa', feats: ['spikes', 'move'] },
  { name: 'Bounce House', color: '#818cf8', feats: ['bounce', 'crumble', 'spikes'] },
  { name: 'Elevators', color: '#a78bfa', feats: ['lift', 'move', 'spikes'] },
  { name: 'Black Ice', color: '#c084fc', feats: ['ice', 'spikes', 'crumble'] },
  { name: 'Conveyors', color: '#e879f9', feats: ['belt', 'spikes', 'move'] },
  { name: 'Blinkers', color: '#f472b6', feats: ['blink', 'move', 'spikes'] },
  { name: 'Chaos', color: '#fb7185', feats: ['move', 'crumble', 'spikes', 'bounce'] },
  { name: 'Hot Steps', color: '#f87171', feats: ['blink', 'ice', 'lift', 'spikes'] },
  { name: 'Storm', color: '#fb923c', feats: ['belt', 'spikes', 'move', 'blink'] },
  { name: 'Razor Edge', color: '#fbbf24', feats: ['spikes', 'crumble', 'move', 'ice'] },
  { name: 'Last Stand', color: '#facc15', feats: ['crumble', 'lift', 'ice', 'bounce', 'spikes', 'blink'] },
  { name: 'Summit', color: '#fde68a', feats: ['move', 'crumble', 'spikes', 'blink', 'ice', 'belt', 'lift', 'bounce'] },
];
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, to, step) => (v < to ? Math.min(to, v + step) : Math.max(to, v - step));
const fmtTime = ms => { const ts = Math.floor(ms / 100), m = Math.floor(ts / 600); return `${m}:${((ts % 600) / 10).toFixed(1).padStart(4, '0')}`; };

// Time in the air before landing dy above the take-off point (0 if that's too high)
function tAir(dy, v = T_JUMP) {
  const disc = v * v - 2 * T_GRAV * dy;
  return disc < 0 ? 0 : (v + Math.sqrt(disc)) / T_GRAV;
}

// Builds the week's tower. Every platform can be reached from the one before it,
// and later stages use smaller platforms, longer jumps and more tricks.
function buildTower(week) {
  const rnd = seeded('tower-' + week), R = (a, b) => a + (b - a) * rnd();
  const last = TOWER_STAGES.length - 1;
  const plats = [], bounds = [-Infinity];
  const add = o => { const p = { h: T_PLAT_H, dx: 0, safe: [0, o.w], ...o }; p.x0 = p.x; p.y0 = p.y; p.py = p.y; plats.push(p); return p; };
  let prev = add({ type: 'floor', x: 0, y: 0, w: TW, stage: 0 });
  let dir = rnd() < 0.5 ? 1 : -1;

  function place(type, s) {
    const d = s / last;
    const v = prev.type === 'bounce' ? T_BOUNCE : T_JUMP;
    const dy = v === T_BOUNCE ? R(130, 160 + 45 * d) : R(lerp(46, 68, d), lerp(66, 90, d));
    let w = lerp(100, 40, d) * R(0.85, 1.15);
    if (type === 'ice') w *= 1.35;
    if (type === 'belt') w *= 1.15;
    if (type === 'bounce') w = 48;
    if (type === 'ledge') w = 170;
    if (type === 'summit') w = 130;
    w = Math.max(34, Math.round(w));
    // Spike strips: always on 'spikes' platforms, and from stage 4 they turn up on ordinary ones too
    const spiky = type === 'spikes' || (s >= 3 && ['solid', 'move', 'crumble', 'ice'].includes(type) && rnd() < lerp(0.1, 0.4, d));
    const spikes = spiky ? Math.round(R(26, 46)) : 0;
    let k = Math.min(0.88, lerp(0.42, 0.84, d) * R(0.85, 1.1));
    if (type === 'ledge' || type === 'summit') k *= 0.5;
    const gap = T_RUN * tAir(dy, v) * k;
    if (rnd() < 0.3) dir = -dir;
    const pL = prev.x + prev.safe[0], pR = prev.x + prev.safe[1];
    // Spikes go on the far side, so you land on the safe part
    const at = dd => {
      const safe = spikes ? (dd > 0 ? [0, w] : [spikes, spikes + w]) : [0, w];
      return { safe, x: dd > 0 ? pR + gap - safe[0] : pL - gap - safe[1] };
    };
    const total = w + spikes, lo = 6, hi = TW - 6 - total;
    let o = at(dir);
    if (prev.type === 'floor') o = { safe: at(1).safe, x: R(lo, hi) };
    else if (o.x < lo || o.x > hi) { dir = -dir; o = at(dir); }
    o.x = Math.max(lo, Math.min(hi, o.x));
    const p = { type, x: o.x, y: prev.y + dy, w: total, safe: o.safe, stage: s };
    if (spikes) p.spike = dir > 0 ? [w, total] : [0, spikes];
    if (type === 'move') {
      p.amp = Math.min(R(30, 65), p.x - lo, hi - p.x);
      if (p.amp < 14) p.type = 'solid';
      p.spd = Math.PI * 2 / R(lerp(3.6, 2.2, d), lerp(4.6, 3.2, d)); p.ph = R(0, Math.PI * 2);
    }
    if (type === 'lift') { p.amp = R(40, 70); p.spd = Math.PI * 2 / R(lerp(3.6, 2.4, d), lerp(4.2, 3.2, d)); p.ph = R(0, Math.PI * 2); }
    if (type === 'blink') { p.per = R(2.4, 3.2); p.on = p.per * R(lerp(0.65, 0.5, d), lerp(0.72, 0.58, d)); p.ph = R(0, p.per); }
    if (type === 'crumble') p.crt = lerp(0.6, 0.35, d);   // seconds before it falls
    if (type === 'belt') p.belt = (rnd() < 0.5 ? -1 : 1) * R(55, 90);
    prev = add(p);
    return prev;
  }

  for (let s = 0; s <= last; s++) {
    const st = TOWER_STAGES[s], top = (s + 1) * T_STAGE_H;
    if (s > 0) { place('ledge', s).label = true; bounds.push(prev.y - 20); }
    for (let n = 0; prev.y < top - 110; n++) {
      let type = 'solid';
      if (st.feats.length && (n === 0 || rnd() < lerp(0.4, 0.8, s / last))) type = n === 0 ? st.feats[0] : st.feats[Math.floor(rnd() * st.feats.length)];
      if (type === 'bounce' && prev.type === 'bounce') type = 'solid';
      place(type, s);
    }
  }
  place('summit', last);
  return { plats, bounds, top: prev.y };
}

let tower = null;            // the climb in progress
let towerSetup = false;      // the setup screen is showing the Tower
let towerLbCache = null;
const towerPtrs = new Map(); // touch pointers: L, R or J

function openTower() {
  matchName = ''; renaming = false;
  show('setup');
  towerSetup = true;
  renderTowerSetup();
}
function renderTowerSetup() {
  const lo = myLoadout(), owned = ownedSkins(), week = towerWeek();
  if (!owned.includes(lo.skin)) lo.skin = 'classic';

  const skins = SKINS.filter(x => owned.includes(x.id)).map(x =>
    `<button class="tile ${lo.skin === x.id ? 'on' : ''}" data-kind="skin" data-id="${x.id}"><canvas width="72" height="72" data-skin="${x.id}"></canvas>${x.name}</button>`).join('');
  const cleared = me && me.tower.week === week && me.tower.cleared;

    <div class="tower-info">
      <p><b>Climb ${TOWER_STAGES.length} stages to the top.</b> No checkpoints: if you fall, you fall. Every stage is harder than the last.</p>
      <p class="fine">${coarse ? 'Hold ◀ ▶ to move and tap anywhere else to jump.' : 'Move with ← → or A / D. Jump with Space, ↑ or W.'}</p>
      <p class="fine">You have <b>${TOWER_HP} HP</b>. Every spike takes ${SPIKE_DMG}, and it never heals.</p>
      <p class="fine">${cleared ? "You already won this week's coins. Climb again to beat your time." : `Climb it in 5:00 or less: ${coinHtml(TOWER_CLEAR_COINS)} (once a week)`}<br>
        Fastest climb of the week wins ${coinHtml(TOWER_PRIZE_COINS)} and the <b>Alvin Cube</b> skin.</p>
      <p class="fine desk-only">Press <b>Enter</b> to start.</p>
    </div></div>
    <div class="setup-right"><div><div class="section-label">Your cube</div><div class="picker">${skins}</div></div>
    <div><div class="section-label">Fastest this week</div><div id="towerLb" class="lb">${me ? '<p class="fine">Loading…</p>'
      : '<p class="fine">Log in to save your time and join the weekly tournament.</p>'}</div></div></div>`;
  drawStaticSkins($('setupBody'));
  const go = $('startBtn');
  go.textContent = 'Start climb'; go.disabled = false;
