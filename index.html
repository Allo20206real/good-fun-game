function startTower() {
  const week = towerWeek(), built = buildTower(week);
  const floor = built.plats[0];
  tower = {
    week, ...built, cam: -200, movers: built.plats.filter(p => p.type === 'move' || p.type === 'lift'),
    timed: built.plats.filter(p => p.type === 'crumble'), spiky: built.plats.filter(p => p.spike),
    p: { x: TW / 2, y: 0, vx: 0, vy: 0, on: floor, coyote: 0, buffer: 0, stun: 0, inv: 0, squash: 0, hp: TOWER_HP, skin: myLoadout().skin },
    hpLag: TOWER_HP, hpFlash: 0,
    keys: { L: false, R: false, J: false }, in: { L: false, R: false, J: false },
    time: 0, clock: 0, started: false, done: false, sc: 1, maxY: 0, topStage: 0,
    banner: null, parts: [], hurt: 0, quitAsk: 0, ranked: false,
  };
  const t = tower;
  t.runReady = me && !needsUsername
    ? startTowerRun(week).then(() => (t.ranked = true), () => { if (tower === t) toast("Couldn't save the start of this climb, so it won't count for the tournament."); return false; })
    : Promise.resolve(false);
  mode = 'tower'; state = 'tower';
  towerPtrs.clear();
  native({ type: 'awake', on: true });
  screens.forEach(s => $(s).classList.add('hidden'));
  $('quitBtn').classList.remove('hidden');
  updateHint();
}

const towerSolid = (t, pl) => !pl.gone && (pl.type !== 'blink' || (t.time + pl.ph) % pl.per < pl.on);
function towerJump() { if (tower) { tower.p.buffer = 0.12; tower.started = true; } }

function towerUpdate(dt) {
  const t = tower;
  clock += dt;
  if (state === 'tower' && t.started && !t.done) t.clock += dt;
  const held = [...towerPtrs.values()];
  t.in = state === 'tower'
    ? { L: t.keys.L || held.includes('L'), R: t.keys.R || held.includes('R'), J: t.keys.J || held.includes('J') }
    : { L: false, R: false, J: false };
  for (let i = 0; i < 4; i++) towerStep(t, dt / 4);
  // On phones the floor starts above the ◀ ▶ buttons
  const target = Math.max(-(H / t.sc) * (coarse ? 0.2 : 0.06), t.p.y - (H / t.sc) * 0.4);
  t.cam += (target - t.cam) * Math.min(1, dt * 7);
  t.p.squash += (0 - t.p.squash) * Math.min(1, dt * 12);
  t.hurt = Math.max(0, t.hurt - dt);
  t.hpFlash = Math.max(0, t.hpFlash - dt);
  t.hpLag = Math.max(t.p.hp, t.hpLag - 25 * dt);
  if (t.banner) { t.banner.life -= dt; if (t.banner.life <= 0) t.banner = null; }
  for (const q of t.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy -= 900 * dt; q.life -= dt; }
  t.parts = t.parts.filter(q => q.life > 0);
}

function towerDust(t, x, y, color, n, up = 120) {
  for (let i = 0; i < n && t.parts.length < 200; i++) {
    t.parts.push({ x, y, vx: (Math.random() - 0.5) * 260, vy: Math.random() * up, life: 0.3 + Math.random() * 0.3, color });
  }
}

// One physics step for the climber (also used by the tests with a made-up tower)
function towerStep(t, dt) {
  t.time += dt;
  for (const pl of t.movers) {
    const ox = pl.x, oy = pl.y;
    if (pl.type === 'move') pl.x = pl.x0 + pl.amp * Math.sin(t.time * pl.spd + pl.ph);
    else pl.y = pl.y0 - pl.amp * (0.5 - 0.5 * Math.cos(t.time * pl.spd + pl.ph));
    pl.dx = pl.x - ox; pl.py = oy;
  }
  for (const pl of t.timed) {
    if (pl.cr > 0) { pl.cr -= dt; if (pl.cr <= 0) { pl.cr = 0; pl.gone = 2.6; } }
    else if (pl.gone > 0) { pl.gone -= dt; if (pl.gone <= 0) pl.gone = 0; }
  }
  const p = t.p, hw = T_CUBE / 2;
  p.stun = Math.max(0, p.stun - dt);
  const dir = p.stun > 0 ? 0 : (t.in.R ? 1 : 0) - (t.in.L ? 1 : 0);
  if (dir) t.started = true;
  const g = p.on, ice = g && g.type === 'ice';
  const acc = g ? (ice ? 520 : dir ? 2600 : 3400) : dir ? 1900 : 500;
  p.vx = approach(p.vx, dir * T_RUN, acc * dt);
  p.buffer -= dt;
  p.coyote = g ? 0.09 : p.coyote - dt;
  if ((p.buffer > 0 || (t.in.J && g)) && p.coyote > 0 && p.stun <= 0) {
    p.vy = T_JUMP; p.on = null; p.coyote = 0; p.buffer = 0; p.squash = -0.22;
    t.started = true;
    sfx(520, 0.05, 'square', 0.025, 1.4);
  }
  if (p.on) p.x += p.on.dx + (p.on.belt || 0) * dt;
  const oy = p.y;
  p.x += p.vx * dt;
  if (!p.on) { p.vy = Math.max(p.vy - T_GRAV * dt, -1100); p.y += p.vy * dt; }
  if (p.x < hw) { p.x = hw; p.vx = Math.max(0, p.vx); }
  if (p.x > TW - hw) { p.x = TW - hw; p.vx = Math.min(0, p.vx); }
  if (p.on) {
    const pl = p.on;
    if (!towerSolid(t, pl) || p.x + hw <= pl.x || p.x - hw >= pl.x + pl.w) { p.on = null; p.vy = 0; }
    else p.y = pl.y;
  }
  if (!p.on && p.vy <= 0) {
    for (const pl of t.plats) {
      if (pl.y < p.y || pl.py > oy + 0.5) continue;
      if (p.x + hw <= pl.x || p.x - hw >= pl.x + pl.w || !towerSolid(t, pl)) continue;
      towerLand(t, pl, -p.vy);
      break;
    }
  }
  // Spikes knock you away
  p.inv = Math.max(0, p.inv - dt);
  if (p.inv <= 0 && p.hp > 0) {
    for (const pl of t.spiky) {
      if (!towerSolid(t, pl)) continue;
      const a = pl.x + pl.spike[0], b = pl.x + pl.spike[1];
      if (p.x + hw - 3 > a && p.x - hw + 3 < b && p.y < pl.y + 11 && p.y + T_CUBE > pl.y) {
        p.on = null; p.stun = 0.4; p.inv = 1; p.vy = 360; p.vx = (p.x < (a + b) / 2 ? -1 : 1) * 260;
        p.hp = Math.max(0, p.hp - SPIKE_DMG);
        t.hurt = 0.3; t.hpFlash = 0.5;
        if (p.hp <= 0 && t === tower) towerDead();
        towerDust(t, p.x, p.y + hw, '#ff4d5e', 12, 200);
        sfx(120, 0.14, 'sawtooth', 0.05, 0.5); buzz('medium');
        break;
      }
    }
  }
  if (p.y > t.maxY) t.maxY = p.y;
  let stage = 0;
  while (stage + 1 < t.bounds.length && p.y >= t.bounds[stage + 1]) stage++;
  t.stage = stage;
  if (stage > t.topStage) {
    t.topStage = stage;
    t.banner = { stage, life: 2.4 };
    [523, 659, 784].forEach((f, i) => setTimeout(() => sfx(f, 0.12, 'square', 0.035), i * 90));
    buzz('success');
  }
}

function towerLand(t, pl, speed) {
  const p = t.p;
  p.on = pl; p.y = pl.y; p.vy = 0;
  if (speed > 350) {
    p.squash = Math.min(0.32, speed / 2600);
    towerDust(t, p.x, p.y, 'rgba(255,255,255,.8)', Math.min(10, Math.round(speed / 100)));
    if (speed > 700) buzz('light');
  }
  if (pl.type === 'bounce') {
    p.on = null; p.vy = T_BOUNCE; pl.boing = t.time;
    sfx(300, 0.15, 'square', 0.04, 2.5); buzz('light');
  }
  if (pl.type === 'crumble' && !pl.cr && !pl.gone) { pl.cr = pl.crt; sfx(180, 0.08, 'triangle', 0.03); }
  if (pl.type === 'summit' && t === tower) finishTower();
}

function finishTower() {
  const t = tower;
  if (t.done) return;
  t.done = true; state = 'towerDone';
  const ms = Math.round(t.clock * 1000);
  for (let i = 0; i < 4; i++) towerDust(t, t.p.x, t.p.y + 20, TOWER_STAGES[i * 4 % TOWER_STAGES.length].color, 30, 600);
  [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => sfx(f, 0.18, 'square', 0.04), i * 120));
  buzz('success');
  native({ type: 'awake', on: false });
  $('quitBtn').classList.add('hidden');
  setTimeout(() => { if (tower === t) screens.forEach(x => $(x).classList.toggle('hidden', x !== 'over')); }, 1600);
  showTowerResult(t, ms);
}

// Out of HP: the climb is over
function towerDead() {
  const t = tower;
  if (t.done) return;
  t.done = true; state = 'towerDone';
  towerDust(t, t.p.x, t.p.y + T_CUBE / 2, '#ff4d5e', 40, 500);
  sfx(200, 0.5, 'sawtooth', 0.05, 0.3); buzz('error');
  native({ type: 'awake', on: false });
  $('quitBtn').classList.add('hidden');
  const text = $('winText');
  text.textContent = 'Out of HP!'; text.style.color = '#ff4d5e';
  $('againBtn').textContent = 'Try again'; $('againBtn').disabled = false;
  const pct = Math.min(100, Math.round(t.maxY / t.top * 100));
  $('results').innerHTML = `<div class="line">You made it to <b>stage ${t.topStage + 1}</b> of ${TOWER_STAGES.length} (${pct}% of the way up) in ${fmtTime(t.clock * 1000)}.</div>
    <div class="fine">Every spike takes ${SPIKE_DMG} HP. Watch out for the red ones!</div>`;
  setTimeout(() => { if (tower === t) screens.forEach(x => $(x).classList.toggle('hidden', x !== 'over')); }, 1300);
}

async function showTowerResult(t, ms) {
  const text = $('winText');
  text.textContent = 'You reached the top!'; text.style.color = '#facc15';
  $('againBtn').textContent = 'Climb again';
  const results = $('results'), lines = [`<div class="tower-time">${fmtTime(ms)}</div>`];
  if (!me) {
    lines.push(`<div class="line"><b>Log in</b> to save your time, win ${coinHtml(TOWER_CLEAR_COINS)} for a climb under 5 minutes and join the weekly tournament.</div>`);
    results.innerHTML = lines.join('');
    return;
  }
  results.innerHTML = lines.join('') + '<div class="fine">Saving…</div>';
  $('againBtn').disabled = true;
  try {
    const r = await saveTowerRun(t, ms);
    if (r.newBest) lines.push('<div class="line"><b class="up">New best time!</b></div>');
    else if (r.best < ms) lines.push(`<div class="line">Your best this week: <b>${fmtTime(r.best)}</b></div>`);
    if (r.coins) lines.push(`<div class="line"><span class="up">+${r.coins}</span> ${coinHtml('')} coins for climbing it in under 5 minutes!</div>`);
    else if (ms > TOWER_COIN_MS && !(me.tower.week === t.week && me.tower.cleared)) lines.push(`<div class="line">Climb it in <b>5:00 or less</b> to win ${coinHtml(TOWER_CLEAR_COINS)}</div>`);
    if (r.rank) lines.push(`<div class="line">You're <b>#${r.rank}</b> this week${r.rank === 1 ? '. Hold on to first place until the week ends to win the prize!' : ''}</div>`);
  } catch (e) {
    lines.push(`<div class="line down">${escapeHtml(e.message)}</div>`);
  }
  if (tower === t) results.innerHTML = lines.join('');
  $('againBtn').disabled = false;
}

// ---------- Saving climbs ----------
async function commitWithStart(sess, path, fields) {
  await fs(sess, 'POST', ':commit', { body: { writes: [{
    update: { name: docName(path), fields: toFields(fields) },
    updateMask: { fieldPaths: Object.keys(fields) },
    updateTransforms: [{ fieldPath: 'start', setToServerValue: 'REQUEST_TIME' }],
  }] } });
}
async function setDoc(sess, path, data) { await fs(sess, 'PATCH', '/' + path, { body: { fields: toFields(data) } }); }
// The server notes when the climb started, so nobody can save a time faster than the real one
async function startTowerRun(week) {
  await commitWithStart(auth1, `tower/${week}/runs/${auth1.uid}`, { name: me.name, skin: myLoadout().skin });
}
async function saveTowerRun(t, ms) {
  const out = { coins: 0, newBest: false, best: ms, rank: 0 };
  if (!(await t.runReady)) throw new GameError("This climb started without a connection, so it can't be saved.");
  if (towerWeek() !== t.week) throw new GameError('The week ended during your climb, so this time does not count. A new tower is ready!');
  if (ms < TOWER_MIN_MS) throw new GameError("That time is too fast to be real, so it wasn't saved.");
  const path = `tower/${t.week}/runs/${auth1.uid}`;
  const run = await getDoc(auth1, path);
  const old = run && typeof run.best === 'number' ? run.best : null;
  if (old === null || ms < old) {
    await updateDoc(auth1, path, { best: ms });
    out.newBest = old !== null;
    const top = await getDoc(auth1, 'towerBest/' + t.week);
    if (!top || ms < top.time) await setDoc(auth1, 'towerBest/' + t.week, { uid: auth1.uid, name: me.name, time: ms });
  } else out.best = old;
  // 500 coins once a week, for the first climb of 5:00 or less
  if (ms <= TOWER_COIN_MS && !(me.tower.week === t.week && me.tower.cleared)) {
    await mutateUser(auth1, d => {
      if (d.tower.week === t.week && d.tower.cleared) return;
      d.tower = { ...d.tower, week: t.week, cleared: true };
      d.coins += TOWER_CLEAR_COINS; out.coins = TOWER_CLEAR_COINS;
    });
  }
  towerLbCache = null;
  const rows = await towerTop(t.week, 50);
  out.rank = rows.findIndex(r => r.id === auth1.uid) + 1;
  return out;
}
async function towerTop(week, limit) {
  const out = await fs(auth1, 'POST', `/tower/${week}:runQuery`, { body: { structuredQuery: {
    from: [{ collectionId: 'runs' }], orderBy: [{ field: { fieldPath: 'best' }, direction: 'ASCENDING' }], limit,
  } } });
  return out.filter(r => r.document).map(r => ({ id: r.document.name.split('/').pop(), ...fromFields(r.document.fields) }));
}
function towerRows(rows) {
  if (!rows.length) return '<p class="fine">Nobody has reached the top this week yet. Be the first!</p>';
  return rows.map((r, i) => `<div class="lb-row ${auth1 && r.id === auth1.uid ? 'me' : ''}"><span class="rank">${i + 1}</span>
    <div style="min-width:0"><div class="name">${escapeHtml(r.name || 'Player')}</div></div><b>${fmtTime(r.best)}</b></div>`).join('');
}
async function loadTowerLb(el, limit) {
  if (!el || !me) return;
  try {
    const w = towerWeek();
    if (!towerLbCache || towerLbCache.week !== w || Date.now() - towerLbCache.at > 60000) {
      const [rows, champ] = await Promise.all([towerTop(w, 10), getDoc(auth1, 'towerBest/' + (w - 1)).catch(() => null)]);
      towerLbCache = { week: w, at: Date.now(), rows, champ };
    }
    if (!document.contains(el)) return;
    el.innerHTML = towerRows(towerLbCache.rows.slice(0, limit));
    const c = towerLbCache.champ, last = $('towerLast');
    if (last && c) last.innerHTML = `Last week's champion: <b>${escapeHtml(c.name)}</b> (${fmtTime(c.time)})`;
  } catch (e) { if (document.contains(el)) el.innerHTML = `<p class="err">${escapeHtml(e.message)}</p>`; }
}

// The fastest climber of a finished week collects the prize the next time they open the game
let checkingPrizes = false;
async function checkTowerPrizes() {
  if (!me || needsUsername || checkingPrizes) return;
  checkingPrizes = true;
  try {
    const cur = towerWeek();
    for (let w = Math.max(me.tower.prize + 1, cur - 4); w < cur; w++) {
      const best = await getDoc(auth1, 'towerBest/' + w).catch(() => null);
      if (!best || best.uid !== auth1.uid) continue;
      await mutateUser(auth1, d => {
        if (d.tower.prize >= w) throw new GameError('Already collected.');
        d.tower = { ...d.tower, prize: w };
        d.coins += TOWER_PRIZE_COINS;
        if (!d.skins.includes('champion')) d.skins.push('champion');
      });
      sfx(880, 0.2, 'square', 0.04, 1.5); buzz('success');
      toast(`You won the weekly Tower tournament! +${TOWER_PRIZE_COINS} coins and the Alvin Cube skin`);
      if (!$('app').classList.contains('hidden')) renderApp();
    }
  } catch {} finally { checkingPrizes = false; }
}

function towerCard() {
  const w = towerWeek();
  return `<div class="card tower-card">

    <h2>The Tower</h2>

    <div id="towerLb" class="lb">${me ? '<p class="fine">Loading…</p>' : '<p class="fine"><button class="link" data-act="goto" data-to="profile">Log in</button> to see the leaderboard and join.</p>'}</div>
    <p class="fine" id="towerLast"></p>

}

// ---------- Tower controls ----------
const T_KEYS = { arrowleft: 'L', a: 'L', arrowright: 'R', d: 'R', ' ': 'J', arrowup: 'J', w: 'J' };
function towerKey(e, down) {
  const k = T_KEYS[e.key.toLowerCase()];
  if (!k || !tower) return false;
  e.preventDefault();
  if (k === 'J' && down && !e.repeat) towerJump();
  tower.keys[k] = down;
  return true;
}
document.addEventListener('keyup', e => { if (tower) towerKey(e, false); });
window.addEventListener('blur', () => { if (tower) tower.keys = { L: false, R: false, J: false }; towerPtrs.clear(); });
function towerButtons() {
  const r = Math.max(34, Math.min(46, W * 0.1)), y = H - 22 - r;
  return [{ k: 'L', x: 18 + r, y, r }, { k: 'R', x: 18 + 3 * r + 16, y, r }];
}
const towerBtnAt = (x, y) => (coarse ? towerButtons().find(b => Math.hypot(x - b.x, y - b.y) < b.r + 12)?.k : null);
canvas.addEventListener('pointerdown', e => {
  if (state !== 'tower' || !tower) return;
  const k = towerBtnAt(e.clientX, e.clientY);
  towerPtrs.set(e.pointerId, k || 'J');
  if (!k) towerJump(); else tower.started = true;
});
canvas.addEventListener('pointermove', e => {
  const k = towerPtrs.get(e.pointerId);
  if (k === 'L' || k === 'R') { const n = towerBtnAt(e.clientX, e.clientY); if (n) towerPtrs.set(e.pointerId, n); }
});
['pointerup', 'pointercancel'].forEach(ev => canvas.addEventListener(ev, e => towerPtrs.delete(e.pointerId)));

// ---------- Drawing the tower ----------
function towerDraw() {
  const t = tower, p = t.p;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sc = t.sc = Math.min(W / (TW + 90), H / 640);   // room at the sides for the HP and progress bars
  const ox = (W - TW * sc) / 2, cam = t.cam, top = cam + H / sc;
  const X = x => ox + x * sc, Y = y => H - (y - cam) * sc;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // Stage colors: a tinted inside, a faint glow outside and colored walls
  for (let s = 0; s < TOWER_STAGES.length; s++) {
    const y0 = s ? t.bounds[s] : -200, y1 = s + 1 < t.bounds.length ? t.bounds[s + 1] : t.top + 2000;
    if (y1 < cam || y0 > top) continue;
    const c = TOWER_STAGES[s].color, a = Y(y1), b = Y(y0);
    ctx.fillStyle = c;
    ctx.globalAlpha = 0.04; ctx.fillRect(0, a, W, b - a);
    ctx.globalAlpha = 0.08; ctx.fillRect(X(0), a, TW * sc, b - a);
    ctx.globalAlpha = 0.9; ctx.fillRect(X(0) - 8 * sc, a, 8 * sc, b - a); ctx.fillRect(X(TW), a, 8 * sc, b - a);
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1;
  for (let y = Math.ceil(cam / 100) * 100; y < Math.min(top, t.top + 60); y += 100) { ctx.beginPath(); ctx.moveTo(X(0), Y(y)); ctx.lineTo(X(TW), Y(y)); ctx.stroke(); }
  // Your highest point on this climb
  if (t.maxY > 300 && t.maxY - p.y > 150) {
    const my = Y(t.maxY);
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.moveTo(X(0) - 8 * sc, my - 6); ctx.lineTo(X(0) + 4, my); ctx.lineTo(X(0) - 8 * sc, my + 6); ctx.fill();
    ctx.font = '700 11px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('your best', X(0) + 8, my);
  }
  for (const pl of t.plats) if (pl.label && pl.y > cam - 200 && pl.y < top + 40) drawStageLabel(pl, Y(pl.y), sc);
  for (const pl of t.plats) {
    if (pl.y < cam - 40 || pl.y - pl.h > top + 40) continue;
    drawPlat(t, pl, X(pl.x), Y(pl.y), pl.w * sc, pl.h * sc, sc);
  }
  // Particles
  for (const q of t.parts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, q.life * 3)); ctx.fillStyle = q.color;
    ctx.fillRect(X(q.x) - 2, Y(q.y) - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  // The climber, squashing on landings and stretching on jumps
  const s = T_CUBE * sc, cx = X(p.x), by = Y(p.y);
  ctx.save();
  ctx.translate(cx, by); ctx.scale(1 + p.squash, 1 - p.squash);
  if (p.stun > 0) ctx.rotate(Math.sin(t.time * 40) * 0.15);
  if (p.inv > 0 && Math.sin(t.time * 30) > 0) ctx.globalAlpha = 0.4;
  if (p.hp <= 0) ctx.globalAlpha = 0;
  drawSkin(ctx, 0, -s / 2, s, p.skin, clock);
  if (t.hurt > 0) { ctx.fillStyle = `rgba(255,60,60,${t.hurt * 2})`; ctx.fillRect(-s / 2, -s, s, s); }
  ctx.restore();
  drawTowerHud(t);
}

function drawPlat(t, pl, x, y, w, h, sc) {
  const col = TOWER_STAGES[pl.stage].color;
  ctx.save();
  let alpha = 1;
  if (pl.type === 'blink') {
    const ph = (t.time + pl.ph) % pl.per;
    if (ph >= pl.on) {
      ctx.strokeStyle = col; ctx.globalAlpha = 0.35; ctx.setLineDash([4, 4]); ctx.strokeRect(x, y, w, h);
      ctx.restore(); return;
    }
    if (pl.on - ph < 0.45) alpha = Math.sin(ph * 40) > 0 ? 1 : 0.35;
  }
  if (pl.type === 'crumble') {
    if (pl.gone) {
      ctx.globalAlpha = Math.max(0, 0.25 - pl.gone * 0.1); ctx.strokeStyle = col; ctx.setLineDash([3, 5]); ctx.strokeRect(x, y, w, h);
      ctx.restore(); return;
    }
    if (pl.cr > 0) x += (Math.random() - 0.5) * 4;
  }
  ctx.globalAlpha = alpha;
  if (pl.type === 'floor') { ctx.fillStyle = '#1a1a22'; ctx.fillRect(x, y, w, 400); }
  else if (pl.type === 'ice') ctx.fillStyle = '#cdefff';
  else if (pl.type === 'bounce') ctx.fillStyle = '#ffd23f';
  else if (pl.type === 'belt') ctx.fillStyle = '#2a2a35';
  else if (pl.type === 'summit') ctx.fillStyle = '#facc15';
  else ctx.fillStyle = col;
  if (pl.type === 'bounce') {
    const squish = Math.max(0, 1 - (t.time - (pl.boing ?? -9)) * 4) * 0.5;
    ctx.fillRect(x, y + h * squish, w, h * (1 - squish));
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) { ctx.moveTo(x + w * 0.2, y + h + i * 3 * sc + 2); ctx.lineTo(x + w * 0.8, y + h + i * 3 * sc + 2); }
    ctx.stroke();
  } else if (pl.type !== 'floor') ctx.fillRect(x, y, w, h);
  // Top edge highlight
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x, y, w, Math.max(1, 2 * sc));
  if (pl.type === 'floor') { ctx.fillStyle = col; ctx.fillRect(x, y, w, 3); }
  if (pl.type === 'crumble') {
    ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x + w * 0.3, y); ctx.lineTo(x + w * 0.38, y + h * 0.6); ctx.lineTo(x + w * 0.32, y + h);
    ctx.moveTo(x + w * 0.7, y); ctx.lineTo(x + w * 0.62, y + h * 0.5); ctx.lineTo(x + w * 0.7, y + h); ctx.stroke();
  }
  if (pl.type === 'belt') {
    ctx.strokeStyle = col; ctx.lineWidth = 2;
    const step = 14 * sc, off = ((t.time * pl.belt * sc) % step + step) % step, d = Math.sign(pl.belt) * 4 * sc;
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.beginPath();
    for (let i = -1; i < w / step + 1; i++) { const cx = x + i * step + off; ctx.moveTo(cx - d, y + h * 0.25); ctx.lineTo(cx, y + h / 2); ctx.lineTo(cx - d, y + h * 0.75); }
    ctx.stroke();
  }
  if (pl.type === 'move' || pl.type === 'lift') {
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    const cx = x + w / 2, cy = y + h / 2, a = 3.5 * sc;
    ctx.beginPath();
    if (pl.type === 'move') { ctx.moveTo(cx - 6 * sc, cy); ctx.lineTo(cx - 6 * sc + a, cy - a); ctx.lineTo(cx - 6 * sc + a, cy + a); ctx.moveTo(cx + 6 * sc, cy); ctx.lineTo(cx + 6 * sc - a, cy - a); ctx.lineTo(cx + 6 * sc - a, cy + a); }
    else { ctx.moveTo(cx, cy - a - 1); ctx.lineTo(cx - a, cy - 1); ctx.lineTo(cx + a, cy - 1); ctx.moveTo(cx, cy + a + 1); ctx.lineTo(cx - a, cy + 1); ctx.lineTo(cx + a, cy + 1); }
    ctx.fill();
  }
  if (pl.spike) {
    const a = x + pl.spike[0] * sc, b = x + pl.spike[1] * sc, n = Math.max(2, Math.round((b - a) / (9 * sc))), sw = (b - a) / n;
    ctx.fillStyle = '#ff4d5e';
    ctx.beginPath();
    for (let i = 0; i < n; i++) { ctx.moveTo(a + i * sw, y); ctx.lineTo(a + (i + 0.5) * sw, y - 11 * sc); ctx.lineTo(a + (i + 1) * sw, y); }
    ctx.fill();
  }
  if (pl.type === 'summit') {
    const fx = x + w / 2, fy = y;
    ctx.fillStyle = '#ddd'; ctx.fillRect(fx - 1.5, fy - 70 * sc, 3, 70 * sc);
    ctx.fillStyle = '#ff4d5e';
    ctx.beginPath(); ctx.moveTo(fx + 1.5, fy - 70 * sc);
    const wave = Math.sin(t.time * 4) * 3 * sc;
    ctx.lineTo(fx + 34 * sc, fy - 60 * sc + wave); ctx.lineTo(fx + 1.5, fy - 48 * sc); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `900 ${Math.round(16 * sc)}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('THE TOP', fx, fy - 76 * sc);
  }
  ctx.restore();
}
// Each stage's name, painted on the tower wall behind the platforms
function drawStageLabel(pl, y, sc) {
  const st = TOWER_STAGES[pl.stage];
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = st.color; ctx.globalAlpha = 0.3;
  ctx.font = `900 ${Math.round(30 * sc)}px system-ui, sans-serif`;
  ctx.fillText(`STAGE ${pl.stage + 1}`, W / 2, y - 70 * sc);
  ctx.font = `700 ${Math.round(15 * sc)}px system-ui, sans-serif`;
  ctx.fillText(st.name.toUpperCase(), W / 2, y - 50 * sc);
  ctx.globalAlpha = 1;
}

function drawTowerHud(t) {
  const topY = 12 + safeTop, st = TOWER_STAGES[t.stage || 0];
  // A dark backing so the clock stays readable over the tower
  const label = `Stage ${(t.stage || 0) + 1}/${TOWER_STAGES.length} · ${st.name}`;
  ctx.font = '700 13px system-ui, sans-serif';
  const bw = Math.max(118, ctx.measureText(label).width) + 20;
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(6, topY - 6, bw, 58, 10) : ctx.rect(6, topY - 6, bw, 58); ctx.fill();
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff'; ctx.font = '800 26px system-ui, sans-serif';
  ctx.fillText(fmtTime(t.clock * 1000), 16, topY);
  ctx.fillStyle = st.color; ctx.font = '700 13px system-ui, sans-serif';
  ctx.fillText(label, 16, topY + 32);
  // HP on the left side and progress up the tower on the right, next to the walls
  const sc = t.sc, wallL = (W - TW * sc) / 2 - 8 * sc, roomy = wallL > 120;
  const bw2 = roomy ? 18 : 12;
  const lx = roomy ? wallL - 44 : wallL / 2, rx = W - lx;
  const b1 = topY + 96, b0 = H - (coarse ? 150 : 40), bh = Math.max(60, b0 - b1);
  const pill = (x, y, w, h2) => { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h2, w / 2) : ctx.rect(x, y, w, h2); };
  const shake = t.hpFlash > 0 ? (Math.random() - 0.5) * 6 * t.hpFlash : 0;
  // Health
  const hp = t.p.hp / TOWER_HP, lag = t.hpLag / TOWER_HP, hpCol = `hsl(${Math.round(hp * 120)}, 85%, 55%)`;
  ctx.save(); ctx.translate(shake, 0);
  ctx.fillStyle = 'rgba(255,255,255,.1)'; pill(lx - bw2 / 2, b1, bw2, bh); ctx.fill();
  ctx.save(); pill(lx - bw2 / 2, b1, bw2, bh); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(lx - bw2 / 2, b0 - bh * lag, bw2, bh * lag);
  ctx.fillStyle = hpCol; ctx.fillRect(lx - bw2 / 2, b0 - bh * hp, bw2, bh * hp);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  for (let k = 1; k < TOWER_HP / SPIKE_DMG; k++) ctx.fillRect(lx - bw2 / 2, b0 - bh * k * SPIKE_DMG / TOWER_HP, bw2, 1.5);   // one notch per spike hit
  ctx.restore();
  if (t.hpFlash > 0) { ctx.strokeStyle = `rgba(255,77,94,${t.hpFlash * 2})`; ctx.lineWidth = 3; pill(lx - bw2 / 2 - 2, b1 - 2, bw2 + 4, bh + 4); ctx.stroke(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = hpCol; ctx.font = `900 ${roomy ? 20 : 15}px system-ui, sans-serif`; ctx.fillText(t.p.hp, lx, b1 - 18);
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = `800 ${roomy ? 12 : 10}px system-ui, sans-serif`; ctx.fillText('HP', lx, b1 - 5);
  ctx.restore();
  // Progress: one colored piece per stage, lit up once you've reached it
  const toBar = y => b0 - Math.max(0, Math.min(1, y / t.top)) * bh;
  ctx.fillStyle = 'rgba(255,255,255,.1)'; pill(rx - bw2 / 2, b1, bw2, bh); ctx.fill();
  ctx.save(); pill(rx - bw2 / 2, b1, bw2, bh); ctx.clip();
  for (let s = 0; s < TOWER_STAGES.length; s++) {
    const y0 = s ? t.bounds[s] : 0, y1 = s + 1 < t.bounds.length ? t.bounds[s + 1] : t.top;
    ctx.fillStyle = TOWER_STAGES[s].color; ctx.globalAlpha = s <= t.topStage ? 1 : 0.22;
    ctx.fillRect(rx - bw2 / 2, toBar(y1) + 1, bw2, toBar(y0) - toBar(y1) - 1);
  }
  ctx.restore(); ctx.globalAlpha = 1;
  if (roomy) {
    ctx.font = '700 10px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (let s = 0; s < TOWER_STAGES.length; s++) {
      const y0 = s ? t.bounds[s] : 0, y1 = s + 1 < t.bounds.length ? t.bounds[s + 1] : t.top;
      ctx.fillStyle = s <= t.topStage ? TOWER_STAGES[s].color : 'rgba(255,255,255,.3)';
      ctx.fillText(s + 1, rx + bw2 / 2 + 6, (toBar(y0) + toBar(y1)) / 2);
    }
  }
  // Your best height, and where you are now
  const by = toBar(t.maxY), py = toBar(t.p.y);
  ctx.fillStyle = '#fff'; ctx.fillRect(rx - bw2 / 2 - 4, by - 1, bw2 + 8, 2);
  ctx.beginPath(); ctx.arc(rx, py, bw2 / 2 + 3, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();
  const pct = Math.min(100, Math.floor(Math.max(0, t.p.y) / t.top * 100));
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.font = `900 ${roomy ? 20 : 14}px system-ui, sans-serif`;
  const tx = Math.min(rx, W - 4 - ctx.measureText(pct + '%').width / 2);   // keep it on screen
  ctx.fillStyle = '#fff'; ctx.fillText(pct + '%', tx, b1 - 18);
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = `800 ${roomy ? 12 : 10}px system-ui, sans-serif`; ctx.fillText('TOP', tx, b1 - 5);
  // New stage banner
  if (t.banner) {
    const b = TOWER_STAGES[t.banner.stage], a = Math.min(1, t.banner.life * 2, (2.4 - t.banner.life) * 6);
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = b.color; ctx.font = '900 40px system-ui, sans-serif';
    ctx.fillText(`STAGE ${t.banner.stage + 1}`, W / 2, H * 0.3);
    ctx.fillStyle = '#fff'; ctx.font = '700 18px system-ui, sans-serif';
    ctx.fillText(b.name, W / 2, H * 0.3 + 34);
    ctx.globalAlpha = 1;
  }
  if (!t.started) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '700 16px system-ui, sans-serif';
    ctx.fillText(coarse ? 'Tap to jump · hold ◀ ▶ to move' : '← → or A / D to move · Space to jump', W / 2, H * 0.3);
    ctx.font = '600 13px system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.fillText('The clock starts when you move', W / 2, H * 0.3 + 26);
  }
  if (coarse && state === 'tower') {
    for (const b of towerButtons()) {
      const on = t.in[b.k];
      ctx.fillStyle = on ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.12)';
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff';
      const d = b.k === 'L' ? -1 : 1, a = b.r * 0.38;
      ctx.beginPath(); ctx.moveTo(b.x + d * a, b.y); ctx.lineTo(b.x - d * a * 0.6, b.y - a); ctx.lineTo(b.x - d * a * 0.6, b.y + a); ctx.fill();
    }
  }
}

// Safe-area inset so the HP bars clear a phone's notch
let safeTop = 0;
(() => {
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top, 0px);visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);
  const set = () => { safeTop = probe.offsetHeight; };
  set(); window.addEventListener('resize', set);
})();

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (tower && (state === 'tower' || state === 'towerDone')) { towerUpdate(dt); towerDraw(); requestAnimationFrame(loop); return; }
  // Sub-step so fast cubes and spikes don't skip through each other
  for (let i = 0; i < 4; i++) update(dt / 4);
  if (online && state === 'play') { if (online.role === 'guest') guestTick(dt); else hostSend(); }
  updateEffects(dt);
  draw();
  requestAnimationFrame(loop);
}
show('app');
restoreSession().then(() => { if (!$('app').classList.contains('hidden')) renderApp(); });
requestAnimationFrame(loop);
</script>
</body>
