<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bounce Duel</title>
<style>
  :root {
    --bg: #000; --panel: #0e0e12; --panel-2: #16161c; --line: #2a2a33; --text: #fff; --muted: #a3a3b0;
    --p1: #ff4d5e; --p2: #4da6ff; --good: #4ade80; --bad: #ff4d5e; --coin: #ffcf3f; --event: #c084fc;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas#c { display: block; touch-action: none; position: fixed; inset: 0; }
  .hidden { display: none !important; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--muted); line-height: 1.5; }

  button {
    font: inherit; background: #fff; color: #000; border: 0; border-radius: 10px; padding: 13px 22px;
    font-size: 17px; font-weight: 700; cursor: pointer;
  }
  button:hover { background: #e4e4e4; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--p2); outline-offset: 2px; }
  button.ghost { background: transparent; color: #fff; border: 2px solid var(--line); }
  button.ghost:hover { border-color: #fff; }
  button.small { padding: 8px 14px; font-size: 14px; border-radius: 8px; }
  button.coin-btn { background: var(--coin); color: #1a1200; }
  button.event-btn { background: var(--event); color: #12001f; }
  button.link { background: none; color: var(--p2); padding: 0; font-size: inherit; font-weight: 600; text-decoration: underline; border-radius: 0; }

  input {
    font: inherit; background: #111; color: #fff; border: 2px solid #3a3a44; border-radius: 10px;
    padding: 10px 12px; font-size: 17px; width: 100%; outline: none; -webkit-user-select: text; user-select: text;
  }
  input:focus { border-color: #fff; }
  label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }

  .coin { display: inline-block; width: .9em; height: .9em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, var(--coin) 55%, #b88700); vertical-align: -0.1em; margin-right: .25em; box-shadow: 0 0 0 1px #7a5a00 inset; }
  .err { color: var(--bad); font-size: 14px; min-height: 1.4em; }
  .ok { color: var(--good); }
  .fine { font-size: 12px; color: var(--muted); }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }

  /* ---------- App shell with tabs ---------- */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 900; letter-spacing: 3px; font-size: 18px; white-space: nowrap; }
  .wallet { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 0; }
  .pill { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; white-space: nowrap; }
  #tabBody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  .tab-inner { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: #08080b;
    padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  }
  .tabbar button {
    background: none; color: var(--muted); padding: 6px 2px; border-radius: 8px; font-size: 11px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative;
  }
  .tabbar button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .tabbar button.on { color: #fff; }
  .tabbar button:hover { background: var(--panel-2); }
  .badge { position: absolute; top: 2px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--coin); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card.event { border-color: #4b2a6e; background: linear-gradient(160deg, #1b0f2b, var(--panel) 60%); }
  .card.reward { border-color: #5c4a10; background: linear-gradient(160deg, #241c05, var(--panel) 60%); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  .big-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .big-buttons button { padding: 18px 12px; font-size: 18px; }
  .hero { text-align: center; display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
  .hero h1 { font-size: clamp(34px, 9vw, 60px); letter-spacing: 3px; line-height: 1; font-weight: 900; }
  .timer { font-variant-numeric: tabular-nums; font-weight: 700; color: #fff; }

  .challenge { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  .challenge:first-of-type { border-top: 0; padding-top: 0; }
  .bar { height: 8px; border-radius: 999px; background: #22222a; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--good); border-radius: 999px; }

  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .skin-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; position: relative; }
  .skin-card canvas { width: 72px; height: 72px; }
  .skin-card .tag { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 800; letter-spacing: 1px; background: var(--event); color: #12001f; padding: 3px 6px; border-radius: 6px; }
  .skin-card button { width: 100%; }
  .price s { color: var(--muted); font-weight: 400; margin-right: 4px; }

  .lb { display: flex; flex-direction: column; }
  .lb-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .lb-row:first-child { border-top: 0; }
  .lb-row .rank { color: var(--muted); font-weight: 700; text-align: right; }
  .lb-row .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-row .meta { font-size: 12px; color: var(--muted); }
  .lb-row.me .name { color: var(--coin); }
  .code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 22px; font-weight: 800; letter-spacing: 4px; -webkit-user-select: text; user-select: text; }
  .group-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--line); color: #fff; text-align: left; padding: 12px 14px; }
  .group-item:hover { background: #1e1e26; }

  .stats { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 15px; margin: 0; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .big-num { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; }
  form { display: flex; flex-direction: column; gap: 10px; }

  /* ---------- Setup and game over ---------- */
  .overlay {
    position: fixed; inset: 0; display: flex; overflow-y: auto; background: rgba(0,0,0,.9);
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .inner { margin: auto; width: 100%; max-width: 780px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .menu { display: flex; flex-direction: column; gap: 10px; width: min(320px, 100%); }
  #panels { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .panel {
    flex: 1 1 320px; max-width: 370px; min-width: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; text-align: left;
  }
  .panel-head { display: flex; align-items: center; gap: 12px; }
  .preview { width: 120px; height: 120px; flex: none; background: #000; border-radius: 10px; border: 1px solid var(--line); }
  .panel-head .who { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
  .acct { font-size: 13px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
  .acct b { color: #fff; }
  .acct details summary { cursor: pointer; color: var(--p2); font-weight: 600; }
  .mini-form { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .mini-form input { font-size: 16px; padding: 8px 10px; }
  .pick > span { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: #17171d; color: #fff; border: 2px solid #2c2c35; border-radius: 999px; padding: 6px 12px;
    font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { background: #22222b; }
  .chip.on { border-color: #fff; background: #fff; color: #000; }
  .chip canvas { width: 16px; height: 16px; border-radius: 3px; }
  .desc { font-size: 13px; margin-top: 6px; min-height: 1.5em; }
  .event-flag { background: var(--event); color: #12001f; font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 999px; }
  #winText { font-size: clamp(36px, 9vw, 64px); font-weight: 900; }
  #results { display: flex; flex-direction: column; gap: 8px; font-size: 16px; width: min(420px, 100%); }
  #results .line { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; text-align: left; }
  .up { color: var(--good); }
  .down { color: var(--bad); }

  #hint {
    position: fixed; top: calc(48px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 18px;
    pointer-events: none; text-shadow: 0 0 6px #000, 0 0 6px #000; padding: 0 16px;
  }
  #quitBtn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    width: 34px; height: 34px; padding: 0; border-radius: 50%; font-size: 16px; background: #1a1a1f; color: #fff; border: 1px solid #333;
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #fff; color: #000; font-weight: 700; padding: 10px 16px; border-radius: 999px; z-index: 50;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center;
  }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint" class="hidden"></div>
<button id="quitBtn" class="hidden" aria-label="Back to menu">✕</button>
<div id="toast" class="hidden"></div>

<!-- Main app with tabs -->
<div id="app" class="screen">
  <header class="topbar">
    <div class="brand">BOUNCE DUEL</div>
    <div class="wallet" id="wallet"></div>
  </header>
  <main id="tabBody"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="play"><svg viewBox="0 0 24 24"><polygon points="7 4 20 12 7 20 7 4"/></svg>Play</button>
    <button data-tab="events"><svg viewBox="0 0 24 24"><polygon points="12 3 14.8 8.8 21 9.6 16.5 13.9 17.6 20.1 12 17.1 6.4 20.1 7.5 13.9 3 9.6 9.2 8.8 12 3"/></svg>Events</button>
    <button data-tab="shop"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Shop</button>
    <button data-tab="groups"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/></svg>Groups</button>
    <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>Profile</button>
  </nav>
</div>

<!-- Match setup -->
<div id="setup" class="overlay hidden">
  <div class="inner">
    <h2 id="setupTitle"></h2>
    <div id="setupEvent"></div>
    <div id="panels"></div>
    <div class="menu">
      <button id="startBtn">Start</button>
      <button class="ghost" id="setupBack">Back</button>
    </div>
  </div>
</div>

<!-- Game over -->
<div id="over" class="overlay hidden">
  <div class="inner">
    <div id="winText"></div>
    <div id="results"></div>
    <div class="menu">
      <button id="againBtn">Rematch</button>
      <button class="ghost" id="overMenu">Menu</button>
    </div>
  </div>
</div>

<script>
// ============================================================================
// Firebase settings. Fill these in from your Firebase project (FIREBASE_SETUP.md).
// ============================================================================
const FIREBASE_CONFIG = { apiKey: '', projectId: '' };

const cfg = window.BD_FIREBASE || FIREBASE_CONFIG;   // tests point this at the local emulator
const ONLINE = !!(cfg.apiKey && cfg.projectId);

// ---------- Small helpers ----------
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.remove('hidden'); t.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.classList.add('hidden'), 200); }, 2200);
}
const coinHtml = n => `<span class="coin"></span>${n}`;
function dayKey(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function fmtLeft(ms) {
  if (ms <= 0) return 'now';
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${mm}m`;
  return `${mm}m ${Math.floor((ms % 60000) / 1000)}s`;
}

// ============================================================================
// Firebase (Authentication + Firestore over their REST APIs)
// ============================================================================
const AUTH_ERRORS = {
  EMAIL_EXISTS: 'An account with this email already exists. Log in instead.',
  INVALID_LOGIN_CREDENTIALS: 'Wrong email or password.',
  INVALID_PASSWORD: 'Wrong email or password.',
  EMAIL_NOT_FOUND: 'Wrong email or password.',
  WEAK_PASSWORD: 'Password must be at least 6 characters.',
  INVALID_EMAIL: 'Enter a valid email address.',
  MISSING_EMAIL: 'Enter your email address.',
  MISSING_PASSWORD: 'Enter your password.',
  TOO_MANY_ATTEMPTS_TRY_LATER: 'Too many attempts. Try again in a few minutes.',
  USER_DISABLED: 'This account has been disabled.',
  OPERATION_NOT_ALLOWED: 'Email/password sign-in is not turned on in Firebase yet.',
  CONFIGURATION_NOT_FOUND: 'Firebase Authentication is not set up for this game yet.',
  TOKEN_EXPIRED: 'You were signed out. Log in again.',
  INVALID_REFRESH_TOKEN: 'You were signed out. Log in again.',
  USER_NOT_FOUND: 'You were signed out. Log in again.',
};
class GameError extends Error {}

const authBase = svc => (cfg.authHost ? `${cfg.authHost}/` : 'https://') + svc;
const docsBase = () => `${cfg.firestoreHost || 'https://firestore.googleapis.com'}/v1/projects/${cfg.projectId}/databases/(default)/documents`;
const docName = path => `projects/${cfg.projectId}/databases/(default)/documents/${path}`;

async function request(url, opts) {
  let res;
  try { res = await fetch(url, opts); }
  catch { throw new GameError("Can't reach the account server. Check your internet connection."); }
  const body = await res.json().catch(() => ({}));
  return { res, body };
}

async function authPost(path, payload) {
  const { res, body } = await request(`${authBase('identitytoolkit.googleapis.com')}/v1/${path}?key=${cfg.apiKey}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
  });
  if (!res.ok) {
    const code = String(body.error?.message || '').split(/[\s:]/)[0];
    if (/API key/i.test(body.error?.message || '')) throw new GameError("The game's Firebase key isn't valid.");
    throw new GameError(AUTH_ERRORS[code] || 'Something went wrong. Try again.');
  }
  return body;
}

function makeSession(b) {
  return { uid: b.localId || b.user_id, email: b.email, idToken: b.idToken || b.id_token, refreshToken: b.refreshToken || b.refresh_token,
           expires: Date.now() + Number(b.expiresIn || b.expires_in || 3600) * 1000 };
}
async function signUp(email, password) {
  return makeSession(await authPost('accounts:signUp', { email: email.trim(), password, returnSecureToken: true }));
}
async function signIn(email, password) {
  return makeSession(await authPost('accounts:signInWithPassword', { email: email.trim(), password, returnSecureToken: true }));
}
async function sendReset(email) {
  await authPost('accounts:sendOobCode', { requestType: 'PASSWORD_RESET', email: email.trim() });
}
async function idToken(sess) {
  if (Date.now() > sess.expires - 60000) {
    const { res, body } = await request(`${authBase('securetoken.googleapis.com')}/v1/token?key=${cfg.apiKey}`, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(sess.refreshToken),
    });
    if (!res.ok) throw new GameError(AUTH_ERRORS[body.error?.message] || 'You were signed out. Log in again.');
    Object.assign(sess, makeSession({ ...body, email: sess.email }));
    if (sess === auth1) store.set('bd.auth', { uid: sess.uid, email: sess.email, refreshToken: sess.refreshToken });
  }
  return sess.idToken;
}

// Firestore values <-> plain JS
function toValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (typeof v === 'string') return { stringValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(toValue) } };
  return { mapValue: { fields: toFields(v) } };
}
function toFields(o) { const f = {}; for (const k of Object.keys(o)) f[k] = toValue(o[k]); return f; }
function fromValue(v) {
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return Number(v.doubleValue);
  if ('stringValue' in v) return v.stringValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fromValue);
  if ('mapValue' in v) return fromFields(v.mapValue.fields || {});
  if ('timestampValue' in v) return v.timestampValue;
  return null;
}
function fromFields(f) { const o = {}; for (const k of Object.keys(f || {})) o[k] = fromValue(f[k]); return o; }

async function fs(sess, method, path, { body, query = '' } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (sess) headers.Authorization = 'Bearer ' + await idToken(sess);
  const { res, body: out } = await request(`${docsBase()}${path}${query}`, { method, headers, body: body && JSON.stringify(body) });
  if (res.status === 404 && method === 'GET') return null;
  if (!res.ok) {
    const st = out.error?.status;
    if (st === 'PERMISSION_DENIED') throw new GameError('The server refused that change.');
    if (st === 'FAILED_PRECONDITION' || st === 'ALREADY_EXISTS') throw new GameError('EXISTS');
    if (st === 'NOT_FOUND') throw new GameError('The game database is not set up yet.');
    throw new GameError('Something went wrong saving. Try again.');
  }
  return out;
}
async function getDoc(sess, path) {
  const d = await fs(sess, 'GET', '/' + path);
  return d && d.fields !== undefined ? fromFields(d.fields) : d ? {} : null;
}
async function createDoc(sess, path, data) {
  await fs(sess, 'PATCH', '/' + path, { body: { fields: toFields(data) }, query: '?currentDocument.exists=false' });
}
async function updateDoc(sess, path, data) {
  const mask = Object.keys(data).map(k => 'updateMask.fieldPaths=' + encodeURIComponent(k)).join('&');
  await fs(sess, 'PATCH', '/' + path, { body: { fields: toFields(data) }, query: '?currentDocument.exists=true&' + mask });
}
async function deleteDoc(sess, path) { await fs(sess, 'DELETE', '/' + path); }
async function getMany(sess, paths) {
  if (!paths.length) return [];
  const out = await fs(sess, 'POST', ':batchGet', { body: { documents: paths.map(docName) } });
  return out.filter(r => r.found).map(r => ({ id: r.found.name.split('/').pop(), ...fromFields(r.found.fields) }));
}
async function topPlayers(sess, limit = 25) {
  const out = await fs(sess, 'POST', ':runQuery', { body: { structuredQuery: {
    from: [{ collectionId: 'users' }], orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }], limit,
  } } });
  return out.filter(r => r.document).map(r => ({ id: r.document.name.split('/').pop(), ...fromFields(r.document.fields) }));
}

];
const BASE_MODS = { speed: 1, powerRate: 1, spikeScale: 1, room: 1, hp: 100 };
function weekInfo(now = new Date()) {
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  const idx = Math.round((monday - new Date(2024, 0, 1)) / (7 * 864e5));
  const n = EVENTS.length;
  return { event: EVENTS[((idx % n) + n) % n], next: EVENTS[(((idx + 1) % n) + n) % n],
           ends: new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 7).getTime() };
}

// Daily challenges: three picked from the pool by date, the same for everyone
const CHALLENGE_POOL = [
  { id: 'play5', text: 'Play 5 matches', metric: 'play', target: 5, reward: 30 },
  { id: 'win1p2', text: 'Win 2 single-player games', metric: 'win1p', target: 2, reward: 40 },
  { id: 'winHard', text: 'Beat the CPU on Hard', metric: 'winHard', target: 1, reward: 60 },
  { id: 'dmg300', text: 'Deal 300 damage', metric: 'damage', target: 300, reward: 40 },
  { id: 'power15', text: 'Use your power 15 times', metric: 'power', target: 15, reward: 30 },
  { id: 'win2p', text: 'Win a two-player match', metric: 'win2p', target: 1, reward: 50 },
  { id: 'bigwin', text: 'Win with 50 HP or more left', metric: 'bigwin', target: 1, reward: 50 },
  { id: 'event2', text: 'Play 2 event matches', metric: 'eventplay', target: 2, reward: 40 },
  { id: 'spike', text: '', metric: '', target: 1, reward: 40 },
];
function seeded(str) {
  let h = 2166136261;
  for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}
function dailyChallenges(day = dayKey()) {
  const rnd = seeded(day);
  const pool = CHALLENGE_POOL.slice().sort(() => rnd() - 0.5).slice(0, 3);
  return pool.map(c => {
    if (c.id !== 'spike') return c;
    const ids = Object.keys(SPIKES), sp = ids[Math.floor(rnd() * ids.length)];
    return { ...c, id: 'win_' + sp, text: `Win a game with the ${SPIKES[sp].name} spike`, metric: 'win_' + sp };
  });
}
const streakReward = count => 20 + 10 * Math.min(Math.max(count, 1) - 1, 6);
const msToMidnight = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1) - n; };

    daily: { day: '', progress: {}, claimed: [] }, streak: { last: '', count: 0 },

function normalizeUser(d) {
  d.skins = d.skins || FREE_SKINS.slice(); d.groups = d.groups || [];
  d.daily = d.daily || { day: '', progress: {}, claimed: [] };
  d.daily.progress = d.daily.progress || {}; d.daily.claimed = d.daily.claimed || [];
  d.streak = d.streak || { last: '', count: 0 };
  for (const k of ['score', 'coins', 'wins1p', 'losses1p', 'wins2p', 'losses2p']) d[k] = d[k] || 0;
  return d;
}
async function loadOrCreateUser(sess) {
  let d = await getDoc(sess, 'users/' + sess.uid);
  if (!d) {
    d = newUserDoc(sess.email || '');
    try { await createDoc(sess, 'users/' + sess.uid, d); }
    catch (e) { if (e.message !== 'EXISTS') throw e; d = await getDoc(sess, 'users/' + sess.uid); }
  }
  return normalizeUser(d);
}
// Read the latest copy, change it, save it back (keeps two devices from overwriting each other)
async function mutateUser(sess, fn) {
  const d = normalizeUser(await getDoc(sess, 'users/' + sess.uid) || await loadOrCreateUser(sess));
  fn(d);
  const { name, score, coins, skins, wins1p, losses1p, wins2p, losses2p, groups, daily, streak } = d;
  await updateDoc(sess, 'users/' + sess.uid, { name, score, coins, skins, wins1p, losses1p, wins2p, losses2p, groups, daily, streak });
  if (sess === auth1) me = d;
  if (sess === auth2) p2me = d;
  return d;
}
function rollDaily(d) {
  const today = dayKey();
  if (d.daily.day !== today) d.daily = { day: today, progress: {}, claimed: [] };

function login1(sess, doc) {

async function restoreSession() {
  const saved = store.get('bd.auth', null);
  if (!ONLINE || !saved?.refreshToken) return;
  const sess = { uid: saved.uid, email: saved.email, refreshToken: saved.refreshToken, idToken: '', expires: 0 };

function sfx(freq, dur = 0.07, type = 'square', vol = 0.04, slide = 0) {
  if (muted) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch {}
}

// Runs an async action with the button disabled, showing errors in a toast or an error line
async function busy(btn, fn, errEl) {
  if (btn.disabled) return;
  btn.disabled = true;
  if (errEl) errEl.textContent = '';
  try { await fn(); }
  catch (e) { if (errEl && document.contains(errEl)) errEl.textContent = e.message; else toast(e.message); }
  finally { btn.disabled = false; }
}

const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
async function createGroup(name) {
  name = name.trim();
  if (!name) throw new GameError('Give your group a name.');
  if (me.groups.length >= 10) throw new GameError('You can be in up to 10 groups.');
  for (let tries = 0; tries < 5; tries++) {
    const code = Array.from({ length: 6 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
    try { await createDoc(auth1, 'groups/' + code, { name: name.slice(0, 24), owner: auth1.uid, members: [auth1.uid] }); }
    catch (e) { if (e.message === 'EXISTS') continue; throw e; }
    await mutateUser(auth1, d => { if (!d.groups.includes(code)) d.groups.push(code); });
    groupView = code; toast('Group created'); renderApp();
    return;
  }
  throw new GameError('Could not make a group code. Try again.');
}
async function joinGroup(code) {
  code = code.trim().toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(code)) throw new GameError('Group codes are 6 letters and numbers.');
  const g = await getDoc(auth1, 'groups/' + code);
  if (!g) throw new GameError('No group has that code.');
  const members = g.members || [];
  if (!members.includes(auth1.uid)) {
    if (members.length >= 30) throw new GameError('That group is full.');
    if (me.groups.length >= 10) throw new GameError('You can be in up to 10 groups.');
    await updateDoc(auth1, 'groups/' + code, { members: [...members, auth1.uid] });
  }
  await mutateUser(auth1, d => { if (!d.groups.includes(code)) d.groups.push(code); });
  groupView = code; toast(`Joined ${g.name}`); renderApp();
}
async function leaveGroup(code) {
  const g = await getDoc(auth1, 'groups/' + code);
  if (g) {
    const rest = (g.members || []).filter(id => id !== auth1.uid);
    if (!rest.length && g.owner === auth1.uid) await deleteDoc(auth1, 'groups/' + code);
    else if (rest.length !== (g.members || []).length) await updateDoc(auth1, 'groups/' + code, { members: rest });
  }
  await mutateUser(auth1, d => { d.groups = d.groups.filter(c => c !== code); });
  groupView = null; toast('Left the group'); renderApp();
}

// ============================================================================

function makePlayer(i, name, lo, isCpu) {
  return {
    i, name, color: COLORS[i], isCpu,
    skin: lo.skin, spike: lo.spike, power: lo.power,
    hp: mods.hp, maxHp: mods.hp, x: 0, y: 0, vx: 0, vy: 0,
    angle: i * Math.PI, spin: i === 0 ? 1 : -1,
    hitCd: 0, flash: 0, placed: false,
    powerCd: 2, dash: 0, shield: 0, frozen: 0, rage: 0, aiTimer: 0,
    dealt: 0, powersUsed: 0,
  };
}

function randomLoadout() {
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  return { skin: pick(SKINS).id, spike: pick(Object.keys(SPIKES)), power: pick(Object.keys(POWERS)) };
}

function startMatch() {
  mods = { ...BASE_MODS, ...(isEvent ? weekInfo().event.mods : {}) };
  resize();
  const n = i => ($('name' + i) ? $('name' + i).value.trim() : '') || defaultName(i);
  players = mode === '1p'
    ? [makePlayer(0, n(0), loadouts[0], false), makePlayer(1, `CPU (${DIFFICULTIES[difficulty].name})`, randomLoadout(), true)]
    : [makePlayer(0, n(0), loadouts[0], false), makePlayer(1, n(1), loadouts[1], false)];
  particles = []; popups = [];
  elapsed = 0; placing = 0; aimPress = false;
  state = 'place';
  screens.forEach(s => $(s).classList.add('hidden'));
  $('quitBtn').classList.remove('hidden');
  updateHint();
}
$('startBtn').onclick = () => { sfx(520, 0.1, 'square', 0.04, 1.5); startMatch(); };
$('againBtn').onclick = startMatch;
$('overMenu').onclick = () => show('app');
$('quitBtn').onclick = () => { mods = { ...BASE_MODS }; resize(); show('app'); };

function updateHint() {
  if ((state === 'place' || state === 'aim') && players[placing]) {
    const p = players[placing];
    hint.innerHTML = `<b style="color:${p.color}">${escapeHtml(p.name)}</b>: ` +
      (state === 'place' ? 'tap inside the room to place your cube' : 'drag or tap to choose the bounce direction');
    hint.classList.remove('hidden');
  } else {
    hint.classList.add('hidden');
  }
}

function clampPos(x, y, s = 64 * U) {
  const h = s / 2;
  return { x: Math.min(AX + AS - h, Math.max(AX + h, x)), y: Math.min(AY + AS - h, Math.max(AY + h, y)) };
}
function overlaps(a, x, y) { const s = sizeOf(a); return a.placed && Math.abs(a.x - x) < s && Math.abs(a.y - y) < s; }

function launch(p, dx, dy) {
  const l = Math.hypot(dx, dy) || 1;
  p.vx = dx / l * baseSpeed(); p.vy = dy / l * baseSpeed();
}

function placeCpu(p) {
  const other = players[1 - p.i];
  for (let tries = 0; tries < 50; tries++) {
    const pos = clampPos(AX + Math.random() * AS, AY + Math.random() * AS);
    const far = Math.hypot(pos.x - other.x, pos.y - other.y) >= orbitOf(p) * 1.4;
    // Prefer a spot away from the player; otherwise take any spot that doesn't overlap
    if (far || (tries === 49 && !overlaps(other, pos.x, pos.y))) { p.x = pos.x; p.y = pos.y; break; }
    if (tries === 49) { p.x = AX + AS - sizeOf(p); p.y = AY + AS - sizeOf(p); }
  }
  p.placed = true;
  const a = (Math.floor(Math.random() * 4) + 0.25 + Math.random() * 0.5) * Math.PI / 2;
  launch(p, Math.cos(a), Math.sin(a));
}

function finishPlacing() {
  if (placing === 0) {
    if (players[1].isCpu) { placeCpu(players[1]); startCountdown(); }
    else { placing = 1; state = 'place'; }
  } else startCountdown();
}
function startCountdown() { state = 'countdown'; countdown = 2.4; sfx(440, 0.12); }

canvas.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener('pointerdown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (state === 'play') {
    buttons.forEach((b, i) => {
      if (players[i] && !players[i].isCpu && Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r + 10) usePower(players[i]);
    });
    return;
  }
  const p = players[placing];
  if (state === 'place') {
    const pos = clampPos(e.clientX, e.clientY);
    if (overlaps(players[1 - placing], pos.x, pos.y)) return;
    p.x = pos.x; p.y = pos.y; p.placed = true;
    state = 'aim';
    sfx(330, 0.05);
    updateHint();
  } else if (state === 'aim') {
    aimPress = true;
  }
});
canvas.addEventListener('pointerup', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  const p = players[placing];
  if (state === 'aim' && aimPress) {
    aimPress = false;
    let dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.hypot(dx, dy) < 5) { dx = 1; dy = 1; }
    launch(p, dx, dy);
    sfx(500, 0.06);
    finishPlacing();
  }
  updateHint();
});

document.addEventListener('keydown', e => {
  if (state !== 'play' || e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'a' || (mode === '1p' && k === ' ')) { usePower(players[0]); e.preventDefault(); }
  if (k === 'l' && mode === '2p') usePower(players[1]);
});

// ---------- Spikes ----------
// Returns each spike's current position and shape
function getSpikes(p) {
  const def = SPIKES[p.spike], u = unit(p);
  const grow = (p.rage > 0 ? 1.7 : 1) * (p.unit ? 1 : mods.spikeScale);
  const out = [];
  for (let i = 0; i < def.count; i++) {
    const a = p.angle + i * Math.PI * 2 / def.count;
    out.push({ ...spikeAt(p, a), a, kind: def.kind, len: (def.len || 0) * u * grow, w: (def.w || 0) * u * grow, r: (def.r || 0) * u * grow });
  }
  return out;
}
function spikeAt(p, a) {
  const def = SPIKES[p.spike];
  let R = orbitOf(p) * def.orbit;
  if (def.pulse) R *= 1 + 0.3 * Math.sin(a * 1.5);
  return { x: p.x + Math.cos(a) * R, y: p.y + Math.sin(a) * R, R };
}
function triPoints(s) {
  const c = Math.cos(s.a), n = Math.sin(s.a);
  const bx = s.x - c * s.len / 2, by = s.y - n * s.len / 2;
  return [
    { x: s.x + c * s.len / 2, y: s.y + n * s.len / 2 },
    { x: bx - n * s.w / 2, y: by + c * s.w / 2 },
    { x: bx + n * s.w / 2, y: by - c * s.w / 2 },
  ];
}
function spikeHitsBox(s, b) {
  const h = sizeOf(b) / 2;
  if (s.kind === 'tri') {
    const pts = triPoints(s);
    // Sample along the spike's center line too, so long blades hit properly
    for (let t = -0.5; t <= 0.5; t += 0.25) pts.push({ x: s.x + Math.cos(s.a) * s.len * t, y: s.y + Math.sin(s.a) * s.len * t });
    return pts.some(pt => Math.abs(pt.x - b.x) < h && Math.abs(pt.y - b.y) < h);
  }
  const dx = Math.max(Math.abs(s.x - b.x) - h, 0), dy = Math.max(Math.abs(s.y - b.y) - h, 0);
  return dx * dx + dy * dy < s.r * s.r;
}

// ---------- Powers ----------
function usePower(p) {
  if (!p || state !== 'play' || p.powerCd > 0 || p.frozen > 0) return;
  const opp = players[1 - p.i], def = POWERS[p.power];
  p.powerCd = def.cd;
  p.powersUsed++;
  if (p.power === 'dash') p.dash = 2.5;
  if (p.power === 'shield') p.shield = 1.5;
  if (p.power === 'freeze') { opp.frozen = 2.5; burst(opp.x, opp.y, def.color, 18); }
  if (p.power === 'rage') p.rage = 3;
  if (p.power === 'heal') { p.hp = Math.min(p.maxHp, p.hp + 4); burst(p.x, p.y, def.color, 14); }
  if (p.power === 'blink') {
    burst(p.x, p.y, def.color, 14);
    for (let t = 0; t < 12; t++) {
      const a = Math.random() * Math.PI * 2;
      const pos = clampPos(opp.x + Math.cos(a) * orbitOf(p) * 0.9, opp.y + Math.sin(a) * orbitOf(p) * 0.9);
      if (!overlaps(opp, pos.x, pos.y)) { p.x = pos.x; p.y = pos.y; break; }
    }
    burst(p.x, p.y, def.color, 14);
  }
  popups.push({ x: p.x, y: p.y - sizeOf(p), text: def.name.toUpperCase() + '!', color: def.color, life: 0.9 });
  sfx(300, 0.25, 'sawtooth', 0.04, 3);
}

function cpuThink(p, dt) {
  const d = DIFFICULTIES[difficulty];
  p.aiTimer -= dt;
  if (p.powerCd > 0 || p.frozen > 0 || p.aiTimer > 0) return;
  p.aiTimer = d.think;
  const opp = players[1 - p.i];
  if (Math.random() > d.smart) { if (Math.random() < 0.15) usePower(p); return; }
  const dist = Math.hypot(opp.x - p.x, opp.y - p.y), R = orbitOf(p);
  const near = (spikes, target, k) => spikes.some(s => Math.hypot(s.x - target.x, s.y - target.y) < sizeOf(target) * k);
  const want = {
    dash: dist < R * 2.5 && ((opp.x - p.x) * p.vx + (opp.y - p.y) * p.vy) > 0,
    shield: near(getSpikes(opp), p, 1.6),
    freeze: near(getSpikes(p), opp, 1.4),
    rage: dist < R * 1.6,
    heal: p.hp <= p.maxHp - 10,
    blink: dist > R * 1.5,
  };
  if (want[p.power]) usePower(p);
}

// ---------- Update ----------
function burst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (60 + Math.random() * 180) * U;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4 + Math.random() * 0.3, color });
  }
}

function update(dt) {
  clock += dt;
  for (const pt of particles) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; }
  particles = particles.filter(pt => pt.life > 0);
  for (const pp of popups) { pp.y -= 30 * dt; pp.life -= dt; }
  popups = popups.filter(pp => pp.life > 0);
  shake = Math.max(0, shake - dt * 30);

  if (state === 'countdown') {
    const before = Math.ceil(countdown / 0.8);
    countdown -= dt;
    if (Math.ceil(countdown / 0.8) !== before && countdown > 0) sfx(440, 0.12);
    if (countdown <= 0) { state = 'play'; sfx(880, 0.2); }
    return;
  }
  if (state !== 'play') return;
  elapsed += dt;
  // Gets faster over time so matches don't drag on
  const speedMul = Math.min(4, 1 + elapsed / 25);

  for (const p of players) {
    const h = sizeOf(p) / 2;
    p.powerCd = Math.max(0, p.powerCd - dt * mods.powerRate);
    for (const k of ['dash', 'shield', 'frozen', 'rage', 'hitCd', 'flash']) p[k] = Math.max(0, p[k] - dt);
    if (p.isCpu) cpuThink(p, dt);
    if (p.frozen > 0) continue;
    const m = speedMul * (p.dash > 0 ? 2 : 1);
    p.x += p.vx * m * dt;
    p.y += p.vy * m * dt;
    if (p.x < AX + h) { p.x = AX + h; p.vx = Math.abs(p.vx); }
    if (p.x > AX + AS - h) { p.x = AX + AS - h; p.vx = -Math.abs(p.vx); }
    if (p.y < AY + h) { p.y = AY + h; p.vy = Math.abs(p.vy); }
    if (p.y > AY + AS - h) { p.y = AY + AS - h; p.vy = -Math.abs(p.vy); }
    p.angle += SPIKES[p.spike].spin * p.spin * speedMul * (p.rage > 0 ? 1.6 : 1) * dt;
  }

  // Cube vs cube bounce. A frozen cube acts like a wall.
  const [a, b] = players;
  const S = sizeOf(a);
  const ox = S - Math.abs(a.x - b.x), oy = S - Math.abs(a.y - b.y);
  if (ox > 0 && oy > 0) {
    const aF = a.frozen > 0, bF = b.frozen > 0;
    const shareA = aF && !bF ? 0 : bF && !aF ? 1 : 0.5;
    const axis = ox < oy ? 'x' : 'y', v = 'v' + axis, over = ox < oy ? ox : oy;
    const dir = a[axis] < b[axis] ? -1 : 1;
    a[axis] += dir * over * shareA; b[axis] -= dir * over * (1 - shareA);
    if ((b[axis] - a[axis]) * (b[v] - a[v]) < 0) {
      if (aF && !bF) b[v] = -b[v];
      else if (bF && !aF) a[v] = -a[v];
      else [a[v], b[v]] = [b[v], a[v]];
      sfx(180, 0.05, 'triangle', 0.05);
    }
  }

  // Spikes deal 1 damage to the other cube
  for (const atk of players) {
    const tgt = players[1 - atk.i];
    if (atk.hitCd > 0) continue;
    const hit = getSpikes(atk).find(s => spikeHitsBox(s, tgt));
    if (!hit) continue;
    atk.hitCd = SPIKES[atk.spike].hitCd || HIT_COOLDOWN;
    if (tgt.shield > 0) { burst(hit.x, hit.y, '#29f0ff', 3); continue; }
    tgt.hp = Math.max(0, tgt.hp - 1);
    atk.dealt++;
    tgt.flash = 0.15;
    shake = Math.min(8, shake + 1.5);
    burst(hit.x, hit.y, atk.color);
    if (clock - lastHitSound > 0.06) { lastHitSound = clock; sfx(120 + Math.random() * 60, 0.06, 'square', 0.035); }
  }

  const dead = players.filter(p => p.hp <= 0);
  if (dead.length) endMatch(dead);
}

// ============================================================================
// End of match: coins, score, challenges
// ============================================================================
function matchCoins(p, winner) {
  const won = p === winner;
  let c;
  if (mode === '1p') c = won ? DIFFICULTIES[difficulty].coins : 3;
  else c = !winner ? 5 : won ? 15 : 5;
  if (isEvent) c *= 1.5;
  if (weekInfo().event.coinRush) c *= 2;
  return Math.round(c);
}
function matchStats(p, winner) {
  const won = p === winner;
  const s = { play: 1, damage: p.dealt, power: p.powersUsed };
  if (isEvent) s.eventplay = 1;
  if (won) {
    s['win' + mode] = 1;
    s['win_' + p.spike] = 1;
    if (p.hp >= 50) s.bigwin = 1;
    if (mode === '1p' && difficulty === 'hard') s.winHard = 1;
  }
  return s;
}

async function endMatch(dead) {
  state = 'over';
  $('quitBtn').classList.add('hidden');
  const winner = dead.length === 2 ? null : players.find(p => p.hp > 0);
  const text = $('winText');
  text.textContent = winner ? `${winner.name} wins!` : 'Draw!';
  text.style.color = winner ? winner.color : '#fff';
  [523, 659, 784].forEach((f, i) => setTimeout(() => sfx(f, 0.15, 'square', 0.04), i * 110));
  const results = $('results');
  const humans = players.filter(p => !p.isCpu);
  const sessions = humans.map(p => (p.i === 0 ? auth1 : auth2));
  results.innerHTML = sessions.some(Boolean) ? '<div class="fine">Saving…</div>' : '';
  setTimeout(() => { if (state === 'over') $('over').classList.remove('hidden'); }, 700);

  const lines = [];
  if (mode === '2p' && winner) lines.push(`<div class="fine">${escapeHtml(winner.name)} won with ${winner.hp} HP left</div>`);
  const challenges = dailyChallenges();
  for (const [k, p] of humans.entries()) {
    const sess = sessions[k], coins = matchCoins(p, winner), name = `<b style="color:${p.color}">${escapeHtml(p.name)}</b>`;
    if (!sess) {
      lines.push(`<div class="line">${name}: ${coinHtml(coins)} coins not saved. Log in to keep coins${mode === '2p' ? ' and score' : ''}.</div>`);
      continue;
    }
    try {
      let scoreLine = '', done = [];
      const before = {};
      await mutateUser(sess, d => {
        rollDaily(d);
        const won = p === winner;
        d.coins += coins;
        if (mode === '1p') { if (won) d.wins1p++; else if (winner) d.losses1p++; }
        else if (winner) {
          // Winner gains their remaining HP; loser loses the same amount
          const old = d.score;
          d.score = Math.max(0, old + (won ? winner.hp : -winner.hp));
          if (won) d.wins2p++; else d.losses2p++;
          const diff = d.score - old;
          scoreLine = ` · Score ${old} → <b>${d.score}</b> <span class="${diff >= 0 ? 'up' : 'down'}">(${diff >= 0 ? '+' : ''}${diff})</span>`;
        }
        const stats = matchStats(p, winner);
        for (const c of challenges) before[c.id] = (d.daily.progress[c.metric] || 0) >= c.target;
        for (const [key, v] of Object.entries(stats)) {
          if (challenges.some(c => c.metric === key)) d.daily.progress[key] = (d.daily.progress[key] || 0) + v;
        }
        done = challenges.filter(c => !before[c.id] && (d.daily.progress[c.metric] || 0) >= c.target);
      });
      lines.push(`<div class="line">${name}: <span class="up">+${coins}</span> ${coinHtml('')}${scoreLine}</div>`);
      done.forEach(c => lines.push(`<div class="line">${name}: challenge done! “${escapeHtml(c.text)}”. Claim ${coinHtml(c.reward)} in Events.</div>`));
    } catch (e) {
      lines.push(`<div class="line down">${name}: couldn't save this match. ${escapeHtml(e.message)}</div>`);
    }
  }
  if (isEvent) lines.push(`<div class="fine">Event match bonus: +50% coins</div>`);
  if (state === 'over') results.innerHTML = lines.join('');
}

// ============================================================================
// Drawing
// ============================================================================
const STARS = Array.from({ length: 9 }, (_, i) => ({ x: ((i * 37) % 100) / 100 - 0.5, y: ((i * 61 + 17) % 100) / 100 - 0.5, p: i }));

function drawSkin(c, x, y, s, skin, t) {
  const h = s / 2, l = x - h, top = y - h;
  c.save();
  if (skin === 'checker') {
    const n = 4, q = s / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { c.fillStyle = (i + j) % 2 ? '#111' : '#fff'; c.fillRect(l + i * q, top + j * q, q + 0.5, q + 0.5); }
    c.strokeStyle = '#fff'; c.lineWidth = Math.max(1, s * 0.04); c.strokeRect(l, top, s, s);
  } else if (skin === 'neon') {
    c.fillStyle = '#0b0b14'; c.fillRect(l, top, s, s);
    c.shadowColor = '#ff2bd6'; c.shadowBlur = s * 0.35;
    c.strokeStyle = '#ff2bd6'; c.lineWidth = s * 0.1; c.strokeRect(l + s * 0.05, top + s * 0.05, s * 0.9, s * 0.9);
    c.shadowColor = '#29f0ff'; c.strokeStyle = '#29f0ff'; c.lineWidth = s * 0.05; c.strokeRect(l + s * 0.25, top + s * 0.25, s * 0.5, s * 0.5);
  } else if (skin === 'ice') {
    const g = c.createLinearGradient(l, top, l + s, top + s);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#a6e6ff'); g.addColorStop(1, '#4fb3e8');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    c.fillStyle = 'rgba(255,255,255,.6)';
    c.beginPath(); c.moveTo(l, top); c.lineTo(l + s * 0.55, top); c.lineTo(l, top + s * 0.55); c.fill();
  } else if (skin === 'candy') {
    c.fillStyle = '#ff7ac0'; c.fillRect(l, top, s, s);
    c.beginPath(); c.rect(l, top, s, s); c.clip();
    c.strokeStyle = '#fff'; c.lineWidth = s * 0.12;
    const off = (t * s * 0.4) % (s * 0.5);
    for (let k = -2; k < 5; k++) { const sx = l + k * s * 0.5 + off; c.beginPath(); c.moveTo(sx, top); c.lineTo(sx + s, top + s); c.stroke(); }
  } else if (skin === 'lava') {
    const off = Math.sin(t * 2) * s * 0.4;
    const g = c.createLinearGradient(l, top + off, l + s, top + s + off);
    g.addColorStop(0, '#ffd23f'); g.addColorStop(0.5, '#ff5a00'); g.addColorStop(1, '#a00d00');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    c.strokeStyle = 'rgba(60,0,0,.7)'; c.lineWidth = Math.max(1, s * 0.05);
    c.beginPath(); c.moveTo(l + s * 0.15, top + s * 0.3); c.lineTo(l + s * 0.45, top + s * 0.45); c.lineTo(l + s * 0.4, top + s * 0.8);
    c.moveTo(l + s * 0.45, top + s * 0.45); c.lineTo(l + s * 0.85, top + s * 0.35); c.stroke();
  } else if (skin === 'void') {
    c.fillStyle = '#000'; c.fillRect(l, top, s, s);
    c.shadowColor = '#8b5cf6'; c.shadowBlur = s * (0.25 + 0.15 * Math.sin(t * 3));
    c.strokeStyle = '#fff'; c.lineWidth = Math.max(1, s * 0.05); c.strokeRect(l, top, s, s);
    c.shadowBlur = 0;
    const g = c.createRadialGradient(x, y, 0, x, y, s * 0.4);
    g.addColorStop(0, 'rgba(139,92,246,.8)'); g.addColorStop(1, 'rgba(139,92,246,0)');
    c.fillStyle = g; c.fillRect(l, top, s, s);
  } else if (skin === 'gold') {
    const g = c.createLinearGradient(l, top, l + s, top + s);
    g.addColorStop(0, '#fff6c2'); g.addColorStop(0.45, '#f2c94c'); g.addColorStop(1, '#9a6f00');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    c.beginPath(); c.rect(l, top, s, s); c.clip();
    const sx = l + (((t * 0.6) % 1.6) - 0.3) * s * 2;
    c.fillStyle = 'rgba(255,255,255,.55)';
    c.beginPath(); c.moveTo(sx, top); c.lineTo(sx + s * 0.2, top); c.lineTo(sx - s * 0.3, top + s); c.lineTo(sx - s * 0.5, top + s); c.fill();
  } else if (skin === 'galaxy') {
    const g = c.createRadialGradient(x, y, 0, x, y, s * 0.75);
    g.addColorStop(0, '#7b3fe4'); g.addColorStop(1, '#120526');
    c.fillStyle = g; c.fillRect(l, top, s, s);
    for (const st of STARS) {
      c.globalAlpha = 0.5 + 0.5 * Math.sin(t * 3 + st.p);
      c.fillStyle = '#fff';
      c.fillRect(x + st.x * s * 0.85, y + st.y * s * 0.85, Math.max(1, s * 0.05), Math.max(1, s * 0.05));
    }
  } else if (skin === 'rainbow') {
    const g = c.createLinearGradient(l, top, l + s, top + s);
    for (let i = 0; i <= 4; i++) g.addColorStop(i / 4, `hsl(${(t * 120 + i * 70) % 360}, 90%, 60%)`);
    c.fillStyle = g; c.fillRect(l, top, s, s);
  } else { c.fillStyle = '#fff'; c.fillRect(l, top, s, s); }
  c.restore();
}
function drawStaticSkins(root) {
  root.querySelectorAll('canvas[data-skin]').forEach(cv => {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    drawSkin(c, cv.width / 2, cv.height / 2, cv.width, cv.dataset.skin, 0);
  });
}

function drawCube(p, ghost) {
  const s = sizeOf(p), h = s / 2;
  ctx.save();
  if (ghost) ctx.globalAlpha = 0.5;
  if (p.dash > 0) {
    for (let k = 3; k >= 1; k--) {
      ctx.globalAlpha = 0.12 * (4 - k);
      drawSkin(ctx, p.x - p.vx * 0.02 * k, p.y - p.vy * 0.02 * k, s, p.skin, clock);
    }
    ctx.globalAlpha = 1;
  }
  drawSkin(ctx, p.x, p.y, s, p.skin, clock);
  if (p.flash > 0) { ctx.fillStyle = `rgba(255,60,60,${p.flash / 0.15 * 0.6})`; ctx.fillRect(p.x - h, p.y - h, s, s); }
  if (p.frozen > 0) {
    ctx.fillStyle = 'rgba(160,225,255,.55)'; ctx.fillRect(p.x - h, p.y - h, s, s);
    ctx.strokeStyle = '#dff6ff'; ctx.lineWidth = 2; ctx.strokeRect(p.x - h - 3, p.y - h - 3, s + 6, s + 6);
  }
  if (p.shield > 0) {
    ctx.strokeStyle = POWERS.shield.color; ctx.lineWidth = 3;
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 12);
    ctx.beginPath(); ctx.arc(p.x, p.y, s * 0.95, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.font = `bold ${Math.round(15 * Math.max(U, 0.8))}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillStyle = p.color;
  ctx.fillText(p.name, p.x, p.y - h - 12);
  const bw = s + 10;
  ctx.fillStyle = '#333'; ctx.fillRect(p.x - bw / 2, p.y - h - 9, bw, 5);
  ctx.fillStyle = p.color; ctx.fillRect(p.x - bw / 2, p.y - h - 9, bw * p.hp / p.maxHp, 5);
}

function drawSpikes(c, p) {
  const spikes = getSpikes(p), def = SPIKES[p.spike];
  c.save();
  if (p.rage > 0) { c.shadowColor = POWERS.rage.color; c.shadowBlur = 16; }
  for (const s of spikes) {
    if (s.kind === 'tri') {
      const [t, l, r] = triPoints(s);
      c.fillStyle = p.color;
      c.beginPath(); c.moveTo(t.x, t.y); c.lineTo(l.x, l.y); c.lineTo(r.x, r.y); c.closePath(); c.fill();
    } else if (s.kind === 'saw') {
      const teeth = 10, rot = p.angle * 3;
      c.fillStyle = p.color;
      c.beginPath();
      for (let i = 0; i < teeth * 2; i++) {
        const a = rot + i * Math.PI / teeth, rr = i % 2 ? s.r * 0.7 : s.r;
        c.lineTo(s.x + Math.cos(a) * rr, s.y + Math.sin(a) * rr);
      }
      c.closePath(); c.fill();
      c.fillStyle = '#000'; c.beginPath(); c.arc(s.x, s.y, s.r * 0.25, 0, Math.PI * 2); c.fill();
    } else {
      // Comet: fading trail behind the fireball
      for (let k = 6; k >= 1; k--) {
        const tp = spikeAt(p, s.a - p.spin * k * 0.07);
        c.globalAlpha = 0.5 * (1 - k / 7);
        c.fillStyle = p.color;
        c.beginPath(); c.arc(tp.x, tp.y, s.r * (1 - k / 9), 0, Math.PI * 2); c.fill();
      }
      c.globalAlpha = 1;
      const g = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
      g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ffd23f'); g.addColorStop(1, p.color);
      c.fillStyle = g; c.beginPath(); c.arc(s.x, s.y, s.r, 0, Math.PI * 2); c.fill();
    }
  }
  c.restore();
  c.strokeStyle = 'rgba(255,255,255,0.08)'; c.lineWidth = 1;
  c.beginPath(); c.arc(p.x, p.y, orbitOf(p) * def.orbit, 0, Math.PI * 2); c.stroke();
}

function drawHud() {
  const bw = Math.min(320, W / 2 - 40);
  const top = 12 + safeTop;
  players.forEach((p, i) => {
    const x = i === 0 ? 16 : W - 16 - bw;
    ctx.fillStyle = '#222'; ctx.fillRect(x, top, bw, 22);
    ctx.fillStyle = p.color;
    const w = bw * p.hp / p.maxHp;
    ctx.fillRect(i === 0 ? x : x + bw - w, top, w, 22);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = i === 0 ? 'left' : 'right';
    ctx.fillText(`${p.name}  ${p.hp}`, i === 0 ? x + 6 : x + bw - 6, top + 11);
  });
}

const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
function drawPowerButtons() {
  players.forEach((p, i) => {
    const b = buttons[i], def = POWERS[p.power];
    const ready = p.powerCd <= 0 && p.frozen <= 0;
    ctx.save();
    ctx.globalAlpha = p.isCpu ? 0.55 : 1;
    ctx.fillStyle = '#121216';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    // Recharge ring
    const frac = 1 - p.powerCd / def.cd;
    ctx.strokeStyle = ready ? def.color : '#555'; ctx.lineWidth = 5;
    if (ready) { ctx.shadowColor = def.color; ctx.shadowBlur = 10 + 6 * Math.sin(clock * 6); }
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = ready ? '#fff' : '#888';
    ctx.font = `bold ${Math.round(b.r * 0.36)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(def.name, b.x, b.y - (ready ? 0 : b.r * 0.15));
    if (!ready) {
      ctx.font = `${Math.round(b.r * 0.3)}px system-ui, sans-serif`;
      ctx.fillText(Math.ceil(Math.max(p.powerCd / mods.powerRate, p.frozen)) + 's', b.x, b.y + b.r * 0.28);
    }
    ctx.fillStyle = p.color; ctx.font = 'bold 11px system-ui, sans-serif';
    const label = p.isCpu ? 'CPU' : coarse ? '' : (i === 0 ? (mode === '1p' ? 'A / Space' : 'Key A') : 'Key L');
    if (label) ctx.fillText(label, b.x, b.y - b.r - 10);
    ctx.restore();
  });
}

function drawAimArrow(p) {
  const dx = mouse.x - p.x, dy = mouse.y - p.y;
  const l = Math.hypot(dx, dy) || 1;
  const ex = p.x + dx / l * 110 * U, ey = p.y + dy / l * 110 * U;
  ctx.strokeStyle = p.color; ctx.fillStyle = p.color; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(ex, ey); ctx.stroke();
  const a = Math.atan2(dy, dx);
  ctx.beginPath();
  ctx.moveTo(ex + Math.cos(a) * 14, ey + Math.sin(a) * 14);
  ctx.lineTo(ex + Math.cos(a + 2.5) * 14, ey + Math.sin(a + 2.5) * 14);
  ctx.lineTo(ex + Math.cos(a - 2.5) * 14, ey + Math.sin(a - 2.5) * 14);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 1;
}

// Animated previews on the setup screen and in the shop
function drawPreviews() {
  document.querySelectorAll('#setup canvas.preview').forEach(cv => {
    const size = 120;
    if (cv.width !== size * DPR) { cv.width = size * DPR; cv.height = size * DPR; }
    const c = cv.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.fillStyle = '#000'; c.fillRect(0, 0, size, size);
    if (cv.dataset.i === 'cpu') {
      c.fillStyle = '#555'; c.font = 'bold 44px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('?', 60, 60);
      return;
    }
    const i = +cv.dataset.i, lo = loadouts[i];
    const fake = { x: 60, y: 60, unit: 0.34, spike: lo.spike, skin: lo.skin, color: COLORS[i], angle: clock * SPIKES[lo.spike].spin * (i ? -1 : 1), spin: i ? -1 : 1, rage: 0 };
    drawSpikes(c, fake);
    drawSkin(c, 60, 60, sizeOf(fake), lo.skin, clock);
  });
}
function drawShop() {
  document.querySelectorAll('canvas[data-skin-anim]').forEach(cv => {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    drawSkin(c, cv.width / 2, cv.height / 2, cv.width * 0.6, cv.dataset.skinAnim, clock);
  });
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (!$('setup').classList.contains('hidden')) drawPreviews();
  if (!$('app').classList.contains('hidden') && tab === 'shop') drawShop();
  if (!players.length) return;

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.strokeStyle = isEvent ? 'rgba(192,132,252,0.7)' : 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  ctx.strokeRect(AX - 1, AY - 1, AS + 2, AS + 2);
  ctx.lineWidth = 1;

  for (const p of players) if (p.placed) drawSpikes(ctx, p);
  for (const p of players) if (p.placed) drawCube(p);

  if (state === 'place') {
    const pos = clampPos(mouse.x, mouse.y);
    drawCube({ ...players[placing], x: pos.x, y: pos.y }, true);
  }
  if (state === 'aim') drawAimArrow(players[placing]);

  for (const pt of particles) {
    ctx.globalAlpha = Math.max(0, pt.life * 2);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  for (const pp of popups) {
    ctx.globalAlpha = Math.min(1, pp.life * 2);
    ctx.fillStyle = pp.color; ctx.font = 'bold 18px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHud();
  if (state === 'play' || state === 'countdown') drawPowerButtons();
  if (state === 'countdown') {
    const n = Math.ceil(countdown / 0.8);
    ctx.fillStyle = '#fff'; ctx.font = `800 ${Math.round(90 * U)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.9;
    ctx.fillText(n > 0 ? n : 'GO!', W / 2, H / 2);
    ctx.globalAlpha = 1;
  }
}

// Safe-area inset so the HP bars clear a phone's notch
let safeTop = 0;
(() => {
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top, 0px);visibility:hidden;pointer-events:none';
  document.body.appendChild(probe);
  const set = () => { safeTop = probe.offsetHeight; };
  set(); window.addEventListener('resize', set);
})();

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  // Sub-step so fast cubes and spikes don't skip through each other
  for (let i = 0; i < 4; i++) update(dt / 4);
  draw();
  requestAnimationFrame(loop);
}
show('app');
restoreSession().then(() => { if (!$('app').classList.contains('hidden')) renderApp(); });
requestAnimationFrame(loop);
</script>
</body>
</html>
